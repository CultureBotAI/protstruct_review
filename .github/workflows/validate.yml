name: Hermetic validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.6.13"
          enable-cache: true

      - name: Sync locked development and benchmark environment
        run: uv sync --locked --extra benchmark

      - name: Run hermetic gate
        run: uv run --locked --extra benchmark -- bash scripts/validate.sh

      - name: Verify slide package provenance and figure determinism
        env:
          SLIDES_DIAGNOSTICS_DIR: ${{ runner.temp }}/slides-2026-11-06-diagnostics-${{ matrix.os }}
        run: uv run --locked --extra benchmark --extra slides -- python scripts/test_slides_2026_11_06.py

      - name: Upload slide figure determinism diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slides-2026-11-06-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/slides-2026-11-06-diagnostics-${{ matrix.os }}
          if-no-files-found: ignore
