  # --- T03, independent non-cctbx path -------------------------------------
  - id: EVAL_1sar_cdba2c07_2026-09-07_M_005
    catalog_task_ref: T03
    stage: final
    scope: complex
    scope_selector: 1sar_final (packaged; round-4 output)
    metric_definition_ref: T03_r-work
    oracle_tool_ref: gemmi sfcalc
    oracle_family: non_cctbx
    oracle_measure:
      value_numeric: 0.1622
    pass_criterion: gemmi − phenix.model_vs_data (M_001) R-work offset within 0.005–0.015 (T03 rubric rule 2)
    delta:
      value_numeric: 0.0058
    pass_status: pass
    notes: >-
      Independent non-cctbx code path (gemmi 0.7.5, `sfcalc --radii-set=cctbx`, then
      scripts/gemmi_rfactor.py). Recorded alongside the R-free and gap rows so the
      emitted sheet reports one internally coherent triple from a single code path
      rather than mixing families within one summary block. THIS is the measurement
      `ref/driving_example_T03.md` rubric rule 2 governs — the rule, the assumption
      block and the underlying 15-entry benchmark are all about R-WORK, not R-free.
      The offset against phenix.model_vs_data (M_001) is 0.1622 - 0.1564 = +0.0058:
      inside the expected 0.005-0.015, just below the benchmark median of +0.0069, and
      in the correct direction (gemmi high). Rule 2 therefore passes.
  - id: EVAL_1sar_cdba2c07_2026-09-07_M_006
    catalog_task_ref: T03
    stage: final
    scope: complex
    scope_selector: 1sar_final (packaged; round-4 output)
    metric_definition_ref: T03_r-free
    oracle_tool_ref: gemmi sfcalc
