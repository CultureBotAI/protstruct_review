      of 0.0074 measures the packaging gap, not a misreport. No criterion is applied: the
      series' `match within 0.005` reporting check requires both values be on the same
      input, and they are not. Earlier drafts of this record graded this row
      `fail_by_oracle` on that criterion; that verdict is withdrawn.
  - id: EVAL_1sar_cdba2c07_2026-09-07_M_002
    catalog_task_ref: T03
    stage: final
    scope: complex
    scope_selector: 1sar_final (packaged; round-4 output)
    metric_definition_ref: T03_r-free
    oracle_tool_ref: phenix.model_vs_data
    oracle_family: cctbx
    agent_claim:
      value_numeric: 0.199
    oracle_measure:
      value_numeric: 0.2116
    delta:
      value_numeric: 0.0126
    pass_status: informational
    notes: >-
      MODEL MISMATCH — NOT a reporting-accuracy verdict, and the single most consequential
      correction in this record. `oracle_measure` 0.2116 is phenix.model_vs_data on the
      PACKAGED `data/1sar_final.pdb`, which is the ROUND-4 output. `agent_claim` 0.199 is
      the agent's ROUND-7 value: claude_iterations.log:510 records round 7 at
      "R-work=0.1488, R-free=0.1989", claude_iterations.log:752 names
      /agent/job/1sar_round7_001.pdb as the final deliverable, and 0.1989 appears in four
      provenance transcripts. The round-7 coordinates are absent from the archive entirely.
      So 0.199 rounds from a model the agent really produced; it was never packaged. The
      delta of 0.0126 measures the packaging gap. Every earlier draft of this record, and
      the 2026-05-05 record, treated this as a reporting defect and one draft called the
      value unattributable; ALL OF THOSE VERDICTS ARE WITHDRAWN. Separately and still true:
      the T03 rubric's deposition-tracking rule cannot be evaluated on 1SAR at all, because
      the 1990 deposition records `FREE R VALUE : NULL`. The real defect in the reported
      round 7 is its gap: 0.1989 - 0.1488 = 0.0501, which fails the agent's own < 0.05
      criterion and is reported as "0.050".
  - id: EVAL_1sar_cdba2c07_2026-09-07_M_003
