  - id: EVAL_1sar_cdba2c07_2026-09-07_M_011
    catalog_task_ref: T15
    stage: final
    scope: complex
    scope_selector: 1sar_final (packaged; round-4 output)
    metric_definition_ref: T15_secondary_structure_agreement
    oracle_tool_ref: DSSP + biotite P-SEA
    oracle_family: non_cctbx
    oracle_measure:
      value_numeric: 0.8802
    pass_status: informational
    notes: >-
      First run of T15 on this ARTEFACT (the deposited reference was already measured
      as a committed calibration — see M_012). Three-state (H/E/C) agreement between
      DSSP (H-bond energetics) and biotite P-SEA (Cα geometry): 169/192 concordant,
      0 residues scored by only one. NOT read as a quality signal in either direction:
      ref/thresholds_and_standards.md §3 requires gating on secondary-structure CONTENT
      (DSSP H+E ≥ 0.20), not on agreement, because agreement is degenerate at the bad
      end — noise raises it. scripts/t15_ss_agreement.py does not yet compute content,
      so the governed gate could not be applied and this pair is uninterpretable as a
      pass or a fail. Noted for follow-up: 0.8802 is above every one of the 16 entries
      in the agreement benchmark (0.679–0.850), and 1SAR is β-containing where the
      benchmark expects 0.68–0.72.
