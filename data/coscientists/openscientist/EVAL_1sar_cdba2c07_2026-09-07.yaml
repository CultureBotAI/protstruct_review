      tolerance_benchmark_r_offset.md measures R over the work set on 15 entries and
      rounds its 0.016 envelope to 0.02, and §3's precondition names the same work set.
      Extrapolating it to R-free is a judgement this record makes explicitly, not a
      band the benchmark established for R-free; no R-free-specific offset band exists.
      The verdict would be the same under any envelope wider than 0.002.
