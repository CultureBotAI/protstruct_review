    oracle_family: cctbx
    agent_claim:
      value_numeric: 0.050
    oracle_measure:
      value_numeric: 0.0552
    pass_criterion: gap < 0.05
    delta:
      value_numeric: 0.0052
    pass_status: fail_by_oracle
    notes: >-
      The agent's OWN success criterion (R-work/R-free gap < 0.05), not a registry band.
      On the PACKAGED round-4 model the oracle gap is 0.0552 and the criterion fails.
      NOTE the criterion also fails on the agent's actual reported round 7, independently
      of the packaging problem: 0.1989 - 0.1488 = 0.0501, which the report states as
      "gap=0.050", rounding the failure away. So this is the one substantive defect in the
      reported model that survives the model-mismatch correction. `agent_claim` 0.050 is
      the report's rounded figure. The May record's "3 of 4 code paths fail" belongs to
      this gap criterion, not to the R-free value comparison.
