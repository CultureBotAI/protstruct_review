    pass_status: fail_by_oracle
    notes: >-
      |Δ| = 0.0126 against the oracle recomputation. Graded 2026-09-07 against the
      calibrated band in ref/thresholds_and_standards.md §4 ("R-free vs deposited"):
      |Δ| ≤ 0.01 against a recomputed reference, which is the derivation
      model_vs_data performs. The May review graded the same numbers with the
      pre-benchmark flat "< 0.05 R-work/R-free gap" rule; the verdict is unchanged
      but the instrument is now a measured tolerance rather than a template.
      The agent's own final-model header records FREE R VALUE 0.2114, and no round
      model in the artefact has R-free 0.199 (rounds measured: 0.2364, 0.2293,
      0.2165, 0.2114, 0.2109, 0.2068) — the reported 0.199 is not a stale value
      carried from an earlier round, it corresponds to no model the agent produced.
