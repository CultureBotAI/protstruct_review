    oracle_tool_ref: reduce (standalone, Richardson)
    oracle_family: non_cctbx
    oracle_measure:
      value_numeric: 0
    pass_status: pass
    notes: >-
      Confident flip-set conflicts between the two genuinely independent H builders:
      0 over the 14 flippable Asn/Gln/His residues both scored (reduce called 14,
      reduce2 18 with add_flip_movers=True; agreement 1.000 on the shared set).
      Scored with scripts/bench_t14_flip_sets.py's own build/parse/conflict
      functions, so the "confident" definition matches the benchmark: a disagreement
      counts only where reduce committed (category F or K), not where it wrote X or
      C. Satisfies the "same Asn/Gln/His flip set" clause of the H-placement
      tolerance.
