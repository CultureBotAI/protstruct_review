  rank: 1
  justification: >-
    PDBePISA is the reference service for interface area and biological-assembly
    inference, and is the source the deposited assembly is judged against. Its
    interface_area is per side, so double it before comparing with the harness
    total two-sided BSA; require agreement within max(3% of the mean, 30 Å²)
    with a matched 1.4 Å probe and the benchmarked asymmetric selections:
    biotite protein-only versus PISA's API assembly-molecule surface, which may
    include ligand/hetero atoms.
  evidence_refs:
