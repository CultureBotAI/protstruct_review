  headline_verdict: >-
    This partial T15/T16 follow-up closes the missing oracle-side T15 content
    gate and T16 same-sequence crystallographic-contact mapping control on the packaged round-4 model; it
    does not re-measure or carry forward any other task. T15's
    paired-oracle calculation is interpretable (content 0.3750; agreement 0.8802) but
    does not establish improvement, and the agent-versus-DSSP clause remains
    unevaluable because the report contains no assignment. T16 is strongly
    mapping-dependent (AB:AB 0.9445/High; AB:BA 0.0063/Incorrect) and remains
    informational because A/B is a crystallographic contact. These additions do
    not change the September audit's central finding: the archive packages round
    4 while the report describes an absent round-7 model.
