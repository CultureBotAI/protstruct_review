  headline_verdict: >-
    This partial T16 follow-up adds the same-sequence crystallographic-contact
    mapping control on the packaged round-4 model; it does not re-measure or carry
    forward any other task. Draft T15 measurements were retracted because the
    load-bearing Gemmi-normalized input and raw assignments were not retained, so
    they could not satisfy this record's evidence standard without a new
    scientific rerun, which was outside this update's scope and was not performed.
    T16 is strongly mapping-dependent (AB:AB 0.944527/High;
    AB:BA 0.006321/Incorrect) and remains informational because A/B is a
    crystallographic contact. These additions do not change the September audit's
    central finding: the archive packages round 4 while the report describes an
    absent round-7 model.
