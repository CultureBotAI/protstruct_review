  role: top_performing
  rank: 1
  justification: >-
    Installed and runnable now (scripts/t15_ss_agreement.py): DSSP vs biotite
    P-SEA three-state agreement. biotite's Cα-geometry P-SEA is a different
    algorithm family from DSSP's H-bond energetics, so the agreement is
    informative rather than tautological. Report agreement and DSSP H+E content
    informationally; content ≥0.20 is a provisional interpretability
    precondition, not a quality verdict. The historical 0.65 value is provisional
    and non-gradeable until exact-denominator recalibration. Stands in for STRIDE,
    which is not currently installable via Homebrew. This is distinct from the
    agent-vs-DSSP ≥0.85 clause, which is unevaluable without agent labels.
  evidence_refs:
