    from 2026-09-21, not rerun: AB:AB is 0.944527/High versus the AB:BA mapping
    control at 0.006321/Incorrect. That contrast shows the mapping is
    load-bearing, while A/B remains a crystallographic contact rather than a
    certified biological assembly. No other task is included; the earlier
    archive/report-version mismatch was not re-evaluated by this partial sheet.
