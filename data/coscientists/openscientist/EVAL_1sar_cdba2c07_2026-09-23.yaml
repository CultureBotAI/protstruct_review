  metric_definition_ref: T15_secondary_structure_agreement
  tool_ref: DSSP
  role: top_considered
  rank: 1
  justification: DSSP is the reference implementation for secondary-structure assignment.
    For the oracle-side T15 result, report its H+E content with three-state agreement
    from an independent second assigner. Content ≥0.20 is only a provisional, informational
    precondition on how much weight to give the agreement; it is not a model-quality
