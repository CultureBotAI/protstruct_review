  metric_definition_ref: T03_r-work
  tool_ref: gemmi sfcalc
  role: top_performing
  rank: 1
  justification: Independent non-cctbx R-work cross-check. For the same model, MTZ,
    work set and cctbx mask radii, directly sum the globally scaled `gemmi sfcalc`
    FC values and grade the absolute offset against registry §3. The 15-entry benchmark
    found gemmi high in every case, but sign is diagnostic rather than a pass condition.
    The packaged 1SAR +0.0058 value came from an extra bin-rescaled estimator and
    is therefore informational, not a benchmarked pass. Neither comparison adjudicates
    a claim about a different model.
  evidence_refs:
  - ref/research/tolerance_benchmark_r_offset.md
  - EVAL_1sar_cdba2c07_2026-09-07
