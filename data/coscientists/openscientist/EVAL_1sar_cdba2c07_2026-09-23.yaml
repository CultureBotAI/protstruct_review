tool_recommendations:
- id: REC_T01_ca_rmsd_top_considered
  metric_definition_ref: T01_ca_rmsd_å
  tool_ref: TM-align
  role: top_considered
  rank: 1
  justification: Sequence-independent superposition; CASP/community gold-standard
    for pair-of-structures RMSD when alignment quality matters.
  evidence_refs:
  - Zhang2004
  as_of_date: '2026-04-25'
  effective_at: '2026-04-25T00:00:00+00:00'
- id: REC_T01_ca_rmsd_top_performing
  metric_definition_ref: T01_ca_rmsd_å
  tool_ref: TM-align
  role: top_performing
  rank: 1
  justification: Matched phenix.superpose_models within 0.03 Å on the 1SAR eval (TM-align
    0.41 Å vs PHENIX 0.43 Å vs agent-reported 0.438 Å).
  evidence_refs:
  - EVAL_1sar_cdba2c07_2026-04-24
  as_of_date: '2026-04-25'
  effective_at: '2026-04-25T00:00:00+00:00'
- id: REC_T01_ca_rmsd_alternative
  metric_definition_ref: T01_ca_rmsd_å
  tool_ref: gemmi align
  role: alternative
  rank: 2
  justification: Lightweight, scriptable second oracle. Use when TM-align is unavailable
    or when a non-Zhang-lab implementation is needed.
  as_of_date: '2026-04-25'
  effective_at: '2026-04-25T00:00:00+00:00'
- id: REC_T01_tm_score_top_considered
  metric_definition_ref: T01_tm-score
  tool_ref: TM-align
  role: top_considered
  rank: 1
  justification: TM-score is the metric and TM-align is its reference implementation.
  evidence_refs:
  - Zhang2004
  as_of_date: '2026-04-25'
  effective_at: '2026-04-25T00:00:00+00:00'
- id: REC_T03_r_work_top_considered
  metric_definition_ref: T03_r-work
  tool_ref: phenix.model_vs_data
  role: top_considered
  rank: 1
  justification: Catalog-defined T06 oracle; re-derives R-factors from PDB+MTZ with
    its own scaling, rather than reading them from a refinement log.
  evidence_refs:
  - Brünger1992
  - EvansMurshudov2013
  as_of_date: '2026-04-25'
  effective_at: '2026-04-25T00:00:00+00:00'
- id: REC_T03_r_work_top_performing
  metric_definition_ref: T03_r-work
  tool_ref: gemmi sfcalc
  role: top_performing
  rank: 1
  justification: 'Non-cctbx independent code path that brackets phenix.model_vs_data
    rather than adjudicating it: on the same model, MTZ and work set it reads higher
    in R-work in 15 of 15 benchmarked entries (median +0.0069, max +0.0151; governed
    envelope |ΔR| ≤ 0.02, ref/research/tolerance_benchmark_r_offset.md). The offset
    is one-sided, so a gemmi R-work at or below PHENIX''s is the red flag — a negative
    Δ is off-distribution. On the packaged 1SAR model it gives 0.1622 against PHENIX''s
    0.1564. It does not grade an agent''s claim — ref/tool_assumptions.yaml forbids
    reporting the gemmi number as the claim being wrong — and an earlier version of
    this entry that said it "hardened the agent''s R-free is too low finding" is withdrawn:
    that finding compared oracle measurements of a round-4 model against a round-7
    claim and was retracted in EVAL_1sar_cdba2c07_2026-09-07.'
  evidence_refs:
  - EVAL_1sar_cdba2c07_2026-04-24
  - EVAL_1sar_cdba2c07_2026-09-07
  as_of_date: '2026-09-09'
  effective_at: '2026-09-09T00:00:00+00:00'
- id: REC_T03_r_work_alternative_servalcat
  metric_definition_ref: T03_r-work
  tool_ref: Servalcat
  role: alternative
  rank: 2
  justification: Murshudov-group implementation; per-shell R via `servalcat sigmaa`.
    Independent code base; preferred when REFMAC5 is unavailable.
  evidence_refs:
  - Yamashita2021
  as_of_date: '2026-04-25'
  effective_at: '2026-04-25T00:00:00+00:00'
- id: REC_T03_r_free_top_considered
  metric_definition_ref: T03_r-free
  tool_ref: phenix.model_vs_data
  role: top_considered
  rank: 1
  justification: Same as R-work — re-derives from data; never read from refinement
    log alone.
  evidence_refs:
  - Brünger1992
  as_of_date: '2026-04-25'
  effective_at: '2026-04-25T00:00:00+00:00'
- id: REC_T03_r_free_top_performing
  metric_definition_ref: T03_r-free
  tool_ref: gemmi sfcalc
  role: top_performing
  rank: 1
  justification: Non-cctbx bracket on R-free from an independent code path — corroborative,
    not an independent verdict (EVAL_1sar_cdba2c07_2026-09-07 M_006). An earlier version
    of this entry called it "confirmation of R-free finding on 1SAR eval"; that finding
    compared oracle measurements of the packaged round-4 model against the agent's
    round-7 claim and is withdrawn in the same record. No R-free-specific offset band
    is benchmarked; the |ΔR| ≤ 0.02 envelope applied to it is R-work-derived.
  evidence_refs:
  - EVAL_1sar_cdba2c07_2026-04-24
  - EVAL_1sar_cdba2c07_2026-09-07
  as_of_date: '2026-09-09'
  effective_at: '2026-09-09T00:00:00+00:00'
- id: REC_T03_gap_top_considered
  metric_definition_ref: T03_r-free_r-work_gap
  tool_ref: phenix.model_vs_data
  role: top_considered
  rank: 1
  justification: The gap is computed from the same R-work / R-free pair, so the strongest
    tool for those is also the strongest for the gap.
  as_of_date: '2026-04-25'
  effective_at: '2026-04-25T00:00:00+00:00'
- id: REC_T05_clashscore_top_considered
  metric_definition_ref: T05_clashscore
  tool_ref: MolProbity (gold)
  role: top_considered
  rank: 1
  justification: Standalone Richardson-lab pipeline (probe + reduce) is the catalog
    gold standard. Same code that powers the wwPDB validation report.
  evidence_refs:
  - Davis2007
  - Williams2018
  as_of_date: '2026-04-25'
  effective_at: '2026-04-25T00:00:00+00:00'
- id: REC_T05_clashscore_top_performing
  metric_definition_ref: T05_clashscore
  tool_ref: MolProbity (gold)
  role: top_performing
  rank: 1
  justification: 11 unique clashes / 3027 atoms = 3.63 on 1SAR eval, in line with
    mmtbx.validation_summary's 3.13 (Δ = 0.5, within MolProbity method noise — different
    H-build / water handling).
  evidence_refs:
  - EVAL_1sar_cdba2c07_2026-04-24
  as_of_date: '2026-04-25'
  effective_at: '2026-04-25T00:00:00+00:00'
- id: REC_T05_clashscore_top_performing_2026_09_23
  metric_definition_ref: T05_clashscore
  tool_ref: MolProbity (gold)
  role: top_performing
  rank: 1
  justification: The retained matched-H-convention benchmark reports a pipeline residual
    between the cctbx path and standalone reduce/probe. Both paths build hydrogens
    separately; identical H coordinates and hetero dictionaries were not demonstrated,
    so the cause of the residual is unresolved. The historical 1SAR headline difference
    (3.13 versus 3.63) likewise does not isolate an H-builder or counting effect.
    Its causal explanation is withdrawn; this registry correction claims no new run.
  evidence_refs:
  - ref/research/tolerance_benchmark_clashscore_h.md
  - ref/research/tolerance_benchmark_flip_sets.md
  - scripts/bench_t05_clashscore_h.py
  as_of_date: '2026-09-23'
  effective_at: '2026-09-23T06:55:50+00:00'
  supersedes_recommendation_ref: REC_T05_clashscore_top_performing
- id: REC_T05_clashscore_alternative_phenix
  metric_definition_ref: T05_clashscore
  tool_ref: mmtbx.validation_summary
  role: alternative
  rank: 2
  justification: cctbx wrapper. Acceptable as a second opinion but does not satisfy
    the trust model on its own (PHENIX-grading-PHENIX). Use with the Richardson-lab
    standalone pipeline alongside.
  as_of_date: '2026-04-25'
  effective_at: '2026-04-25T00:00:00+00:00'
- id: REC_T05_rama_outlier_top_considered
  metric_definition_ref: T05_ramachandran_outlier
  tool_ref: MolProbity (gold)
  role: top_considered
  rank: 1
  justification: MolProbity Top8000 reference dataset is the field standard for Ramachandran
    percentile classification.
