  tool_ref: MolProbity (gold)
  role: top_considered
  rank: 1
  justification: Use one counter consistently for each builder's pre/post diagnostic.
    The registered cctbx-versus-probe envelope applies only when both counters score
    identical H-built coordinates under a matched H convention; it does not grade
    the difference between changes produced by distinct H builders.
  as_of_date: '2026-09-22'
  effective_at: '2026-09-22T09:00:00+00:00'
  supersedes_recommendation_ref: REC_T14_clashscore_delta_pre_vs_post_top_considered
