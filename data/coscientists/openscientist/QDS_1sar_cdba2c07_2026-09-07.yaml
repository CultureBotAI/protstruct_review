  tool_recommendations_applied:
  - id: REC_T03_r_work_top_considered
    metric_definition_ref: T03_r-work
    tool_ref: phenix.model_vs_data
    role: top_considered
    rank: 1
    justification: Catalog-defined T06 oracle; re-derives R-factors from PDB+MTZ with
      its own scaling, rather than reading them from a refinement log.
    evidence_refs:
    - Brünger1992
    - EvansMurshudov2013
    as_of_date: '2026-04-25'
  - id: REC_T03_r_work_top_performing
    metric_definition_ref: T03_r-work
    tool_ref: gemmi sfcalc
    role: top_performing
    rank: 1
    justification: 'Non-cctbx independent code path that brackets phenix.model_vs_data
      rather than adjudicating it: on the same model, MTZ and work set it reads higher
      in R-work in 15 of 15 benchmarked entries (median +0.0069, max +0.0151; governed
      envelope |ΔR| ≤ 0.02, ref/research/tolerance_benchmark_r_offset.md). The offset
      is one-sided, so a gemmi R-work at or below PHENIX''s is the red flag — a negative
      Δ is off-distribution. On the packaged 1SAR model it gives 0.1622 against PHENIX''s
      0.1564. It does not grade an agent''s claim — ref/tool_assumptions.yaml forbids
      reporting the gemmi number as the claim being wrong — and an earlier version
      of this entry that said it "hardened the agent''s R-free is too low finding"
      is withdrawn: that finding compared oracle measurements of a round-4 model against
      a round-7 claim and was retracted in EVAL_1sar_cdba2c07_2026-09-07.'
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
    - EVAL_1sar_cdba2c07_2026-09-07
    as_of_date: '2026-09-09'
  - id: REC_T03_r_work_alternative_servalcat
    metric_definition_ref: T03_r-work
    tool_ref: Servalcat
    role: alternative
    rank: 2
    justification: Murshudov-group implementation; per-shell R via `servalcat sigmaa`.
      Independent code base; preferred when REFMAC5 is unavailable.
    evidence_refs:
    - Yamashita2021
    as_of_date: '2026-04-25'
  - id: REC_T03_r_free_top_considered
    metric_definition_ref: T03_r-free
    tool_ref: phenix.model_vs_data
    role: top_considered
    rank: 1
    justification: Same as R-work — re-derives from data; never read from refinement
      log alone.
    evidence_refs:
    - Brünger1992
    as_of_date: '2026-04-25'
  - id: REC_T03_r_free_top_performing
    metric_definition_ref: T03_r-free
    tool_ref: gemmi sfcalc
    role: top_performing
    rank: 1
    justification: Non-cctbx bracket on R-free from an independent code path — corroborative,
      not an independent verdict (EVAL_1sar_cdba2c07_2026-09-07 M_006). An earlier
      version of this entry called it "confirmation of R-free finding on 1SAR eval";
      that finding compared oracle measurements of the packaged round-4 model against
      the agent's round-7 claim and is withdrawn in the same record. No R-free-specific
      offset band is benchmarked; the |ΔR| ≤ 0.02 envelope applied to it is R-work-derived.
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
    - EVAL_1sar_cdba2c07_2026-09-07
    as_of_date: '2026-09-09'
  - id: REC_T03_gap_top_considered
    metric_definition_ref: T03_r-free_r-work_gap
    tool_ref: phenix.model_vs_data
    role: top_considered
    rank: 1
    justification: The gap is computed from the same R-work / R-free pair, so the
      strongest tool for those is also the strongest for the gap.
    as_of_date: '2026-04-25'
  - id: REC_T03_r_work_top_performing_refmac
    metric_definition_ref: T03_r-work
    tool_ref: REFMAC5
    role: alternative
    rank: 3
    justification: Once installed, REFMAC5 is the canonical second-opinion refiner
      (PDB-REDO methodology, Joosten 2012). Re-refine the model with REFMAC and report
      whether R-work / R-free converge within ~0.01-0.02 of the agent's PHENIX numbers.
      Currently rank 3 (gemmi sfcalc + Servalcat are easier installs); promote to
      rank 1 once REFMAC re-refinement is the default path.
    evidence_refs:
    - Joosten2012
    as_of_date: '2026-04-30'
  - id: REC_T15_secondary_structure_agreement_top_considered
    metric_definition_ref: T15_secondary_structure_agreement
    tool_ref: DSSP
    role: top_considered
    rank: 1
    justification: DSSP is the reference implementation for secondary-structure assignment.
      The gradeable T15 metric is three-state agreement between two independent assigners,
      so DSSP is paired with STRIDE rather than used alone.
    as_of_date: '2026-07-20'
  - id: REC_T15_secondary_structure_agreement_alternative
    metric_definition_ref: T15_secondary_structure_agreement
    tool_ref: STRIDE
    role: alternative
    rank: 2
    justification: STRIDE is the independent second assigner in the agreement pair.
      It uses hydrogen-bond energy plus dihedral criteria, so it fails differently
      from DSSP — which is what makes the agreement informative rather than tautological.
    as_of_date: '2026-07-20'
  - id: REC_T16_interface_dockq_score_top_considered
    metric_definition_ref: T16_interface_dockq_score
    tool_ref: DockQ
    role: top_considered
    rank: 1
    justification: DockQ is the community-standard continuous interface-quality score
      and the basis of the CAPRI quality classes; CAPRI class is recorded alongside
      it as the ordinal label.
    as_of_date: '2026-07-20'
  - id: REC_T16_interface_dockq_score_top_performing
    metric_definition_ref: T16_interface_dockq_score
    tool_ref: DockQ
    role: top_performing
    rank: 1
    justification: 'Installed and runnable now (scripts/t16_interface_quality.py,
      DockQ 2.1.3): scores a model complex against the deposited reference and derives
      the CAPRI class. Identity calibration on 1sar A/B -> 1.000.'
    as_of_date: '2026-07-22'
  - id: REC_T16_interface_buried_surface_area_top_considered
    metric_definition_ref: T16_interface_buried_surface_area
    tool_ref: PISA/PDBePISA
    role: top_considered
    rank: 1
    justification: PDBePISA is the reference service for interface area and biological-assembly
      inference, and is the source the deposited assembly is judged against.
    as_of_date: '2026-07-20'
  - id: REC_T16_interface_buried_surface_area_top_performing
    metric_definition_ref: T16_interface_buried_surface_area
    tool_ref: biotite SASA
    role: top_performing
    rank: 1
    justification: 'Installed and runnable now (scripts/t16_interface_quality.py):
      Shrake-Rupley SASA via biotite gives the buried area from the model alone —
      ΣSASA(chains) − SASA(complex) — an installable stand-in for the PISA web service.
      1sar A/B → 437.2 Å².'
    as_of_date: '2026-07-22'
  - id: REC_T15_secondary_structure_agreement_top_performing
    metric_definition_ref: T15_secondary_structure_agreement
    tool_ref: biotite P-SEA
    role: top_performing
    rank: 1
    justification: 'Installed and runnable now (scripts/t15_ss_agreement.py): DSSP
      vs biotite P-SEA three-state agreement. biotite''s Cα-geometry P-SEA is a different
      algorithm family from DSSP''s H-bond energetics, so the agreement is informative
      rather than tautological. Stands in for STRIDE, which is not currently installable
      via Homebrew.'
