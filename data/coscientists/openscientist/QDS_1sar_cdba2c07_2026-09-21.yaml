    metric_definition_ref: T16_interface_buried_surface_area
    tool_ref: PISA/PDBePISA
    role: top_considered
    rank: 1
    justification: 'PDBePISA is the reference service for interface area and biological-assembly
      inference, and is the source the deposited assembly is judged against. Its interface_area
      is per side, so double it before comparing with the harness total two-sided
      BSA; require agreement within max(3% of the mean, 30 Å²) with a matched 1.4
      Å probe and the benchmarked asymmetric selections: biotite protein-only versus
      PISA''s API assembly-molecule surface, which may include ligand/hetero atoms.'
    evidence_refs:
    - ref/research/tolerance_benchmark_interface_bsa.md
    as_of_date: '2026-09-22'
    effective_at: '2026-09-22T09:00:00+00:00'
    supersedes_recommendation_ref: REC_T16_interface_buried_surface_area_top_considered
  - id: REC_T16_interface_buried_surface_area_top_performing_2026_09_22
    metric_definition_ref: T16_interface_buried_surface_area
    tool_ref: biotite SASA
    role: top_performing
    rank: 1
    justification: 'Installed and runnable now (scripts/t16_interface_quality.py):
      Shrake-Rupley SASA via biotite gives total two-sided buried area from the model
      alone — ΣSASA(chains) − SASA(complex) — an installable stand-in for the PISA
      web service. The artifact''s tutorial starting model 1sar.pdb A/B → 437.2 Å²
      total; the separately downloaded RCSB deposition → 442.1 Å² total. PISA''s per-side
      interface_area is doubled before applying the max(3% of the mean, 30 Å²) comparison
      tolerance.'
    evidence_refs:
    - ref/research/tolerance_benchmark_interface_bsa.md
    - ref/structural_criteria.yaml
    as_of_date: '2026-09-22'
    effective_at: '2026-09-22T09:00:00+00:00'
