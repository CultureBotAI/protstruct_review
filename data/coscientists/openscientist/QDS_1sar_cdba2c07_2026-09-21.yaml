  tool_recommendations_applied:
  - id: REC_T15_secondary_structure_agreement_top_considered
    metric_definition_ref: T15_secondary_structure_agreement
    tool_ref: DSSP
    role: top_considered
    rank: 1
    justification: DSSP is the reference implementation for secondary-structure assignment.
      For the oracle-side T15 result, its H+E content must first pass the 0.20 interpretability
      gate; only then is three-state agreement with an independent second assigner
      compared with the 0.65 floor. The separate agent-vs-DSSP clause is ≥0.85 when
      agent labels exist.
    as_of_date: '2026-07-20'
  - id: REC_T15_secondary_structure_agreement_alternative
    metric_definition_ref: T15_secondary_structure_agreement
    tool_ref: STRIDE
    role: alternative
    rank: 2
    justification: STRIDE is the independent second assigner in the agreement pair.
      It uses hydrogen-bond energy plus dihedral criteria, so it fails differently
      from DSSP — which is what makes the agreement informative rather than tautological
      after the DSSP H+E content gate has passed.
    as_of_date: '2026-07-20'
  - id: REC_T15_secondary_structure_content_top_considered
    metric_definition_ref: T15_secondary_structure_content
    tool_ref: DSSP
    role: top_considered
    rank: 1
    justification: DSSP H+E content ≥0.20 is the registered interpretability gate
      for the two-assigner agreement metric. scripts/t15_ss_agreement.py emits it
      from the same normalized DSSP assignment used in the agreement calculation.
    evidence_refs:
    - ref/research/tolerance_benchmark_ss_agreement.md
    as_of_date: '2026-09-21'
  - id: REC_T16_interface_dockq_score_top_considered
    metric_definition_ref: T16_interface_dockq_score
    tool_ref: DockQ
    role: top_considered
    rank: 1
    justification: DockQ is the community-standard continuous interface-quality score
      and the basis of the CAPRI quality classes; CAPRI class is recorded alongside
      it as the ordinal label.
    as_of_date: '2026-07-20'
  - id: REC_T16_interface_dockq_score_top_performing
    metric_definition_ref: T16_interface_dockq_score
    tool_ref: DockQ
    role: top_performing
    rank: 1
    justification: 'Installed and runnable now (scripts/t16_interface_quality.py,
      DockQ 2.1.3): scores a model complex against the deposited reference and derives
      the CAPRI class. Identity calibration on 1sar A/B -> 1.000.'
    as_of_date: '2026-07-22'
  - id: REC_T16_interface_buried_surface_area_top_considered
    metric_definition_ref: T16_interface_buried_surface_area
    tool_ref: PISA/PDBePISA
    role: top_considered
    rank: 1
    justification: PDBePISA is the reference service for interface area and biological-assembly
      inference, and is the source the deposited assembly is judged against. Its interface_area
      is per side, so double it before comparing with the harness total two-sided
      BSA; require agreement within max(3% of the mean, 30 Å²) under matched conditions.
    as_of_date: '2026-07-20'
  - id: REC_T16_interface_buried_surface_area_top_performing
    metric_definition_ref: T16_interface_buried_surface_area
    tool_ref: biotite SASA
    role: top_performing
    rank: 1
    justification: 'Installed and runnable now (scripts/t16_interface_quality.py):
      Shrake-Rupley SASA via biotite gives total two-sided buried area from the model
      alone — ΣSASA(chains) − SASA(complex) — an installable stand-in for the PISA
      web service. The artifact''s tutorial starting model 1sar.pdb A/B → 437.2 Å²
      total; the separately downloaded RCSB deposition → 442.1 Å² total. PISA''s per-side
      interface_area is doubled before applying the max(3% of the mean, 30 Å²) comparison
      tolerance.'
    as_of_date: '2026-09-21'
  - id: REC_T15_secondary_structure_agreement_top_performing
    metric_definition_ref: T15_secondary_structure_agreement
    tool_ref: biotite P-SEA
    role: top_performing
    rank: 1
    justification: 'Installed and runnable now (scripts/t15_ss_agreement.py): DSSP
      vs biotite P-SEA three-state agreement. biotite''s Cα-geometry P-SEA is a different
      algorithm family from DSSP''s H-bond energetics, so the agreement is informative
      rather than tautological once DSSP H+E content passes 0.20; agreement must then
      be ≥0.65. Stands in for STRIDE, which is not currently installable via Homebrew.
      This is distinct from the agent-vs-DSSP ≥0.85 clause, which is unevaluable without
      agent labels.'
  - id: REC_T16_capri_interface_quality_class_top_considered
    metric_definition_ref: T16_capri_interface_quality_class
    tool_ref: DockQ
    role: top_considered
    rank: 1
    justification: Community-standard continuous interface-quality score.
    as_of_date: '2026-07-21'
  headline_verdict: 'This partial T15/T16 follow-up closes the missing oracle-side
    T15 content gate and T16 same-sequence crystallographic-contact mapping control on the packaged round-4
    model; it does not re-measure or carry forward any other task. T15''s paired-oracle
    calculation is interpretable (content 0.3750; agreement 0.8802) but does not establish
    improvement, and the agent-versus-DSSP clause remains unevaluable because the
    report contains no assignment. T16 is strongly mapping-dependent (AB:AB 0.9445/High;
    AB:BA 0.0063/Incorrect) and remains informational because A/B is a crystallographic
    contact. These additions do not change the September audit''s central finding:
    the archive packages round 4 while the report describes an absent round-7 model.'
