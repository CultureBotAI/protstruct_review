  tool_recommendations_applied:
  - id: REC_T15_secondary_structure_agreement_alternative_2026_09_22
    metric_definition_ref: T15_secondary_structure_agreement
    tool_ref: STRIDE
    role: alternative
    rank: 2
    justification: STRIDE is the independent second assigner in the agreement pair.
      It uses hydrogen-bond energy plus dihedral criteria, so it fails differently
      from DSSP — which is what makes the agreement informative rather than tautological.
      Report DSSP H+E content alongside it; content below the provisional 0.20 precondition
      warns that coil/coil calls may dominate.
    evidence_refs:
    - ref/research/tolerance_benchmark_ss_agreement.md
    as_of_date: '2026-09-22'
    effective_at: '2026-09-22T09:00:00+00:00'
    supersedes_recommendation_ref: REC_T15_secondary_structure_agreement_alternative
  - id: REC_T15_secondary_structure_agreement_top_considered_2026_09_22
    metric_definition_ref: T15_secondary_structure_agreement
    tool_ref: DSSP
    role: top_considered
    rank: 1
    justification: DSSP is the reference implementation for secondary-structure assignment.
      For the oracle-side T15 result, report its H+E content with three-state agreement
      from an independent second assigner. Content ≥0.20 is only a provisional, informational
      precondition on how much weight to give the agreement; it is not a model-quality
      threshold. The historical 0.65 value is provisional and non-gradeable until
      exact-denominator recalibration. The separate agent-vs-DSSP clause is ≥0.85
      when agent labels exist.
    evidence_refs:
    - ref/research/tolerance_benchmark_ss_agreement.md
    as_of_date: '2026-09-22'
    effective_at: '2026-09-22T09:00:00+00:00'
    supersedes_recommendation_ref: REC_T15_secondary_structure_agreement_top_considered
  - id: REC_T15_secondary_structure_agreement_top_performing_2026_09_22
    metric_definition_ref: T15_secondary_structure_agreement
    tool_ref: biotite P-SEA
    role: top_performing
    rank: 1
    justification: 'Installed and runnable now (scripts/t15_ss_agreement.py): DSSP
      vs biotite P-SEA three-state agreement. biotite''s Cα-geometry P-SEA is a different
      algorithm family from DSSP''s H-bond energetics, so the agreement is informative
      rather than tautological. Report agreement and DSSP H+E content informationally;
      content ≥0.20 is a provisional interpretability precondition, not a quality
      verdict. The historical 0.65 value is provisional and non-gradeable until exact-denominator
      recalibration. Stands in for STRIDE, which is not currently installable via
      Homebrew. This is distinct from the agent-vs-DSSP ≥0.85 clause, which is unevaluable
      without agent labels.'
    evidence_refs:
    - ref/research/tolerance_benchmark_ss_agreement.md
    as_of_date: '2026-09-22'
    effective_at: '2026-09-22T09:00:00+00:00'
    supersedes_recommendation_ref: REC_T15_secondary_structure_agreement_top_performing
  - id: REC_T15_secondary_structure_content_top_considered
    metric_definition_ref: T15_secondary_structure_content
    tool_ref: DSSP
    role: top_considered
    rank: 1
    justification: DSSP H+E content is an informational diagnostic for the two-assigner
      agreement metric. Its provisional ≥0.20 precondition indicates whether coil/coil
      calls may dominate; it is not a model-quality threshold. scripts/t15_ss_agreement.py
      emits it from the same normalized DSSP assignment used in the agreement calculation.
    evidence_refs:
    - ref/research/tolerance_benchmark_ss_agreement.md
    as_of_date: '2026-09-22'
    effective_at: '2026-09-22T09:00:00+00:00'
  - id: REC_T16_capri_interface_quality_class_top_considered
