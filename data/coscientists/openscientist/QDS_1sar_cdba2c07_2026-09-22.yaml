  headline_verdict: 'This partial T15+T16 follow-up uses the exact packaged round-4
    1SAR model. The 2026-09-22 T15 rerun measured DSSP H+E content 72/192 = 0.3750
    and DSSP/biotite P-SEA H/E/C agreement 169/192 = 0.8802; both are informational.
    The content clears only the provisional ≥0.20 interpretability precondition, not
    a model-quality threshold; the 0.8802 oracle-pair result is not the separate agent-vs-DSSP
    ≥0.85 rubric clause, and domain/fold classification was not performed. T16 is
    reused unchanged from 2026-09-21, not rerun: AB:AB is 0.944527/High versus the
    AB:BA mapping control at 0.006321/Incorrect. That contrast shows the mapping is
    load-bearing, while A/B remains a crystallographic contact rather than a certified
    biological assembly. No other task is included; the earlier archive/report-version
    mismatch was not re-evaluated by this partial sheet.'
