  assumptions_report:
  - id: ASSUM_gemmi_sfcalc_linear_resolution_shells
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: implicit
    scope: tool
    title: Linearly-binned resolution shells
    description: The custom R-calc bins reflections by 1/d² in equal-count bins; PHENIX
      uses adaptive shells.
    consequences: Per-shell R numbers are not directly comparable across the two tools.
    mitigation: Use overall R-work / R-free for cross-tool comparison, not per-shell.
    status: mitigated
    tool_ref: gemmi sfcalc
  - id: ASSUM_gemmi_sfcalc_r_work_offset_scope_2026_09_22
    as_of_date: '2026-09-22'
    effective_at: '2026-09-22T09:00:00+00:00'
    supersedes_assumption_ref: ASSUM_gemmi_sfcalc_simpler_bulk_solvent
    kind: explicit
    scope: tool
    title: R-work offset governance is estimator-specific
    description: '`gemmi sfcalc --scale-to` applies flat-mask bulk solvent with global
      anisotropic and solvent scaling; `scripts/gemmi_rfactor.py` then applies bin-wise
      isotropic scales fitted on work reflections. PHENIX has additional per-resolution-bin
      fitting freedom. The registry''s absolute R-work envelope benchmarked direct
      summation of globally scaled `gemmi sfcalc` FC values, not `gemmi_rfactor.py`''s
      extra bin-wise rescaling. The old template interval is not a pass criterion,
      and no R-free-specific offset envelope has been benchmarked.'
    consequences: Treating gemmi as categorically simpler misstates its scaling model,
      while applying the R-work envelope to R-free creates an unsupported pass or
      failure. Neither cross-tool number adjudicates a claim measured on another model.
    mitigation: Grade only the exact direct-summation R-work estimator registered
      in §3. Report bin-rescaled R-work and all R-free offsets informationally until
      matched benchmarks are registered, and state the model, MTZ, work/test selection,
      scaling estimator and mask-radii convention.
    status: verified
    tool_ref: gemmi sfcalc
    evidence_refs:
    - ref/research/tolerance_benchmark_r_offset.md
  - id: ASSUM_holton_rmsz_not_rmsd
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: Reports RMSZ against PHENIX restraint targets
    description: Holton geometry validation reports σ-units against PHENIX's internal
      restraint library. RMSZ is not interchangeable with raw RMSD — a tight restraint
      library can flag small absolute RMSDs as high-Z outliers.
    consequences: '"Bond RMSD 0.008 Å" and "bond RMSZ 1.4 σ" are both fine; they are
      not the same number.'
    mitigation: Schema v3+ carries both bond_rmsd_a and bond_rmsz on GeometrySummary.
    status: mitigated
    tool_ref: phenix.holton_geometry_validation
  - id: ASSUM_molprobity_h_atom_placement_2026_09_23
    as_of_date: '2026-09-23'
    effective_at: '2026-09-23T06:55:50+00:00'
    supersedes_assumption_ref: ASSUM_molprobity_h_atom_placement
    kind: explicit
    scope: tool
    title: Separate hydrogen placement from clash-counting conventions
    description: Clashscore depends on H coordinates and the counting implementation.
      The retained matched-H-convention benchmark reports a pipeline residual, but
      the two paths build hydrogens separately and do not demonstrate identical H
      coordinates or hetero dictionaries. Its causal decomposition is unresolved.
      Electron-cloud versus nuclear placement deliberately changes H geometry, while
      distinct hetero dictionaries can change construction even for the same reduce
      version. None of these observations establishes the cause of the unmatched historical
      1SAR headline difference (3.13 versus 3.63).
    consequences: A clashscore difference alone cannot identify a hydrogen-placement
      defect. Same-builder agreement is not independent confirmation of hydrogen construction,
      and the old headline difference must not be presented as a measured H-builder
      effect.
    mitigation: Bind comparisons to the exact coordinate subject, H-build version,
      flags, and hetero dictionary. Check the resulting H coordinates and report the
      clash-counting paths separately. Apply registry agreement criteria only when
      their matched-convention preconditions are met.
    status: unchecked
    tool_ref: MolProbity (gold)
    evidence_refs:
    - ref/research/tolerance_benchmark_clashscore_h.md
    - ref/research/tolerance_benchmark_flip_sets.md
    - scripts/bench_t05_clashscore_h.py
    notes: Registry correction from retained benchmark evidence; no new oracle run.
  - id: ASSUM_molprobity_rotamer_library_discreteness_2026_09_23
    as_of_date: '2026-09-23'
    effective_at: '2026-09-23T06:55:50+00:00'
    supersedes_assumption_ref: ASSUM_molprobity_rotamer_library_discreteness
    kind: implicit
    scope: tool
    title: Rotamer classification includes an Allowed region
    description: MolProbity distinguishes Favored, Allowed, and OUTLIER classifications.
      Outside the favored region does not imply an outlier. Classification depends
      on the residue-specific joint torsion-library score, not one χ angle's distance
      from a favored boundary.
    consequences: A headline outlier percentage does not distinguish borderline from
      severe outliers; an angular offset alone cannot establish the classification.
    mitigation: Retain residue identity and the reported classification and score
      when available. Do not infer OUTLIER from a not-favored label or a single-angle
      deviation. See scripts/bench_vs_deposited.py's three-category score definitions
      and ref/research/tolerance_benchmark_round7.md.
    status: mitigated
    tool_ref: MolProbity (gold)
  - id: ASSUM_molprobity_top8000_reference
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: implicit
    scope: tool
    title: Top8000 reference distribution is high-resolution
    description: MolProbity's percentile rankings and outlier definitions come from
      Top8000, a corpus of high-resolution (≤ 2.0 Å) deposited structures. Applying
      these to a 3.0 Å model still produces a percentile, but the threshold for "outlier"
      was set against tighter geometry than the model can deliver.
    consequences: Mid-resolution models (2.5–3.5 Å) accumulate "outliers" that are
      not actual modelling errors but resolution-driven coordinate uncertainty. The
      published rate can look worse than the model is.
    mitigation: Pair every MolProbity number with the model's resolution; cite the
      resolution-bin percentile (wwPDB validation report's column) rather than the
      all-archive percentile when comparing across datasets.
    status: unchecked
    tool_ref: MolProbity (gold)
    evidence_refs:
    - Williams2018
  - id: ASSUM_molprobity_water_altloc
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: implicit
    scope: tool
    title: probe water + altloc filter (`ogt33`)
    description: '`probe`''s default selection — occupancy > 33% — determines which
      atoms are eligible to clash. Disordered residues at 30% occupancy drop out of
      the calculation entirely.'
    consequences: Clashscore can hide real geometry problems at low-occupancy altlocs
      — exactly the regions a refinement most needs scrutiny.
    mitigation: Re-run probe with `--noaltloc` or relaxed occupancy thresholds.
    status: unchecked
    tool_ref: MolProbity (gold)
  - id: ASSUM_ost_lddt_cα_only_mode
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: -c flag computes Cα-only lDDT
    description: Running `lddt -c` restricts the calculation to Cα atoms (faster,
      backbone-only). Without -c the full all-atom lDDT is computed. The -c variant
      is what AlphaFold's pLDDT predicts.
    consequences: lDDT-Cα is more permissive than all-atom lDDT (it ignores side-chain
      placement quality entirely).
    mitigation: 'State which mode was used. For the project: -c is acceptable when
      the structure is at moderate resolution (≥ 2.5 Å) where side-chain placement
      is itself uncertain.'
    status: mitigated
    tool_ref: OpenStructure
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
  - id: ASSUM_ost_lddt_inclusion_radius
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: lDDT inclusion radius (default 15 Å)
    description: OST's `lddt` CLI defaults to a 15 Å distance inclusion radius. Reducing
      the radius rewards local fidelity; increasing it rewards extended geometry.
      Two lDDT scores produced with different radii are not directly comparable.
    consequences: A 0.97 lDDT at 15 Å is not the same as a 0.97 lDDT at 10 Å. Cross-tool
      comparisons must use the same radius.
    mitigation: Always quote the radius in PairwiseComparison.notes when reporting
      lDDT. Default 15 Å for the project; document any deviation.
    status: mitigated
    tool_ref: OpenStructure
    evidence_refs:
    - Mariani2013
  - id: ASSUM_ost_lddt_thresholds
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: lDDT cutoff thresholds (0.5, 1, 2, 4 Å)
    description: lDDT counts a distance as "preserved" if it falls within any of four
      cutoffs (0.5 / 1 / 2 / 4 Å). The score is the unweighted mean of the four pass-fractions.
    consequences: A model can score 0.97 at 4 Å tolerance but <0.5 at the strict 0.5
      Å cutoff. The headline lDDT averages over all four; sites with sub-Å precision
      needs need the per-cutoff breakdown.
    mitigation: OST emits per-cutoff fractions if requested; surface them when the
      structure claims sub-Å accuracy.
    status: unchecked
    tool_ref: OpenStructure
    evidence_refs:
    - Mariani2013
  - id: ASSUM_ost_no_built_in_rama_contour
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: implicit
    scope: tool
    title: No built-in Top8000 Ramachandran contour
    description: OST exposes φ/ψ extraction via residue.GetPhiTorsion() / GetPsiTorsion()
      but does not ship Top8000 contour data for Ramachandran outlier classification.
      Outlier classification via OST requires either external contour data files or
      a custom coarse classifier (which mis-fires on the boundary).
    consequences: OST is not a drop-in replacement for MolProbity's Rama outlier analysis.
      It IS a drop-in replacement for lDDT, structural comparison, and Cα displacement
      analysis.
    mitigation: Do not use OST for headline Rama outlier % numbers. Use it as a φ/ψ
      extractor where needed; defer outlier classification to MolProbity or a future
      OST plugin that ships contour data.
    status: known_violation
    tool_ref: OpenStructure
  - id: ASSUM_phenix_mvd_treats_model_as_fixed
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: Model is fixed; not a refinement
    description: '`phenix.model_vs_data` re-computes R-factors with its own bulk-
      solvent fit but does not move atoms. The R-factors it reports are for the input
      model exactly as deposited.'
    consequences: A model that converged in PHENIX with one scaling will look slightly
      different here. Treat the model_vs_data value as the catalog T06 oracle of record.
    mitigation: None needed; this is the intended behaviour.
    status: verified
    tool_ref: phenix.model_vs_data
  - id: ASSUM_refmac_restraint_library
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: REFMAC5 uses the CCP4 monomer library
    description: REFMAC5 reports geometry RMSZ against the CCP4 restraint dictionary,
      which is an independent code path from PHENIX's restraint library (mon_lib).
    consequences: RMSZ from REFMAC and RMSZ from phenix.holton_geometry_validation
      can disagree on the same atoms because the σ targets differ — typically by 0.1-0.3
      σ, occasionally more for unusual residues.
    mitigation: State which library was used. Cross-tool RMSZ agreement within ~0.5
      σ counts as confirmed; larger disagreement flags either a modelling issue or
      a restraint-library mismatch.
    status: mitigated
    tool_ref: REFMAC5
  - id: ASSUM_refmac_solvent_modelling
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: REFMAC5 uses Babinet-style bulk solvent
    description: REFMAC5's bulk-solvent model differs from PHENIX's. R-factors from
      a REFMAC re-refinement are not directly comparable to PHENIX in-run values;
      expect differences in the 0.005-0.015 range on the same data.
    consequences: A REFMAC re-refinement of the agent's model giving 0.158 R-free
      vs phenix.refine 0.149 is not necessarily a "regression" — it's a different
      scaling.
    mitigation: When using REFMAC as a second-opinion refiner, compare on the same
      scale (REFMAC vs REFMAC, PHENIX vs PHENIX) for cross-round Δ-claims; cross-tool
      comparison is for "are we in the same bracket".
    status: mitigated
    tool_ref: REFMAC5
  - id: ASSUM_servalcat_refine_xtal_actually_refines
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: refine_xtal_norefmac re-refines the model
    description: '`servalcat refine_xtal_norefmac` runs a full refinement; the resulting
      R-factor is for a NEW model, not a re-measurement of the input.'
    consequences: Comparing this R-factor to the agent's R-factor is comparing two
      different models. It is a useful "what does an independent refiner do with this
      data" check, not a re-measurement.
    mitigation: Cite both — input model R via model_vs_data, re-refined R via servalcat.
    status: mitigated
    tool_ref: Servalcat
  - id: ASSUM_servalcat_sigmaa_per_shell_only
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: per-shell sigma-A R, not work/free split by default
    description: '`servalcat sigmaa` reports a per-shell composite R and per-bin sigma-A
      weights, not a separately-cross-validated R-work / R-free. The "overall R" we
      surface is a reflection-count-weighted mean over the shells.'
    consequences: Treating the Servalcat number as a direct R-free substitute is incorrect
      — it is a different quantity.
    mitigation: In the QDS, label this as "overall R per-shell weighted" (already
      done via T03_overall_r_per_shell_weighted) and keep R-free reporting on phenix.model_vs_data
      and gemmi.
    status: mitigated
    tool_ref: Servalcat
  - id: ASSUM_tmalign_optimal_alignment_drops_residues
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: Sequence-independent — optimal Cα subset
    description: TM-align finds the optimal Cα subset by dynamic programming and drops
      residues from the score that don't fit the alignment. The `Aligned length` field
      tells you how many were used.
    consequences: For near-identical structures TM-align produces a more generous
      alignment than LSQ-based superposition. RMSD reported next to a TM-align alignment
      is over a different atom set than RMSD reported next to a phenix.superpose_models
      alignment.
    mitigation: Quote `aligned_length` in PairwiseComparison.residues_aligned. Quote
      both LSQ and TM-align RMSD when reporting both.
    status: mitigated
    tool_ref: TM-align
  - id: ASSUM_tmalign_tm_score_normaliser
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: implicit
    scope: tool
    title: TM-score is normalised by the FIRST input length
    description: '`TMalign A.pdb B.pdb` normalises TM-score by the length of A. Swapping
      arguments swaps the normaliser and produces a slightly different score.'
    consequences: Reporting "TM-score = 0.987" without identifying which input was
      first leaves a 0.5–2 % ambiguity.
    mitigation: Always state which structure was the reference (the normaliser); record
      both TM-scores when chains have different lengths.
    status: mitigated
    tool_ref: TM-align
