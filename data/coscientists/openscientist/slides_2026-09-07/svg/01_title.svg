<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="0" y="0" width="1920" height="6" fill="#1f4e8c"/>
  <text x="120" y="320" font-size="72" font-weight="700" fill="#1a1a2e">1SAR artefact audit</text>
  <text x="120" y="400" font-size="44" font-weight="400" fill="#a8201a">The archive does not contain the model its report describes</text>
  <line x1="120" y1="460" x2="1100" y2="460" stroke="#a8201a" stroke-width="3"/>
  <circle cx="132" cy="523" r="6" fill="#1f4e8c"/>
  <text x="158" y="530" font-size="24" fill="#1a1a2e">Seven rounds were run · round 7 was reported · round 4 was shipped as 1sar_final.pdb</text>
  <circle cx="132" cy="575" r="6" fill="#1f4e8c"/>
  <text x="158" y="582" font-size="24" fill="#1a1a2e">The round-7 coordinates are absent from the archive entirely</text>
  <circle cx="132" cy="627" r="6" fill="#1f4e8c"/>
  <text x="158" y="634" font-size="24" fill="#1a1a2e">So the reported R-free of 0.199 is real — it rounds from round 7's 0.1989</text>
  <circle cx="132" cy="679" r="6" fill="#1f4e8c"/>
  <text x="158" y="686" font-size="24" fill="#1a1a2e">Five earlier review passes compared the report against the wrong model</text>
  <rect x="120" y="780" width="1680" height="150" rx="10" ry="10" fill="#f5d6d4"/>

  <text x="150" y="832" font-size="26" font-weight="700" fill="#a8201a">The defect is packaging, not reporting. An artefact that cannot substantiate its own</text>
  <text x="150" y="868" font-size="26" font-weight="700" fill="#a8201a">report is indistinguishable, from the coordinates alone, from one that lies.</text>

  <text x="120" y="1010" font-size="20" fill="#5a6071">openscientist artefact cdba2c07-daff-4f60-ae96-12452b3a5fbb · protstruct_review · 2026-09-07</text>
</svg>
