  <text x="80" y="524" font-size="26" font-weight="700" fill="#1a1a2e">Evidence</text>
  <circle cx="94" cy="563" r="4" fill="#1f4e8c"/>
  <text x="114" y="570" font-size="19" fill="#1a1a2e">iter4_transcript.json records the copy that made the packaged file: cp 1sar_final_001.pdb → data/1sar_final.pdb</text>
  <circle cx="94" cy="597" r="4" fill="#1f4e8c"/>
  <text x="114" y="604" font-size="19" fill="#1a1a2e">Its header (0.1563 / 0.2114) matches data/1sar_round5_input.pdb — the packaged “final” is what round 5 was handed</text>
  <circle cx="94" cy="631" r="4" fill="#1f4e8c"/>
  <text x="114" y="638" font-size="19" fill="#1a1a2e">claude_iterations.log:510 records round 7 at R-work 0.1488, R-free 0.1989, 159 waters, 1 Ca²⁺, 1 Na⁺, 1 SO4</text>
  <circle cx="94" cy="665" r="4" fill="#1f4e8c"/>
  <text x="114" y="672" font-size="19" fill="#1a1a2e">claude_iterations.log:752 names /agent/job/1sar_round7_001.pdb as the final deliverable (1654 atoms)</text>
  <circle cx="94" cy="699" r="4" fill="#1f4e8c"/>
  <text x="114" y="706" font-size="19" fill="#1a1a2e">0.1989 / 0.1488 appear in four provenance transcripts; iter10 runs model_vs_data against the round-7 path</text>
  <circle cx="94" cy="733" r="4" fill="#1f4e8c"/>
  <text x="114" y="740" font-size="19" fill="#1a1a2e">An ignore-independent search of every archive member finds no round-7 PDB or MTZ</text>
  <rect x="80" y="790" width="1760" height="140" rx="10" ry="10" fill="#dce6f4"/>

  <text x="110" y="840" font-size="22" font-weight="700" fill="#1f4e8c">So 0.199 is not fabricated — it rounds from the agent's own round 7. The deliverable was simply</text>
  <text x="110" y="872" font-size="22" font-weight="700" fill="#1f4e8c">never written into the archive, and a three-round-stale file was shipped under the name the report</text>
  <text x="110" y="904" font-size="22" font-weight="700" fill="#1f4e8c">cites.</text>

