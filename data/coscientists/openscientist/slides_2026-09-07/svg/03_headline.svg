<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="0" y="0" width="1920" height="6" fill="#1f4e8c"/>
  <text x="80" y="86" font-size="44" font-weight="700" fill="#1a1a2e">The R-free number, sharpened</text>
  <text x="80" y="128" font-size="22" font-weight="400" fill="#5a6071">The refinement agrees with the oracle; the report does not</text>
  <line x1="80" y1="1020" x2="1840" y2="1020" stroke="#e3e6ee" stroke-width="1"/>
  <text x="80" y="1050" font-size="16" fill="#5a6071">1SAR refinement review · openscientist artefact cdba2c07 · re-run 2026-09-07</text>
  <text x="1840" y="1050" font-size="16" fill="#5a6071" text-anchor="end">protstruct_review · update deck 2026-09-07</text>

  <rect x="80" y="195" width="550" height="290" rx="10" ry="10" fill="#f5d6d4"/>

  <text x="110" y="245" font-size="26" font-weight="700" fill="#a8201a">May said</text>
  <text x="110" y="292" font-size="20" font-weight="400" fill="#1a1a2e">“R-free is reproducibly ~0.21, not 0.199.”</text>
  <text x="110" y="322" font-size="20" font-weight="400" fill="#1a1a2e">Four code paths, 0.2116–0.2209, read as</text>
  <text x="110" y="352" font-size="20" font-weight="400" fill="#1a1a2e">convergent corroboration.</text>

  <rect x="670" y="195" width="550" height="290" rx="10" ry="10" fill="#dce6f4"/>

  <text x="700" y="245" font-size="26" font-weight="700" fill="#1f4e8c">Now measured</text>
  <text x="700" y="292" font-size="20" font-weight="400" fill="#1a1a2e">The agent's own model header records FREE</text>
  <text x="700" y="322" font-size="20" font-weight="400" fill="#1a1a2e">R VALUE 0.2114. The oracle recomputes</text>
  <text x="700" y="352" font-size="20" font-weight="400" fill="#1a1a2e">0.2116 — agreement to 0.0002.</text>

  <rect x="1260" y="195" width="550" height="290" rx="10" ry="10" fill="#dff0e1"/>

  <text x="1290" y="245" font-size="26" font-weight="700" fill="#1f7a3f">So the defect is</text>
  <text x="1290" y="292" font-size="20" font-weight="400" fill="#1a1a2e">in the write-up, not the refinement. The</text>
  <text x="1290" y="322" font-size="20" font-weight="400" fill="#1a1a2e">report says 0.199 in seven places; the</text>
  <text x="1290" y="352" font-size="20" font-weight="400" fill="#1a1a2e">model it describes does not.</text>

  <text x="80" y="565" font-size="28" font-weight="700" fill="#1a1a2e">Where does 0.199 come from? No round the agent ran.</text>
  <rect x="80" y="605" width="540" height="44" fill="#1f4e8c"/>
  <text x="94" y="633.6666666666666" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">Model in the artefact</text>
  <text x="606" y="633.6666666666666" font-size="20" font-weight="700" fill="#ffffff" text-anchor="end">R-free</text>
  <rect x="80" y="649" width="540" height="44" fill="#ffffff"/>
  <text x="94" y="677.6666666666666" font-size="20" fill="#1a1a2e" text-anchor="start">1sar_refined</text>
  <text x="606" y="677.6666666666666" font-size="20" fill="#1a1a2e" text-anchor="end">0.2364</text>
  <rect x="80" y="693" width="540" height="44" fill="#f7f8fb"/>
  <text x="94" y="721.6666666666666" font-size="20" fill="#1a1a2e" text-anchor="start">round 2</text>
  <text x="606" y="721.6666666666666" font-size="20" fill="#1a1a2e" text-anchor="end">0.2293</text>
  <rect x="80" y="737" width="540" height="44" fill="#ffffff"/>
  <text x="94" y="765.6666666666666" font-size="20" fill="#1a1a2e" text-anchor="start">round 3</text>
  <text x="606" y="765.6666666666666" font-size="20" fill="#1a1a2e" text-anchor="end">0.2165</text>
  <rect x="80" y="781" width="540" height="44" fill="#f7f8fb"/>
  <rect x="80" y="781" width="340" height="44" fill="#dce6f4"/>
  <text x="94" y="809.6666666666666" font-size="20" fill="#1a1a2e" text-anchor="start">final (shipped)</text>
  <rect x="420" y="781" width="200" height="44" fill="#dce6f4"/>
  <text x="606" y="809.6666666666666" font-size="20" fill="#1a1a2e" text-anchor="end">0.2114</text>
  <rect x="80" y="825" width="540" height="44" fill="#ffffff"/>
  <text x="94" y="853.6666666666666" font-size="20" fill="#1a1a2e" text-anchor="start">round 5</text>
  <text x="606" y="853.6666666666666" font-size="20" fill="#1a1a2e" text-anchor="end">0.2109</text>
  <rect x="80" y="869" width="540" height="44" fill="#f7f8fb"/>
  <rect x="80" y="869" width="340" height="44" fill="#dff0e1"/>
  <text x="94" y="897.6666666666666" font-size="20" fill="#1a1a2e" text-anchor="start">round 6</text>
  <rect x="420" y="869" width="200" height="44" fill="#dff0e1"/>
  <text x="606" y="897.6666666666666" font-size="20" fill="#1a1a2e" text-anchor="end">0.2068</text>
  <rect x="80" y="913" width="540" height="44" fill="#ffffff"/>
  <rect x="80" y="913" width="340" height="44" fill="#f5d6d4"/>
  <text x="94" y="941.6666666666666" font-size="20" fill="#a8201a" text-anchor="start">report claim</text>
  <rect x="420" y="913" width="200" height="44" fill="#f5d6d4"/>
  <text x="606" y="941.6666666666666" font-size="20" fill="#a8201a" text-anchor="end">0.199</text>
  <rect x="80" y="605" width="540" height="352" fill="none" stroke="#e3e6ee" stroke-width="1"/>
  <line x1="420" y1="605" x2="420" y2="957" stroke="#e3e6ee" stroke-width="1"/>

  <rect x="700" y="605" width="1140" height="308" rx="10" ry="10" fill="#f7f8fb"/>

  <text x="730" y="655" font-size="21" font-weight="400" fill="#1a1a2e">Every round model carries its R-free in its own PDB header, and</text>
  <text x="730" y="685" font-size="21" font-weight="400" fill="#1a1a2e">where the oracle was re-run it agrees with the header. The range is</text>
  <text x="730" y="715" font-size="21" font-weight="400" fill="#1a1a2e">0.2068–0.2364. The reported 0.199 is below the best round the agent</text>
  <text x="730" y="745" font-size="21" font-weight="400" fill="#1a1a2e">ever produced, by 0.008.</text>

  <text x="730" y="790" font-size="21" font-weight="400" fill="#a8201a">“Understated by ~0.012” implies a measurement disagreement.</text>
  <text x="730" y="820" font-size="21" font-weight="400" fill="#a8201a">“Corresponds to no model produced” is a reporting-integrity problem,</text>
  <text x="730" y="850" font-size="21" font-weight="400" fill="#a8201a">and a different thing to fix.</text>

</svg>
