<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="0" y="0" width="1920" height="6" fill="#1f4e8c"/>
  <text x="80" y="86" font-size="44" font-weight="700" fill="#1a1a2e">The report's numbers, re-examined</text>
  <text x="80" y="128" font-size="22" font-weight="400" fill="#5a6071">One substantive defect survives the correction — and it is not the one we filed</text>
  <line x1="80" y1="1020" x2="1840" y2="1020" stroke="#e3e6ee" stroke-width="1"/>
  <text x="80" y="1050" font-size="16" fill="#5a6071">1SAR artefact audit · openscientist artefact cdba2c07 · 2026-09-07</text>
  <text x="1840" y="1050" font-size="16" fill="#5a6071" text-anchor="end">protstruct_review · artefact audit 2026-09-07</text>

  <rect x="80" y="190" width="550" height="300" rx="10" ry="10" fill="#dff0e1"/>

  <text x="110" y="242" font-size="26" font-weight="700" fill="#1f7a3f">Not a misreport</text>
  <text x="110" y="292" font-size="20" font-weight="400" fill="#1a1a2e">0.199 rounds from round 7's 0.1989, and</text>
  <text x="110" y="322" font-size="20" font-weight="400" fill="#1a1a2e">0.149 from 0.1488. Both are the agent's</text>
  <text x="110" y="352" font-size="20" font-weight="400" fill="#1a1a2e">own measured values for the model it</text>
  <text x="110" y="382" font-size="20" font-weight="400" fill="#1a1a2e">describes.</text>

  <rect x="670" y="190" width="550" height="300" rx="10" ry="10" fill="#fbeecb"/>

  <text x="700" y="242" font-size="26" font-weight="700" fill="#b07c00">A packaging failure</text>
  <text x="700" y="292" font-size="20" font-weight="400" fill="#1a1a2e">The model those numbers describe was never</text>
  <text x="700" y="322" font-size="20" font-weight="400" fill="#1a1a2e">packaged. Measuring the shipped file gives</text>
  <text x="700" y="352" font-size="20" font-weight="400" fill="#1a1a2e">0.2116 — 0.0125 worse — with no way to</text>
  <text x="700" y="382" font-size="20" font-weight="400" fill="#1a1a2e">tell why.</text>

  <rect x="1260" y="190" width="550" height="300" rx="10" ry="10" fill="#f5d6d4"/>

  <text x="1290" y="242" font-size="26" font-weight="700" fill="#a8201a">A real defect</text>
  <text x="1290" y="292" font-size="20" font-weight="400" fill="#1a1a2e">Round 7's actual gap is 0.1989 − 0.1488 =</text>
  <text x="1290" y="322" font-size="20" font-weight="400" fill="#1a1a2e">0.0501, which fails the agent's own &lt; 0.05</text>
  <text x="1290" y="352" font-size="20" font-weight="400" fill="#1a1a2e">criterion. The report states “gap=0.050”.</text>

  <text x="80" y="565" font-size="28" font-weight="700" fill="#1a1a2e">What five review passes got wrong</text>
  <text x="80" y="612" font-size="22" font-weight="400" fill="#1a1a2e">This harness filed, and defended across five rounds, the conclusion that 0.199 “corresponds to no model the</text>
  <text x="80" y="644" font-size="22" font-weight="400" fill="#1a1a2e">agent produced”. That conclusion came from comparing a reported number against a file whose name said final,</text>
  <text x="80" y="676" font-size="22" font-weight="400" fill="#1a1a2e">without once checking the file's provenance. The decisive check was object identity — not another comparison of</text>
  <text x="80" y="708" font-size="22" font-weight="400" fill="#1a1a2e">the same headline numbers, which is what each round performed.</text>

  <rect x="80" y="790" width="1760" height="140" rx="10" ry="10" fill="#f5d6d4"/>

  <text x="110" y="842" font-size="23" font-weight="700" fill="#a8201a">An accusation that an agent invented a number is a serious claim. It was wrong, it was checkable</text>
  <text x="110" y="875" font-size="23" font-weight="700" fill="#a8201a">from the archive throughout, and it survived five adversarial passes.</text>

</svg>
