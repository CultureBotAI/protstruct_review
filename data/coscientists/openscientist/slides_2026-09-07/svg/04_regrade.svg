<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="0" y="0" width="1920" height="6" fill="#1f4e8c"/>
  <text x="80" y="86" font-size="44" font-weight="700" fill="#1a1a2e">The R-factor claims, graded</text>
  <text x="80" y="128" font-size="22" font-weight="400" fill="#5a6071">On the criterion the 1SAR series declares — and one rubric rule that cannot be applied to a 1990 entry</text>
  <line x1="80" y1="1020" x2="1840" y2="1020" stroke="#e3e6ee" stroke-width="1"/>
  <text x="80" y="1050" font-size="16" fill="#5a6071">1SAR refinement review · openscientist artefact cdba2c07 · re-run 2026-09-07</text>
  <text x="1840" y="1050" font-size="16" fill="#5a6071" text-anchor="end">protstruct_review · update deck 2026-09-07</text>

  <rect x="80" y="195" width="1760" height="62" fill="#1f4e8c"/>
  <text x="94" y="232.66666666666666" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">Claim</text>
  <text x="454" y="232.66666666666666" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">What May actually graded</text>
  <text x="974" y="232.66666666666666" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">2026-09-07 grading</text>
  <text x="1670.0" y="232.66666666666666" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Verdict</text>
  <rect x="80" y="257" width="1760" height="62" fill="#ffffff"/>
  <text x="94" y="293.6666666666667" font-size="17" fill="#1a1a2e" text-anchor="start">R-free value, 0.199 vs 0.2116</text>
  <text x="454" y="293.6666666666667" font-size="17" fill="#5a6071" text-anchor="start">all four May paths sat above 0.199</text>
  <text x="974" y="293.6666666666667" font-size="17" fill="#1a1a2e" text-anchor="start">match within 0.005 (series criterion): Δ 0.0126</text>
  <rect x="1500" y="257" width="340" height="62" fill="#f5d6d4"/>
  <text x="1670.0" y="293.6666666666667" font-size="17" fill="#a8201a" text-anchor="middle">fails</text>
  <rect x="80" y="319" width="1760" height="62" fill="#f7f8fb"/>
  <text x="94" y="355.6666666666667" font-size="17" fill="#1a1a2e" text-anchor="start">R-work value, 0.149 vs 0.1564</text>
  <text x="454" y="355.6666666666667" font-size="17" fill="#5a6071" text-anchor="start">graded fail_by_oracle</text>
  <text x="974" y="355.6666666666667" font-size="17" fill="#1a1a2e" text-anchor="start">same criterion: Δ 0.0074</text>
  <rect x="1500" y="319" width="340" height="62" fill="#f5d6d4"/>
  <text x="1670.0" y="355.6666666666667" font-size="17" fill="#a8201a" text-anchor="middle">fails</text>
  <rect x="80" y="381" width="1760" height="62" fill="#ffffff"/>
  <text x="94" y="417.6666666666667" font-size="17" fill="#1a1a2e" text-anchor="start">R-work/R-free gap &lt; 0.05</text>
  <text x="454" y="417.6666666666667" font-size="17" fill="#5a6071" text-anchor="start">0.0552 / 0.0526 / 0.0504 / 0.0435 (“3 of 4 fail”)</text>
  <text x="974" y="417.6666666666667" font-size="17" fill="#1a1a2e" text-anchor="start">0.0552 PHENIX, 0.0515 gemmi</text>
  <rect x="1500" y="381" width="340" height="62" fill="#f5d6d4"/>
  <text x="1670.0" y="417.6666666666667" font-size="17" fill="#a8201a" text-anchor="middle">still fails</text>
  <rect x="80" y="443" width="1760" height="62" fill="#f7f8fb"/>
  <text x="94" y="479.6666666666667" font-size="17" fill="#1a1a2e" text-anchor="start">R offset, rule 2 (R-WORK)</text>
  <text x="454" y="479.6666666666667" font-size="17" fill="#5a6071" text-anchor="start">not graded as such</text>
  <text x="974" y="479.6666666666667" font-size="17" fill="#1a1a2e" text-anchor="start">gemmi 0.1622 vs PHENIX 0.1564 = +0.0058</text>
  <rect x="1500" y="443" width="340" height="62" fill="#dff0e1"/>
  <text x="1670.0" y="479.6666666666667" font-size="17" fill="#1f7a3f" text-anchor="middle">passes</text>
  <rect x="80" y="505" width="1760" height="62" fill="#ffffff"/>
  <text x="94" y="541.6666666666666" font-size="17" fill="#1a1a2e" text-anchor="start">Round 6 better than final</text>
  <text x="454" y="541.6666666666666" font-size="17" fill="#5a6071" text-anchor="start">Δ 0.0048 by oracle</text>
  <text x="974" y="541.6666666666666" font-size="17" fill="#1a1a2e" text-anchor="start">Δ 0.0048, same instrument</text>
  <rect x="1500" y="505" width="340" height="62" fill="#dff0e1"/>
  <text x="1670.0" y="541.6666666666666" font-size="17" fill="#1f7a3f" text-anchor="middle">reproduces exactly</text>
  <rect x="80" y="195" width="1760" height="372" fill="none" stroke="#e3e6ee" stroke-width="1"/>
  <line x1="440" y1="195" x2="440" y2="567" stroke="#e3e6ee" stroke-width="1"/>
  <line x1="960" y1="195" x2="960" y2="567" stroke="#e3e6ee" stroke-width="1"/>
  <line x1="1500" y1="195" x2="1500" y2="567" stroke="#e3e6ee" stroke-width="1"/>

  <text x="80" y="600" font-size="26" font-weight="700" fill="#1a1a2e">The rule that cannot be applied — and what the independent path settled</text>
  <text x="80" y="644" font-size="21" font-weight="400" fill="#1a1a2e">T03 rule 1 is “R-free within ± 0.02 of the DEPOSITED value and of a REFMAC5 re-refinement”. 1SAR was deposited in</text>
  <text x="80" y="675" font-size="21" font-weight="400" fill="#1a1a2e">1990 and records FREE R VALUE : NULL, and no REFMAC5 re-refinement was run — so rule 1 has no reference and cannot</text>
  <text x="80" y="706" font-size="21" font-weight="400" fill="#1a1a2e">be evaluated. The claims are graded above on the series' own reporting-accuracy criterion instead. Separately, gemmi</text>
  <text x="80" y="737" font-size="21" font-weight="400" fill="#1a1a2e">with matched radii gives R-free 0.2136 vs PHENIX 0.2116 — settling the gemmi leg only; Servalcat (0.2209) and</text>
  <text x="80" y="768" font-size="21" font-weight="400" fill="#1a1a2e">REFMAC5 were not re-run and are not retracted.</text>

  <rect x="80" y="800" width="1760" height="140" rx="10" ry="10" fill="#fbeecb"/>

  <text x="110" y="846" font-size="21" font-weight="400" fill="#1a1a2e">Two cautions: the shift from May's gemmi number is confounded three ways (mask radii, version, and</text>
  <text x="110" y="877" font-size="21" font-weight="400" fill="#1a1a2e">#316's work-only scale fit), not one. And the 0.005–0.015 expectation is about R-WORK, not R-free:</text>
  <text x="110" y="908" font-size="21" font-weight="400" fill="#1a1a2e">measured correctly that offset is +0.0058 and in band. No benchmarked R-free offset band exists.</text>

</svg>
