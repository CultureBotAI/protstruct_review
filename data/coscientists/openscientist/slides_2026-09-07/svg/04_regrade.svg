  <text x="102" y="932" font-size="28" font-weight="700" fill="#1f4e8c">0.2116</text>
  <rect x="520" y="850" width="410" height="110" rx="10" ry="10" fill="#f7f8fb" stroke="#1f7a3f" stroke-width="2"/>

  <text x="542" y="892" font-size="19" fill="#1a1a2e">gemmi, matched radii</text>
  <text x="542" y="932" font-size="28" font-weight="700" fill="#1f7a3f">0.2136</text>
  <rect x="960" y="850" width="410" height="110" rx="10" ry="10" fill="#f7f8fb" stroke="#b07c00" stroke-width="2"/>

  <text x="982" y="892" font-size="19" fill="#1a1a2e">gemmi, default vdw (May)</text>
  <text x="982" y="932" font-size="28" font-weight="700" fill="#b07c00">0.217</text>
  <rect x="1400" y="850" width="410" height="110" rx="10" ry="10" fill="#f7f8fb" stroke="#a8201a" stroke-width="2"/>

  <text x="1422" y="892" font-size="19" fill="#1a1a2e">agent report</text>
  <text x="1422" y="932" font-size="28" font-weight="700" fill="#a8201a">0.199</text>
