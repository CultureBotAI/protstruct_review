  <rect x="80" y="656" width="5" height="100" fill="#1f7a3f"/>
  <text x="105" y="680" font-size="20" font-weight="400" fill="#1a1a2e">T16 applies because 1SAR's asymmetric unit carries two protein chains. The agent's A/B pairing reproduces</text>
  <text x="105" y="710" font-size="20" font-weight="400" fill="#1a1a2e">the deposited assembly at CAPRI High — there is no PHENIX interface scorer, so this task is oracle-only by</text>
  <text x="105" y="740" font-size="20" font-weight="400" fill="#1a1a2e">construction.</text>

  <rect x="80" y="780" width="5" height="100" fill="#1f4e8c"/>
  <text x="105" y="804" font-size="20" font-weight="400" fill="#1a1a2e">T14 compares two genuinely independent H builders (Richardson reduce vs mmtbx.reduce2,</text>
  <text x="105" y="834" font-size="20" font-weight="400" fill="#1a1a2e">add_flip_movers=True). They agree on every confident call. phenix.reduce is the same binary as reduce, so</text>
  <text x="105" y="864" font-size="20" font-weight="400" fill="#1a1a2e">its identical count is a redistribution check, not a second opinion.</text>

  <rect x="80" y="904" width="5" height="100" fill="#b07c00"/>
  <text x="105" y="928" font-size="20" font-weight="400" fill="#1a1a2e">T15's agreement number is a property of the fold and the two algorithms, not a quality score. It is only</text>
  <text x="105" y="958" font-size="20" font-weight="400" fill="#1a1a2e">meaningful as a difference — which is why the deposited reference was measured too. The agent model sits</text>
  <text x="105" y="988" font-size="20" font-weight="400" fill="#1a1a2e">0.0156 above it.</text>

