  <text x="1840" y="1050" font-size="16" fill="#5a6071" text-anchor="end">protstruct_review · update deck 2026-09-07</text>

  <text x="80" y="210" font-size="23" font-weight="400" fill="#1a1a2e">The trust model forbids grading PHENIX solely with PHENIX. Since the 2026-08-13 cutover that is enforced: a sheet</text>
  <text x="80" y="244" font-size="23" font-weight="400" fill="#1a1a2e">carrying a cctbx-only task must either waive it explicitly or close it with an independent oracle. Sheets issued</text>
  <text x="80" y="278" font-size="23" font-weight="400" fill="#1a1a2e">before the cutover are grandfathered and listed by name — history is history.</text>

