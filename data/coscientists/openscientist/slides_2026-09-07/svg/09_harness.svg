<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="0" y="0" width="1920" height="6" fill="#1f4e8c"/>
  <text x="80" y="86" font-size="44" font-weight="700" fill="#1a1a2e">The harness since May</text>
  <text x="80" y="128" font-size="22" font-weight="400" fill="#5a6071">Why the same artefact grades differently now</text>
  <line x1="80" y1="1020" x2="1840" y2="1020" stroke="#e3e6ee" stroke-width="1"/>
  <text x="80" y="1050" font-size="16" fill="#5a6071">1SAR refinement review · openscientist artefact cdba2c07 · re-run 2026-09-07</text>
  <text x="1840" y="1050" font-size="16" fill="#5a6071" text-anchor="end">protstruct_review · update deck 2026-09-07</text>

  <rect x="80" y="210" width="6" height="102" fill="#1f4e8c"/>
  <text x="110" y="240" font-size="25" font-weight="700" fill="#1f4e8c">48-round tolerance series</text>
  <text x="110" y="276" font-size="20" font-weight="400" fill="#1a1a2e">Every [template] threshold that mattered here replaced by a measured band with stated preconditions —</text>
  <text x="110" y="305" font-size="20" font-weight="400" fill="#1a1a2e">including the R offset that dissolved the May gemmi gap.</text>

  <rect x="80" y="342" width="6" height="102" fill="#1f7a3f"/>
  <text x="110" y="372" font-size="25" font-weight="700" fill="#1f7a3f">Negative-control track</text>
  <text x="110" y="408" font-size="20" font-weight="400" fill="#1a1a2e">0 of 22 false verdicts on the control set; agents 21/21; the 2VXN case attributed and stood down rather</text>
  <text x="110" y="437" font-size="20" font-weight="400" fill="#1a1a2e">than quietly dropped.</text>

  <rect x="80" y="474" width="6" height="102" fill="#1f4e8c"/>
  <text x="110" y="504" font-size="25" font-weight="700" fill="#1f4e8c">Gate consolidation</text>
  <text x="110" y="540" font-size="20" font-weight="400" fill="#1a1a2e">Negative-control headlines, governed thresholds and round-count claims are now data checked by the gate,</text>
  <text x="110" y="569" font-size="20" font-weight="400" fill="#1a1a2e">not prose the gate hopes someone re-read.</text>

  <rect x="80" y="606" width="6" height="102" fill="#5a6071"/>
  <text x="110" y="636" font-size="25" font-weight="700" fill="#5a6071">Toolchain routing</text>
  <text x="110" y="672" font-size="20" font-weight="400" fill="#1a1a2e">gemmi pinned at 0.7.5 and routed through toolchain.py — which is how this run knew the May legs had run</text>
  <text x="110" y="701" font-size="20" font-weight="400" fill="#1a1a2e">under 0.7.4, and could say so.</text>

  <rect x="80" y="738" width="6" height="73" fill="#5a6071"/>
  <text x="110" y="768" font-size="25" font-weight="700" fill="#5a6071">Transfer, CI, licensing</text>
  <text x="110" y="804" font-size="20" font-weight="400" fill="#1a1a2e">Repository public under CultureBotAI with CI green; BSD-3-Clause code, CC-BY-4.0 docs and records.</text>

</svg>
