assumptions:
- id: ASSUM_molprobity_top8000_reference
  as_of_date: '2026-04-30'
  effective_at: '2026-04-30T00:00:00+00:00'
  kind: implicit
  scope: tool
  title: Top8000 reference distribution is high-resolution
  description: MolProbity's percentile rankings and outlier definitions come from Top8000, a corpus
    of high-resolution (≤ 2.0 Å) deposited structures. Applying these to a 3.0 Å model still produces
    a percentile, but the threshold for "outlier" was set against tighter geometry than the model
    can deliver.
  consequences: Mid-resolution models (2.5–3.5 Å) accumulate "outliers" that are not actual modelling
    errors but resolution-driven coordinate uncertainty. The published rate can look worse than the
    model is.
  mitigation: Pair every MolProbity number with the model's resolution; cite the resolution-bin percentile
    (wwPDB validation report's column) rather than the all-archive percentile when comparing across
    datasets.
  status: unchecked
  tool_ref: MolProbity (gold)
  evidence_refs:
  - Williams2018
- id: ASSUM_molprobity_h_atom_placement
  as_of_date: '2026-04-30'
  effective_at: '2026-04-30T00:00:00+00:00'
  kind: implicit
  scope: tool
  title: H-atom placement governs clashscore
  description: '`reduce -build` chooses Asn/Gln/His flips and adds H atoms with default bond-length
    and rotamer choices. Different builds shift clashscore by ~0.5 — confirmed on 1SAR (mmtbx.validation_summary
    reports 3.13, standalone Richardson probe + reduce reports 3.63).'
  consequences: '"Matches MolProbity within 1.0" is a guarantee about the metric bucket, not the geometry
    of the H-built model.'
  mitigation: Quote the H-build flags actually used. Do not equate the cctbx wrapper's clashscore
    with the standalone Richardson pipeline's without saying so.
  status: mitigated
  tool_ref: MolProbity (gold)
  evidence_refs:
  - EVAL_1sar_cdba2c07_2026-04-24
- id: ASSUM_molprobity_h_atom_placement_2026_09_23
  as_of_date: '2026-09-23'
  effective_at: '2026-09-23T06:55:50+00:00'
  supersedes_assumption_ref: ASSUM_molprobity_h_atom_placement
  kind: explicit
  scope: tool
  title: Separate hydrogen placement from clash-counting conventions
  description: >-
    Clashscore depends on H coordinates and the counting implementation.
    The retained matched-H-convention benchmark reports a pipeline
    residual, but the two paths build hydrogens separately and do not
    demonstrate identical H coordinates or hetero dictionaries. Its causal
    decomposition is unresolved. Electron-cloud versus nuclear placement
    deliberately changes H geometry, while distinct hetero dictionaries
    can change construction even for the same reduce version. None of
    these observations establishes the cause of the unmatched historical
    1SAR headline difference (3.13 versus 3.63).
  consequences: A clashscore difference alone cannot identify a hydrogen-placement defect. Same-builder
    agreement is not independent confirmation of hydrogen construction, and the old headline difference
    must not be presented as a measured H-builder effect.
  mitigation: Bind comparisons to the exact coordinate subject, H-build version, flags, and hetero
    dictionary. Check the resulting H coordinates and report the clash-counting paths separately.
    Apply registry agreement criteria only when their matched-convention preconditions are met.
  status: unchecked
  tool_ref: MolProbity (gold)
  evidence_refs:
  - ref/research/tolerance_benchmark_clashscore_h.md
  - ref/research/tolerance_benchmark_flip_sets.md
  - scripts/bench_t05_clashscore_h.py
  notes: Registry correction from retained benchmark evidence; no new oracle run.
- id: ASSUM_molprobity_water_altloc
  as_of_date: '2026-04-30'
  effective_at: '2026-04-30T00:00:00+00:00'
  kind: implicit
  scope: tool
  title: probe water + altloc filter (`ogt33`)
  description: '`probe`''s default selection — occupancy > 33% — determines which atoms are eligible
    to clash. Disordered residues at 30% occupancy drop out of the calculation entirely.'
  consequences: Clashscore can hide real geometry problems at low-occupancy altlocs — exactly the
    regions a refinement most needs scrutiny.
  mitigation: Re-run probe with `--noaltloc` or relaxed occupancy thresholds.
  status: unchecked
  tool_ref: MolProbity (gold)
- id: ASSUM_molprobity_rotamer_library_discreteness
  as_of_date: '2026-04-30'
  effective_at: '2026-04-30T00:00:00+00:00'
  kind: implicit
  scope: tool
  title: Discrete rotamer library
  description: A side-chain χ angle one degree outside the favored region scores as a rotamer outlier.
    The "% rotamer outliers" metric is sharp by construction.
  consequences: Borderline outliers are indistinguishable from severe ones in the headline percentage.
  mitigation: Surface the residue ids of all outliers via PerResidueQuality. outliers[] with the actual
    χ deviation as metric_value.
  status: mitigated
  tool_ref: MolProbity (gold)
- id: ASSUM_molprobity_rotamer_library_discreteness_2026_09_23
  as_of_date: '2026-09-23'
  effective_at: '2026-09-23T06:55:50+00:00'
  supersedes_assumption_ref: ASSUM_molprobity_rotamer_library_discreteness
  kind: implicit
  scope: tool
  title: Rotamer classification includes an Allowed region
  description: MolProbity distinguishes Favored, Allowed, and OUTLIER classifications. Outside
    the favored region does not imply an outlier. Classification depends on the residue-specific
    joint torsion-library score, not one χ angle's distance from a favored boundary.
  consequences: A headline outlier percentage does not distinguish borderline from severe outliers;
    an angular offset alone cannot establish the classification.
  mitigation: Retain residue identity and the reported classification and score when available.
    Do not infer OUTLIER from a not-favored label or a single-angle deviation. See scripts/bench_vs_deposited.py's
    three-category score definitions and ref/research/tolerance_benchmark_round7.md.
  status: mitigated
  tool_ref: MolProbity (gold)
- id: ASSUM_tmalign_tm_score_normaliser
  as_of_date: '2026-04-30'
  effective_at: '2026-04-30T00:00:00+00:00'
  kind: implicit
  scope: tool
  title: TM-score is normalised by the FIRST input length
  description: '`TMalign A.pdb B.pdb` normalises TM-score by the length of A. Swapping arguments swaps
    the normaliser and produces a slightly different score.'
  consequences: Reporting "TM-score = 0.987" without identifying which input was first leaves a 0.5–2
    % ambiguity.
  mitigation: Always state which structure was the reference (the normaliser); record both TM-scores
    when chains have different lengths.
  status: mitigated
  tool_ref: TM-align
- id: ASSUM_tmalign_optimal_alignment_drops_residues
  as_of_date: '2026-04-30'
  effective_at: '2026-04-30T00:00:00+00:00'
  kind: explicit
  scope: tool
  title: Sequence-independent — optimal Cα subset
  description: TM-align finds the optimal Cα subset by dynamic programming and drops residues from
    the score that don't fit the alignment. The `Aligned length` field tells you how many were used.
  consequences: For near-identical structures TM-align produces a more generous alignment than LSQ-based
    superposition. RMSD reported next to a TM-align alignment is over a different atom set than RMSD
    reported next to a phenix.superpose_models alignment.
  mitigation: Quote `aligned_length` in PairwiseComparison.residues_aligned. Quote both LSQ and TM-align
    RMSD when reporting both.
  status: mitigated
  tool_ref: TM-align
- id: ASSUM_edstats_needs_2fofc_dfofc_in_mtz
  as_of_date: '2026-04-30'
  effective_at: '2026-04-30T00:00:00+00:00'
  kind: explicit
  scope: tool
  title: edstats requires both 2mFo-DFc AND mFo-DFc in the input MTZ
  description: '`edstats` reads weighted map coefficients (FWT/PHWT for 2mFo-DFc, DELFWT/PHDELWT for
    mFo-DFc) from the input MTZ. Refining with REFMAC NCYC=0 produces both columns; `phenix.refine`
    with `output.map_coefficients` does the same.'
  consequences: Running edstats on a plain F-obs MTZ will fail with cryptic "ERROR(S) in input" without
    naming the missing column.
  mitigation: Pre-stage by running REFMAC NCYC=0 on the model+data first; use that output MTZ as edstats
    input. Already in the pipeline for 1SAR.
  status: unchecked
  tool_ref: edstats
  notes: The 1SAR refmac NCYC=0 run wrote refmac_out.mtz with FWT/PHWT/ DELFWT/PHDELWT — the right
    input shape. Specific keyword-input syntax is the remaining wiring task.
- id: ASSUM_ost_lddt_inclusion_radius
  as_of_date: '2026-04-30'
  effective_at: '2026-04-30T00:00:00+00:00'
  kind: explicit
  scope: tool
  title: lDDT inclusion radius (default 15 Å)
  description: OST's `lddt` CLI defaults to a 15 Å distance inclusion radius. Reducing the radius
    rewards local fidelity; increasing it rewards extended geometry. Two lDDT scores produced with
    different radii are not directly comparable.
  consequences: A 0.97 lDDT at 15 Å is not the same as a 0.97 lDDT at 10 Å. Cross-tool comparisons
    must use the same radius.
  mitigation: Always quote the radius in PairwiseComparison.notes when reporting lDDT. Default 15
    Å for the project; document any deviation.
  status: mitigated
  tool_ref: OpenStructure
  evidence_refs:
  - Mariani2013
- id: ASSUM_ost_lddt_thresholds
  as_of_date: '2026-04-30'
  effective_at: '2026-04-30T00:00:00+00:00'
  kind: explicit
  scope: tool
  title: lDDT cutoff thresholds (0.5, 1, 2, 4 Å)
  description: lDDT counts a distance as "preserved" if it falls within any of four cutoffs (0.5 /
    1 / 2 / 4 Å). The score is the unweighted mean of the four pass-fractions.
  consequences: A model can score 0.97 at 4 Å tolerance but <0.5 at the strict 0.5 Å cutoff. The headline
    lDDT averages over all four; sites with sub-Å precision needs need the per-cutoff breakdown.
  mitigation: OST emits per-cutoff fractions if requested; surface them when the structure claims
    sub-Å accuracy.
  status: unchecked
  tool_ref: OpenStructure
  evidence_refs:
  - Mariani2013
- id: ASSUM_ost_lddt_cα_only_mode
  as_of_date: '2026-04-30'
  effective_at: '2026-04-30T00:00:00+00:00'
  kind: explicit
  scope: tool
  title: -c flag computes Cα-only lDDT
  description: Running `lddt -c` restricts the calculation to Cα atoms (faster, backbone-only). Without
    -c the full all-atom lDDT is computed. The -c variant is what AlphaFold's pLDDT predicts.
  consequences: lDDT-Cα is more permissive than all-atom lDDT (it ignores side-chain placement quality
    entirely).
  mitigation: 'State which mode was used. For the project: -c is acceptable when the structure is
    at moderate resolution (≥ 2.5 Å) where side-chain placement is itself uncertain.'
  status: mitigated
  tool_ref: OpenStructure
  evidence_refs:
  - EVAL_1sar_cdba2c07_2026-04-24
- id: ASSUM_ost_no_built_in_rama_contour
  as_of_date: '2026-04-30'
  effective_at: '2026-04-30T00:00:00+00:00'
  kind: implicit
  scope: tool
  title: No built-in Top8000 Ramachandran contour
  description: OST exposes φ/ψ extraction via residue.GetPhiTorsion() / GetPsiTorsion() but does not
    ship Top8000 contour data for Ramachandran outlier classification. Outlier classification via
    OST requires either external contour data files or a custom coarse classifier (which mis-fires
    on the boundary).
  consequences: OST is not a drop-in replacement for MolProbity's Rama outlier analysis. It IS a drop-in
    replacement for lDDT, structural comparison, and Cα displacement analysis.
  mitigation: Do not use OST for headline Rama outlier % numbers. Use it as a φ/ψ extractor where
    needed; defer outlier classification to MolProbity or a future OST plugin that ships contour data.
  status: known_violation
  tool_ref: OpenStructure
