catalog_tasks:
- id: T01
  task_name: Structure superposition + RMSD
  phenix_tool_refs:
  - phenix.superpose_models
  - phenix.chain_comparison
  phenix_doc_paths:
  - reference/superpose_models.html
  - reference/chain_comparison.html
  oracle_tool_refs:
  - ChimeraX matchmaker
  - PyMOL align/super/cealign
  - TM-align
  - gemmi align
  - US-align
  metric_definition_refs:
  - T01_ca_rmsd_å
  - T01_all-atom_rmsd_å
  - T01_aligned_residues
  - T01_tm-score
  - T01_gdt-ts
  - T01_per-residue_δca
  inputs_description: fixed PDB|moving PDB|optional chain/atom selection
  gold_standard: cross-tool RMSD agreement within 0.1 Å; or deposited reference pose
  example_dataset: 1UBQ vs 1UBI; or deposited structure vs its AlphaFold model
- id: T02
  task_name: Per-residue structural comparison
  phenix_tool_refs:
  - phenix.structure_comparison
  phenix_doc_paths:
  - reference/structure_comparison.html
  oracle_tool_refs:
  - ProSMART
  - LSQMAN
  - PyMOL rms_cur per-residue
  - gemmi script
  metric_definition_refs:
  - T02_per-residue_ramachandran_rotamer_outlier_diffs
  - T02_ss_agreement
  - T02_b-factor_deltas
  - T02_ligand_com_distance
  - T02_omega_cis_trans_flips
  - T02_his_protonation_diffs
  inputs_description: 2+ near-identical PDBs|optional sequence file|optional maps
  gold_standard: cross-tool per-residue agreement; Coot inspection on hotspots
  example_dataset: paired lysozyme mutants; NCS copies from one ASU
- id: T03
  task_name: Reciprocal-space refinement (X-ray)
  phenix_tool_refs:
  - phenix.refine
  - phenix.den_refine
  - phenix.rosetta_refine
  - phenix.amber
  phenix_doc_paths:
  - reference/refinement.html
  - reference/den_refine.html
  - reference/rosetta_refine.html
  - reference/amber.html
  oracle_tool_refs:
  - REFMAC5 (CCP4)
  - BUSTER
  - Servalcat
  metric_definition_refs:
  - T03_r-work
  - T03_r-free
  - T03_r-free_r-work_gap
  - T03_δr-free_vs_input
  - T03_bond_angle_rmsd
  - T03_molprobity_score
  - T03_clashscore
  - T03_ramachandran_favored
  inputs_description: starting model (PDB)|reflection data MTZ w/ F/SIGF + R-free
    flags|optional ligand CIFs
  gold_standard: deposited R-values; REFMAC re-refinement within 0.01–0.02
  example_dataset: PDB 1YQV + deposited MTZ; PDB-REDO entries
- id: T04
  task_name: Real-space refinement (map-based)
  phenix_tool_refs:
  - phenix.real_space_refine
  - phenix.varref
  phenix_doc_paths:
  - reference/real_space_refine.html
  - reference/varref.html
  oracle_tool_refs:
  - Servalcat
  - ISOLDE (ChimeraX)
  - REFMAC real-space
  - Rosetta cryo_em_refinement
  metric_definition_refs:
  - T04_cc_mask
  - T04_cc_box
  - T04_cc_peaks
  - T04_cc_volume
  - T04_d_fsc_model
  - T04_δcc_vs_input
  - T04_clashscore
  - T04_ramachandran_favored
  inputs_description: starting model (PDB)|map (MRC/CCP4)|resolution estimate
  gold_standard: deposited refined model; Servalcat CC/FSC second opinion
  example_dataset: EMDB-11668 / PDB 7a4m (apoferritin); EMDB-20646 / PDB 6u42
- id: T05
  task_name: Geometry validation
  phenix_tool_refs:
  - phenix.holton_geometry_validation
  - phenix.validation
  - phenix.cablam
  - mmtbx.validation_summary
  phenix_doc_paths:
  - reference/holton_geometry_validation.html
  - reference/validation.html
  - reference/cablam_validation.html
  oracle_tool_refs:
  - MolProbity (gold)
  - wwPDB validation pipeline
  - gemmi validators
  - RosettaHoles2
  - ProSA
  - Verify3D
  metric_definition_refs:
  - T05_clashscore
  - T05_ramachandran_favored
  - T05_ramachandran_outlier
  - T05_rotamer_outlier
  - T05_cbeta_outliers
  - T05_bond-length_rmsd
  - T05_bond-angle_rmsd
  - T05_planarity_rmsd
  - T05_chirality_outliers
  - T05_molprobity_composite
  - T05_cablam_outliers
  - T05_rama_z_score
  - T05_packing_z_score
  - T05_unsatisfied_buried_hbond_count
  - T05_b_factor_outlier_z
  inputs_description: model (PDB/mmCIF)
  gold_standard: MolProbity report; wwPDB validation for deposited comparator
  example_dataset: any PDB; 3NIR as clean ultra-high-res baseline
- id: T06
  task_name: Model-vs-data statistics
  phenix_tool_refs:
  - phenix.model_vs_data
  - phenix.mtriage
  - phenix.fmodel
  - phenix.map_correlations
  phenix_doc_paths:
  - reference/model_vs_data.html
  - reference/mtriage.html
  - reference/map_correlations.html
  oracle_tool_refs:
  - CCP4 sfcheck
  - refmac -hklin
  - Servalcat
  - gemmi sfcalc
  - gemmi validate
  - PDB-REDO
  - FSC-Q
  metric_definition_refs:
  - T06_r-work
  - T06_r-free
  - T06_cc_work
  - T06_cc_free
  - T06_cc
  - T06_map-model_fsc_global_per-shell
  - T06_d_fsc_model
  - T06_overall_b
  - T06_wilson_b
  - T06_residue_rscc
  - T06_rscc_outlier_fraction
  - T06_diffraction_precision_index
  inputs_description: model + MTZ (X-ray) or map(s) (cryo-EM)
  gold_standard: PDB/EMDB header-reported values
  example_dataset: PDB 1YQV + MTZ; PDB 7a4m + EMDB-11668 half-maps
- id: T07
  task_name: Predicted-model processing
  phenix_tool_refs:
  - phenix.process_predicted_model
  - phenix.predict_model
  - phenix.predict_and_build
  phenix_doc_paths:
  - reference/process_predicted_model.html
  - reference/predict_model.html
  - reference/predict_and_build.html
  - overviews/predicted_models_index.html
  oracle_tool_refs:
  - pae_to_domains.py (Croll/Tronrud)
  - biotite AF parsers
  - colabfold domain-splitter
  - ChimeraX alphafold
  - QMEANDisCo
  metric_definition_refs:
  - T07_fraction_residues_retained_after_trim
  - T07_mean_plddt_pre_post
  - T07_b-factor_1_plddt²_correlation
  - T07_domain_count_vs_pae_oracle
  - T07_rmsd_of_processed_model_vs_reference_experimental
  - T07_predicted_tm_score
  - T07_interface_predicted_tm_score
  - T07_prediction_ensemble_convergence
  inputs_description: AlphaFold/RoseTTAFold prediction (PDB/mmCIF) w/ pLDDT|optional
    PAE JSON
  gold_standard: AlphaFold-DB pLDDT; experimental structure for same UniProt
  example_dataset: AF-P00698-F1 vs PDB 2LYZ; AF-P0DTC2-F1 vs 6VXX
- id: T08
  task_name: Docking predicted/homology model into a map
  phenix_tool_refs:
  - phenix.dock_predicted_model
  - phenix.dock_in_map
  - phenix.em_placement
  - phenix.dock_and_rebuild
  phenix_doc_paths:
  - reference/dock_predicted_model.html
  - reference/dock_in_map.html
  - reference/em_placement.html
  - reference/dock_and_rebuild.html
  oracle_tool_refs:
  - ChimeraX fitmap
  - Situs colores/collage
  - gmfit
  - cryoSPARC flex-refine rigid body
  metric_definition_refs:
  - T08_placement_cc
  - T08_δcc_vs_random
  - T08_rmsd_to_deposited_position
  - T08_translation_rotation_error
  - T08_em_placement_llg
  inputs_description: predicted/homology model|cryo-EM map|optional mask / centre
    guess
  gold_standard: deposited EMDB-PDB pair
  example_dataset: EMDB-20646 / PDB 6u42
- id: T09
  task_name: Molecular replacement
  phenix_tool_refs:
  - phenix.phaser
  - phenix.MRage
  - phenix.mr_rosetta
  - phenix.morph_model
  - phenix.sculptor
  - phenix.ensembler
  phenix_doc_paths:
  - reference/phaser_mr.html
  - reference/MRage.html
  - reference/mr_rosetta.html
  - reference/morph_model.html
  - reference/sculptor.html
  - reference/ensembler.html
  - reference/phaser.html
  oracle_tool_refs:
  - MoRDa
  - CCP4 Phaser standalone
  - ARCIMBOLDO
  - MOLREP
  metric_definition_refs:
  - T09_phaser_tfz
  - T09_llg
  - T09_translation_rotation
  - T09_post-mr_r-free
  - T09_time-to-solution
  inputs_description: search model (trimmed AlphaFold often)|reflection MTZ|target
    sequence|#copies per ASU
  gold_standard: deposited structure — MR superposes within a few Å CA RMSD
  example_dataset: PDB 1YQV Phaser tutorial data; AF-guided MR targets
- id: T10
  task_name: Ligand fitting
  phenix_tool_refs:
  - phenix.ligandfit
  - phenix.ligand_pipeline
  - phenix.find_all_ligands
  - phenix.eLBOW
  - phenix.REEL
  - phenix.guided_ligand_replacement
  phenix_doc_paths:
  - reference/ligandfit.html
  - reference/ligand_pipeline.html
  - reference/find_all_ligands.html
  - reference/elbow.html
  - reference/reel.html
  - reference/guided_ligand_replacement.html
  oracle_tool_refs:
  - Coot Find Ligand
  - AFITT (OpenEye)
  - rhofit (Global Phasing)
  - CCP4 libcheck/acedrg
  metric_definition_refs:
  - T10_ligand_rscc
  - T10_ligand_rsr
  - T10_ligand_b_vs_surroundings
  - T10_protein-ligand_hbond_count
  - T10_rmsd_to_deposited_ligand_pose
  - T10_ligand_element_identity_z
  - T10_ligand_element_identity
  inputs_description: apo model|map/MTZ|ligand SMILES or coordinates
  gold_standard: deposited holo co-crystal structure
  example_dataset: PDB 1OYT (factor Xa + inhibitor); PHENIX ligandfit tutorial
- id: T11
  task_name: Loop / missing-region fitting
  phenix_tool_refs:
  - phenix.fit_loops
  - phenix.fix_insertions_deletions
  - phenix.rebuild_model
  phenix_doc_paths:
  - reference/fit_loops.html
  - reference/fix_insertions_deletions.html
  - reference/rebuild_model.html
  oracle_tool_refs:
  - Coot Fit Loop (DB/Rama-search)
  - ModLoop
  - Rosetta loopmodel
  - RosettaCM
  metric_definition_refs:
  - T11_loop_rscc
  - T11_ramachandran_favored_within_loop
  - T11_rmsd_rebuilt_vs_reference_loop
  - T11_new_outliers
  inputs_description: model with gap|sequence of missing segment|map/density (for
    real-space)
  gold_standard: deposited full model (held-out loop)
  example_dataset: PDB 3KEE (HIV-1 protease flap); held-out loop in 3NIR
- id: T12
  task_name: Map quality assessment (cryo-EM)
  phenix_tool_refs:
  - phenix.mtriage
  - phenix.local_resolution
  - phenix.map_sharpening
  - phenix.resolve_cryo_em
  phenix_doc_paths:
  - reference/mtriage.html
  - reference/local_resolution.html
  - reference/map_sharpening.html
  - reference/resolve_cryo_em.html
  - overviews/cryo-em_index.html
  oracle_tool_refs:
  - RELION postprocess
  - cryoSPARC 3DFSC
  - ResMap
  - e2proc3d.py (EMAN2)
  - 3DFSC
  - FSC-Q
  metric_definition_refs:
  - T12_global_fsc_resolution_at_0.143_masked_unmasked
  - T12_local_resolution_distribution_mean_stdev_10th_90th
  - T12_d_fsc_model_if_model
  - T12_b-factor_sharpening_estimate
  - T12_directional_resolution_anisotropy
  - T12_local_model_map_fsc_q
  inputs_description: two half-maps|optional mask|optional model
  gold_standard: EMDB-deposited resolution; RELION postprocess report
  example_dataset: EMDB-11668 half-maps; EMDB-20646 half-maps
- id: T13
  task_name: X-ray data quality assessment
  phenix_tool_refs:
  - phenix.xtriage
  - phenix.reflection_statistics
  - phenix.anomalous_signal
  - phenix.explore_metric_symmetry
  phenix_doc_paths:
  - reference/xtriage.html
  - reference/reflection_statistics.html
  - reference/anomalous_signal.html
  - reference/explore_metric_symmetry.html
  oracle_tool_refs:
  - CCP4 aimless
  - pointless
  - ctruncate
  - phaser anisotropy
  metric_definition_refs:
  - T13_completeness_overall_outer
  - T13_i_σ_i
  - T13_r-merge_r-meas
  - T13_cc½
  - T13_l-test_twinning
  - T13_anisotropy_δb_aniso
  - T13_wilson_b
  - T13_tncs_flag
  - T13_ice-ring_flags
  - T13_aimless_status
  inputs_description: merged or unmerged reflection data (MTZ/SCA/CIF)
  gold_standard: publication Table 1; aimless log on same reflections
  example_dataset: PHENIX xtriage tutorial MTZ; PDB-REDO MTZs
- id: T14
  task_name: Hydrogen placement / protonation
  phenix_tool_refs:
  - phenix.reduce
  - phenix.ready_set
  - mmtbx.reduce2
  phenix_doc_paths:
  - reference/hydrogens.html
  - reference/ready_set.html
  oracle_tool_refs:
  - reduce (standalone, Richardson)
  - propka3
  - OpenBabel --addh
  - pdb2pqr
  - Schrödinger PrepWizard
  metric_definition_refs:
  - T14_h_added
  - T14_asn_gln_his_flips_proposed
  - T14_clashscore_delta_pre_vs_post
  - T14_hbond-network_consistency_vs_standalone_reduce
  inputs_description: model without hydrogens (or partial)
  gold_standard: standalone reduce; neutron structure if available
  example_dataset: PDB 1HQ1; PDB 5E5V (neutron pair)
- id: T15
  task_name: Structural/domain classification
  phenix_tool_refs: []
  phenix_doc_paths: []
  oracle_tool_refs:
  - DSSP
  - STRIDE
  - biotite P-SEA
  - CATH
  - SCOPe
  - ECOD
  metric_definition_refs:
  - T15_secondary_structure_agreement
  - T15_secondary_structure_assignment
  - T15_structural_domain_assignment
  - T15_fold_classification
  inputs_description: model (PDB/mmCIF)
  gold_standard: CATH/SCOPe/ECOD consensus where available; three-state agreement between DSSP and an independent second assigner (STRIDE preferred, biotite P-SEA the runnable fallback)
  example_dataset: PDB 1AKE (multi-domain, CATH-classified); PDB 2LYZ (single-domain control)
- id: T16
  task_name: Interface and assembly quality
  phenix_tool_refs: []
  phenix_doc_paths: []
  oracle_tool_refs:
  - PISA/PDBePISA
  - biotite SASA
  - DockQ
  metric_definition_refs:
  - T16_interface_buried_surface_area
  - T16_interface_dockq_score
  - T16_capri_interface_quality_class
  inputs_description: complex or assembly model (PDB/mmCIF)
  gold_standard: deposited biological assembly and CAPRI/DockQ class where available
  example_dataset: PDB 1BRS (barnase-barstar); PDB 2SIC (subtilisin-SSI)
- id: T17
  task_name: NMR ensemble/restraint validation
  phenix_tool_refs: []
  phenix_doc_paths: []
  oracle_tool_refs:
  - wwPDB NMR validation
  - PROCHECK-NMR
  - RPF
  - biotite ensemble
  metric_definition_refs:
  - T17_nmr_restraint_violation_summary
  - T17_nmr_ensemble_precision_rmsd
  inputs_description: NMR ensemble model plus restraints where available
  gold_standard: wwPDB NMR validation report and deposited restraint files
  example_dataset: PDB 1D3Z (ubiquitin NMR ensemble — precision metric); PDB 2N54 (deposited restraints + wwPDB validation report with restraint violations — restraint-summary metric)
