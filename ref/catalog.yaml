# --- Informational / derived metrics surfaced by evaluation runs but not
# --- present in the original catalog source TSV. Added directly here in
# --- the canonical YAML. records_to_tsv.py round-trips the original rows
# --- only; these informational ones live in the YAML.

- id: T03_overall_r_per_shell_weighted
  name: overall R per-shell weighted
  description: >-
    Reflection-count-weighted average of per-shell R-factor produced by
    Servalcat sigmaa. Informational; bounds the R-factor range when the
    work/free split is not separately reported.
  applicable_task_refs:
  - T03

- id: T05_ramachandran_outliers_count
  name: Ramachandran outliers (count)
  description: >-
    Absolute count of Ramachandran outlier residues. Sub-form of
    T05_ramachandran_outlier that records the integer count.
  applicable_task_refs:
  - T05

- id: T05_clashes_unique_pairs
  name: clashes (unique pairs)
  description: >-
    Number of unique atom-pair clashes (overlap ≥ 0.4 Å) reported by probe.
    Feeds the clashscore computation; useful for cross-tool debugging.
  applicable_task_refs:
  - T05

- id: T05_atoms_used_in_clashscore_calc
  name: atoms used in clashscore calc
  description: >-
    Total atom count (heavy + H) used as the denominator in
    clashscore = 1000 * clashes / atoms.
  applicable_task_refs:
  - T05

- id: T05_holton_geom_energy_ratio_sigma
  name: Holton geom-energy ratio (σ)
  description: >-
    Ratio of model geometry energy to ideal-distribution energy in
    sigma units, from phenix.holton_geometry_validation.
  applicable_task_refs:
  - T05

- id: T06_resolution_range
  name: resolution range (Å)
  description: >-
    Low/high resolution span of the reflection data, recorded as text.
  applicable_task_refs:
  - T06

- id: T06_reflections_input_mtz
  name: reflections (input MTZ)
  description: Reflection count in the agent's input MTZ.
  applicable_task_refs:
  - T06

- id: T06_reflections_final_mtz
  name: reflections (final MTZ)
  description: Reflection count in the agent's final MTZ.
  applicable_task_refs:
  - T06

# --- Geometry RMSZ (T05) — over-refinement detector. RMSZ is the Z-score
# --- against restraint targets; not interchangeable with raw RMSD.

- id: T05_bond-length_rmsz
  name: bond-length RMSZ
  description: >-
    Z-score of bond-length deviations against restraint targets. A
    model can have small absolute RMSD but high RMSZ when the restraint
    library is tighter than the modelled deviations — flag for
    over-restraint or broken refinement.
  applicable_task_refs:
  - T05

- id: T05_bond-angle_rmsz
  name: bond-angle RMSZ
  description: Z-score of bond-angle deviations against restraint targets.
  applicable_task_refs:
  - T05

