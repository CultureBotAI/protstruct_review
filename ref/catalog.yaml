# --- Per-residue metrics (scope=residue) — feed PerResidueQuality arrays
# --- in the QDS via PerResidueValue.metric_definition_ref.

- id: T01_per_residue_lddt
  name: per-residue lDDT
  description: >-
    Per-residue local distance difference test score. Stored as one
    PerResidueValue per residue; QDS surfaces summary stats and the
    full array on QualityDataSheet.per_residue_quality.lddt_per_residue.
  applicable_task_refs:
  - T01

- id: T01_lddt_global
  name: global lDDT
  description: >-
    Global lDDT score (whole-structure mean of per-residue lDDT,
    weighted by reference distance count). CASP15+ primary similarity
    metric for pair-of-structures comparison. Reference implementation
    is the OST `lddt` CLI (Mariani et al. 2013).
  applicable_task_refs:
  - T01

- id: T01_per_residue_displacement
  name: per-residue Cα displacement (Å)
  description: Distance from candidate Cα to reference Cα after global alignment.
  applicable_task_refs:
  - T01

- id: T05_per_residue_rsrz
  name: per-residue RSRZ
  description: >-
    Per-residue real-space R-factor Z-score. RSRZ > 2 flags poor
    real-space density agreement at that residue (wwPDB validation).
  applicable_task_refs:
  - T05
  - T06

# --- Trajectory / process metrics (typically captured per refinement round
# --- on the Refinement record but also reportable as scope=complex
# --- MeasurementValues).

- id: T05_overall_b_mean
  name: overall mean B-factor (Å²)
  description: >-
    Mean atomic B-factor across the model. Useful as a cross-round
    trajectory signal and for sanity-checking B-factor scaling.
  applicable_task_refs:
  - T05
  - T03

- id: T05_overall_b_factor_distribution_min
  name: overall B-factor min (Å²)
  applicable_task_refs:
  - T05

- id: T05_overall_b_factor_distribution_max
  name: overall B-factor max (Å²)
  applicable_task_refs:
  - T05

- id: T03_coordinate_error_ml
  name: coordinate error (ML, Å)
  description: Maximum-likelihood estimate of coordinate error from refinement.
  applicable_task_refs:
  - T03

- id: T03_data_to_parameter_ratio_nominal
  name: data-to-parameter ratio (nominal)
  applicable_task_refs:
  - T03

- id: T03_data_to_parameter_ratio_effective
  name: data-to-parameter ratio (effective with NCS / restraints)
  applicable_task_refs:
  - T03

- id: T03_ncs_torsion_restraints_count
  name: NCS torsion restraints (count)
  applicable_task_refs:
  - T03

- id: T05_total_atoms
  name: total atoms in model
  applicable_task_refs:
  - T05
  - T03

- id: T05_waters_count
  name: ordered water count
  applicable_task_refs:
  - T05
  - T03

- id: T05_rama_z_score
  name: Ramachandran-Z score
  description: >-
    Z-score of the Ramachandran distribution against a high-res
    reference. Negative scores flag systematically distorted backbone.
  applicable_task_refs:
  - T05

- id: T10_ligand_b_factor_mean
  name: ligand mean B-factor (Å²)
  description: Mean B-factor over ligand atoms.
  applicable_task_refs:
  - T10

# --- Protein structure quality/refinement indicators added from
# --- ref/protein_structure_quality_refinement_indicators.md.

- id: T05_packing_z_score
  name: packing Z-score
  description: Packing-quality Z-score against a structural reference distribution.
  applicable_task_refs:
  - T05
  scope: complex

- id: T05_unsatisfied_buried_hbond_count
  name: unsatisfied buried H-bond count
  description: Count of buried polar groups lacking satisfying hydrogen bonds.
  applicable_task_refs:
  - T05
  scope: complex

- id: T05_b_factor_outlier_z
  name: B-factor outlier Z-score
  description: Z-score for unusually high or low atomic/residue B-factors.
  applicable_task_refs:
  - T05
  scope: residue

- id: T06_residue_rscc
  name: residue RSCC
  description: Per-residue real-space correlation coefficient.
  applicable_task_refs:
  - T06
  scope: residue

- id: T06_rscc_outlier_fraction
  name: RSCC outlier fraction
  description: Fraction of residues below the configured RSCC quality threshold.
  applicable_task_refs:
  - T06
  scope: complex

- id: T06_diffraction_precision_index
  name: diffraction precision index
  description: Coordinate precision estimate derived from diffraction data and refinement statistics.
  applicable_task_refs:
  - T06
  scope: complex

- id: T07_predicted_tm_score
  name: predicted TM-score
  description: AlphaFold-style predicted TM-score (pTM).
  applicable_task_refs:
  - T07
  scope: complex

- id: T07_interface_predicted_tm_score
  name: interface predicted TM-score
  description: AlphaFold-Multimer interface predicted TM-score (ipTM).
  applicable_task_refs:
  - T07
  scope: interface

- id: T07_prediction_ensemble_convergence
  name: prediction ensemble convergence
  description: Convergence or agreement across predicted-model ensemble replicates.
  applicable_task_refs:
  - T07
  scope: ensemble

- id: T12_directional_resolution_anisotropy
  name: directional resolution anisotropy
  description: Directional resolution spread from 3DFSC-style analysis.
  applicable_task_refs:
  - T12
  scope: dataset

- id: T12_local_model_map_fsc_q
  name: local model-map FSC-Q
  description: Local model-map FSC-Q or equivalent model-map agreement score.
  applicable_task_refs:
  - T12
  scope: residue

- id: T15_secondary_structure_agreement
  name: secondary-structure assignment agreement
  description: Fraction of residues assigned the same secondary-structure state by two
    independent assigners — DSSP paired with a second assigner (STRIDE preferred,
    biotite P-SEA the runnable fallback) — collapsed to the three-state H/E/C
    alphabet. The gradeable cross-tool metric for T15; the per-residue labels themselves
    are carried by T15_secondary_structure_assignment as informational content.
  applicable_task_refs:
  - T15
  scope: complex

- id: T15_secondary_structure_assignment
  name: secondary-structure assignment
  description: DSSP/STRIDE-style secondary-structure labels.
  applicable_task_refs:
  - T15
  scope: residue

- id: T15_structural_domain_assignment
  name: structural domain assignment
  description: Domain boundaries and identifiers from CATH/SCOPe/ECOD-style classification.
  applicable_task_refs:
  - T15
  scope: domain

- id: T15_fold_classification
  name: fold classification
  description: Fold/class assignment from CATH/SCOPe/ECOD-style classification.
  applicable_task_refs:
  - T15
  scope: domain

- id: T16_interface_buried_surface_area
  name: interface buried surface area
  description: Buried surface area for a chain-chain or assembly interface.
  applicable_task_refs:
  - T16
  scope: interface

- id: T16_interface_dockq_score
  name: interface DockQ score
  description: DockQ score for interface model quality.
  applicable_task_refs:
  - T16
  scope: interface

- id: T16_capri_interface_quality_class
  name: CAPRI interface quality class
  description: CAPRI quality class for an interface model.
  applicable_task_refs:
  - T16
  scope: interface

- id: T17_nmr_restraint_violation_summary
  name: NMR restraint violation summary
  description: Summary of distance/angle restraint violations for an NMR ensemble.
  applicable_task_refs:
  - T17
  scope: ensemble

- id: T17_nmr_ensemble_precision_rmsd
  name: NMR ensemble precision RMSD
  description: Ensemble precision RMSD across accepted NMR models.
  applicable_task_refs:
  - T17
  scope: ensemble
