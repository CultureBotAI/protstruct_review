# Structural-criteria registry — self-describing entries per criterion / measurement.
# Schema: schemas/structural_criteria.yaml (class CriteriaCollection).
# Validate: linkml-validate --schema schemas/structural_criteria.yaml ref/structural_criteria.yaml
#
# Each entry consolidates definition + computation recipes + units + value ranges
# + cross-tool agreement + a worked example from a real repo structure. It is the
# rich companion to ref/catalog.yaml, ref/thresholds_and_standards.md,
# ref/tool_recommendations.yaml and ref/oracle_tools.md.

criteria:

  - id: T05_clashscore
    name: MolProbity clashscore
    category: geometry
    catalog_task_refs:
      - T05
    unit: clashes per 1000 atoms
    is_gradeable: true
    definition: >-
      Number of serious all-atom steric overlaps (van der Waals overlap ≥ 0.4 Å),
      counted with the PROBE small-probe contact dot method over explicit hydrogens
      added by REDUCE, normalised per 1000 atoms. Lower is better.
    definition_refs:
      - ref: Chen2010
        full: "Chen VB et al. MolProbity: all-atom structure validation. Acta Cryst. D 2010; 66:12-21."
      - ref: Williams2018
        full: "Williams CJ et al. MolProbity: more and better reference data. Protein Sci. 2018; 27:293-315."
    computations:
      - tool: MolProbity (gold)
        family: non_cctbx
        installed: true
        recipe: "reduce -build model.pdb > model_H.pdb && probe -u -condense -self 'all' model_H.pdb | ..."
        recipe_language: bash
        recipe_notes: >-
          Richardson-lab standalone probe+reduce. H-build convention matters:
          electron-cloud-center (X-ray) vs nuclear (neutron/NMR) placement moves H
          positions and can shift the score; magnitude is model-dependent, not a fixed value.
      - tool: mmtbx.validation_summary
        family: cctbx
        installed: true
        recipe: "mmtbx.validation_summary model.pdb"
        recipe_language: bash
        recipe_notes: "cctbx wrapper of the same probe+reduce machinery; second opinion only (does not satisfy the trust model alone)."
    value_ranges:
      normal:
        max_value: 5.0
        text: "≲ 5 at ≤ 2.0 Å is unremarkable; well under 5 for high-resolution models"
      anomalous:
        min_value: 40.0
        text: "≳ 40 signals severe packing / build errors"
      resolution_dependence: "Clashscore percentile is resolution-graded; absolute counts rise at lower resolution."
    cross_tool_agreement:
      tolerance: "|Δ| ≤ 1.0, or 20 % of the mean, whichever is larger"
      tools: "PHENIX/cctbx vs MolProbity standalone (reduce + probe)"
      precondition: "matched hydrogen-build convention (electron-cloud vs nuclear); a mismatched convention gives 6-23 units of disagreement and VOIDS the comparison rather than failing it"
      provenance:
        - benchmark
      citation: "ref/research/tolerance_benchmark_clashscore_h.md — 10 models, matched median |Δ| 0.115, max 2.27; mismatched median 9.95, max 22.97 (scripts/bench_t05_clashscore_h.py)"
      provisional: false
    example_measurements:
      - structure_id: 1sar
        value_numeric: 3.63
        unit: clashes per 1000 atoms
        tool: MolProbity (gold)
        source: "data/coscientists/openscientist/EVAL_1sar_cdba2c07_2026-04-24.yaml"
        verdict: normal
        interpretation: "11 clashes / 3027 atoms; in line with mmtbx 3.13 (Δ 0.5). Note the benchmark's matched-convention floor is 0.115, so this Δ is larger than implementation noise alone."
      - structure_id: 24mr
        value_numeric: 13.61
        unit: clashes per 1000 atoms
        tool: mmtbx.validation_summary
        source: "scripts/bench_t05_clashscore_h.py (standalone electron-cloud 11.34, Δ -2.27 = 17 %; standalone nuclear 28.54, Δ +14.93)"
        verdict: normal
        interpretation: "Worst matched-convention disagreement in the benchmark, and the reason the tolerance carries a 20 % relative term: 2.27 units is 17 % of a clashscore of 13.6. The same model under a mismatched H convention differs by 14.9 units."
    notes: "The H-build convention is not a caveat but the dominant term: benchmarked, a nuclear-vs-electron-cloud mismatch shifts the score by a median of 9.95 units (max 22.97), while a matched convention agrees to a median of 0.115. The earlier in-repo 1SAR figure (≈ 0.5) understated this by an order of magnitude because it compared two electron-cloud builds. H-atom COUNT agreement (benchmarked max 0.013 %) does not imply H-position agreement and must not be cited as evidence that two H builds match."

  - id: T15_secondary_structure_content
    name: DSSP secondary-structure content
    category: classification
    catalog_task_refs:
      - T15
    unit: fraction
    is_gradeable: false
    definition: >-
      Fraction of all DSSP-scored residues assigned helix or strand after the
      same H/E/C collapse used for the paired-assigner T15 agreement. This is a
      provisional interpretability diagnostic, not a structure-quality score:
      values below 0.20 warn that coil/coil agreement can dominate and make a
      high paired-assigner agreement fraction misleading. The available bad-end
      controls are too sparse to calibrate 0.20 as a quality threshold.
    definition_refs:
      - ref: Kabsch1983
        full: "Kabsch W, Sander C. DSSP. Biopolymers 1983; 22:2577-2637."
    computations:
      - tool: DSSP
        family: non_cctbx
        installed: true
        recipe: "mkdssp --output-format dssp model.pdb out.dssp  # collapse to H/E/C, then (n_H + n_E) / n_DSSP"
        recipe_language: bash
        recipe_notes: >-
          scripts/t15_ss_agreement.py normalizes the input, requires an exact
          residue-key set for the paired agreement, and emits content from the
          complete DSSP assignment rather than an assigner intersection.
    value_ranges:
      expected:
        text: "Provisional interpretability precondition: ≥ 0.20 suggests enough non-coil assignment for the paired-assigner agreement to have useful range; < 0.20 warns that coil/coil agreement may dominate. This is informational in both directions. Historical benchmark: 0.458–0.784 for 16 well-ordered X-ray structures; 0.000–0.105 for three coordinate-perturbed 1UBQ controls."
      resolution_dependence: >-
        The provisional precondition was placed in the observed gap between three
        perturbed 1UBQ controls and one disordered-NMR control; it is not a calibrated
        fold-, modality-, disorder-, or model-quality threshold.
    example_measurements:
      - structure_id: 2jz4_model_1
        value_numeric: 0.371
        unit: fraction
        tool: DSSP
        source: "ref/research/tolerance_benchmark_ss_agreement.md"
        verdict: informational
        interpretation: >-
          The disordered NMR model still contains enough DSSP strand assignment
          to give the paired-agreement number useful interpretive range; clearing
          the provisional precondition is not a claim that the model is well ordered.
      - structure_id: 1ubq_perturbed_1A
        value_numeric: 0.026
        unit: fraction
        tool: DSSP
        source: "ref/research/tolerance_benchmark_ss_agreement.md"
        verdict: informational
        interpretation: >-
          Severe coordinate noise leaves only 2 of 76 residues non-coil while
          the two-assigner agreement rises to 0.8816, demonstrating why low content
          warns against interpreting agreement. It does not establish that low H+E
          content is itself a general model-quality failure.
    notes: >-
      The 0.20 value separates this small retained benchmark, but the bad end is
      only three noisy versions of 1UBQ plus one disordered NMR model. It is therefore
      an informational precondition for interpreting this particular agreement
      metric, not a gradeable verdict and not a general structural-quality threshold.

  - id: T15_secondary_structure_agreement
    name: Secondary-structure assignment agreement (three-state)
    category: classification
    catalog_task_refs:
      - T15
    unit: fraction
    is_gradeable: true
    definition: >-
      Fraction of residues assigned the same three-state (H/E/C) secondary-structure
      label by two independent assigners. For the oracle-side T15 result this value is
      most interpretable when DSSP H+E content clears its provisional 0.20
      precondition. Below it, coil/coil agreement can dominate; that weakens the
      agreement's interpretation but does not grade the model. The historical
      calibration did not retain separate per-assigner counts proving today's exact
      residue-key denominator, so oracle-pair agreement is informational pending a
      rerun. This criterion remains gradeable only in the separate agent-vs-DSSP
      comparison, which has a 0.85 threshold when an agent assignment exists.
    definition_refs:
      - ref: Kabsch1983
        full: "Kabsch W, Sander C. DSSP. Biopolymers 1983; 22:2577-2637."
      - ref: Frishman1995
        full: "Frishman D, Argos P. STRIDE. Proteins 1995; 23:566-579."
    computations:
      - tool: DSSP
        family: non_cctbx
        installed: true
        recipe: "mkdssp --output-format dssp model.pdb out.dssp  # then collapse 8-state -> H/E/C"
        recipe_language: bash
        recipe_notes: "Kabsch-Sander H-bond energetics."
      - tool: biotite P-SEA
        family: non_cctbx
        installed: true
        recipe: "python: struc.annotate_sse(chain)  # Labesse P-SEA, Cα geometry; a/b/c -> H/E/C"
        recipe_language: python
        recipe_notes: "Cα-geometry method; a different algorithm family from DSSP. Use DSSP H+E content as a provisional, informational check on whether coil/coil agreement may dominate. scripts/t15_ss_agreement.py."
    value_ranges:
      expected:
        text: "Report DSSP-vs-biotite agreement informationally. DSSP H+E content ≥ 0.20 provisionally supports interpreting it; content < 0.20 warns that coil/coil calls may dominate but is not a model-quality failure. The historical 0.65 agreement expectation is not a gradeable floor until exact-denominator recalibration."
      resolution_dependence: "Disagreement concentrates at helix/strand ends and is fold-class dependent: expect α-rich ~0.80-0.85 and β-rich ~0.68-0.72 for DSSP vs biotite P-SEA."
    cross_tool_agreement:
      tolerance: "oracle-side: report DSSP H+E content and DSSP-vs-biotite agreement informationally; ≥ 0.20 is only a provisional interpretability precondition for the agreement, and the historical 0.65 expectation is not gradeable until exact-denominator recalibration. The separate agent-vs-DSSP clause is ≥ 0.85 when an agent assignment exists, otherwise unevaluable."
      tools: "DSSP vs biotite P-SEA (t15_ss_agreement.py)"
      precondition: "Disclose which assigner was used and report SS content with agreement. Three-state agreement loses interpretive range at the all-coil end — a model with no assigned secondary structure scores 1.0 because both assigners label everything coil, and perturbing 1UBQ raises its agreement from 0.75 to 1.00 at 2 Å noise. Low content therefore warns that a high agreement is weak evidence; it is not by itself a model-quality failure. Historical fold-dependent expectations (α-rich ~0.80-0.85, β-rich ~0.68-0.72) are not gradeable until exact-denominator recalibration."
      provenance:
        - benchmark
      citation: "ref/research/tolerance_benchmark_ss_agreement.md — historical intersection-denominator run; separate n_dssp/n_biotite/n_dropped values were not retained, so a current exact-denominator rerun is required before grading"
      provisional: true
    example_measurements:
      - structure_id: 1sar
        value_numeric: 0.8646
        unit: fraction
        tool: DSSP + biotite P-SEA
        source: "scripts/t15_ss_agreement.py run on data/pdb_mtz/1sar_deposited.pdb (166/192 = 0.8646 after normalized-input fixes)"
        verdict: informational
        interpretation: "166/192 residues concordant and the current wrapper enforces identical residue-key sets; DSSP H+E content is 75/192 = 0.3906, which clears the provisional interpretability precondition. Agreement remains informational because the multi-structure benchmark has not been rerun under that exact-denominator rule."
      - structure_id: 3est
        value_numeric: 0.6792
        unit: fraction
        tool: DSSP + biotite P-SEA
        source: "scripts/bench_t15_ss_agreement.py (163/240 concordant)"
        verdict: informational
        interpretation: "Historical lowest agreement on a well-ordered β-rich protease. Separate assigner counts were not retained, so this row cannot set a current exact-denominator floor."
      - structure_id: 1ubq_perturbed_2A
        value_numeric: 1.0
        unit: fraction
        tool: DSSP + biotite P-SEA
        source: "scripts/bench_t15_ss_agreement.py (1UBQ with 2 Å Gaussian coordinate noise; DSSP assigns all 76 residues coil, SS content 0.000)"
        verdict: informational
        interpretation: "PERFECT agreement on a coordinate-perturbed control — both assigners find no secondary structure and so agree on every residue. This shows that agreement loses interpretive range at low SS content; it does not calibrate low content as a general model-quality failure."
      - structure_id: 1mbn
        value_numeric: 0.8497
        unit: fraction
        tool: DSSP + biotite P-SEA
        source: "scripts/bench_t15_ss_agreement.py (130/153 concordant)"
        verdict: informational
        interpretation: "Highest agreement in the benchmark, on an all-α fold — the opposite end of the fold-class dependence from 3EST."
    notes: >-
      is_gradeable=true refers only to agent-supplied per-residue labels compared
      against DSSP at the registered 0.85 threshold. The DSSP-vs-biotite wrapper
      emits a different comparison context; both of its rows must remain
      informational with no pass_criterion until exact-denominator recalibration.

  - id: T16_interface_buried_surface_area
    name: Interface buried surface area
    category: interface
    catalog_task_refs:
      - T16
    unit: "Å²"
    is_gradeable: true
    definition: >-
      Total two-sided solvent-accessible surface area buried on complex formation,
      ΣSASA(separated chains) − SASA(complex). This registered value counts both
      interface sides; a per-side value is half the total. A property of the model
      complex, needing no reference.
    definition_refs:
      - ref: Krissinel2007
        full: "Krissinel E, Henrick K. PISA. J. Mol. Biol. 2007; 372:774-797."
      - ref: LeeRichards1971
        full: "Lee B, Richards FM. Solvent-accessible surface area. J. Mol. Biol. 1971; 55:379-400."
    computations:
      - tool: biotite SASA
        family: non_cctbx
        installed: true
        recipe: "python: sum(nansum(struc.sasa(chain, point_number=1000)) for chain) - nansum(struc.sasa(complex, point_number=1000))  # Shrake-Rupley, 1.4 Å probe"
        recipe_language: python
        recipe_notes: "Installable stand-in for PISA (scripts/t16_interface_quality.py). SASA depends on probe radius / point density / water & hetero inclusion."
      - tool: PISA/PDBePISA
        family: web_service
        installed: true
        recipe: "https://www.ebi.ac.uk/pdbe/api/pisa/interfaces/<pdb_id>/1  # PDBe REST API, assembly 1"
        recipe_language: url
        recipe_notes: "`interface_area` is the area buried on ONE side; the harness metric is both sides, so compare against 2 × interface_area. PISA also uses a Lee & Richards surface and counts ligand/hetero atoms in the molecule surface. Symmetry-mate interfaces cannot be reproduced from ASU coordinates alone."
    value_ranges:
      normal:
        text: "Literature size heuristics are commonly per side: transient interfaces ~400-800 Å² per side (~800-1600 Å² total two-sided); obligate/large interfaces >1500 Å² per side (>3000 Å² total two-sided). These are interpretation heuristics, not cross-tool tolerances."
      anomalous:
        max_value: 400.0
        text: "< ~400 Å² total two-sided (< ~200 Å² per side) suggests a crystal-packing contact rather than a biological interface"
    cross_tool_agreement:
      tolerance: "|Δ| ≤ max(3 % of the two total two-sided values' mean, 30 Å²)"
      tools: "biotite SASA vs PISA (PDBe API)"
      precondition: "matched probe radius (1.4 Å), biotite protein-only selection versus the benchmarked PISA API assembly-molecule surface (which may include ligand/hetero atoms), and PISA's per-side interface_area doubled; do not claim the PISA leg is matched protein-only; chain pairs that are fragments of one molecule must be excluded first (they are not interfaces); one-sided — biotite read high in 25/25 benchmark interfaces, so a negative Δ is off-distribution"
      provenance:
        - benchmark
      citation: "ref/research/tolerance_benchmark_interface_bsa.md — 25 interfaces / 17 entries, median |Δ| 1.2 %, p90 2.4 % (scripts/bench_t16_bsa_vs_pisa.py, issues #18 and #25)"
      provisional: false
    example_measurements:
      - structure_id: 1sar
        value_numeric: 437.2
        unit: "Å²"
        tool: biotite SASA
        source: "scripts/t16_interface_quality.py run on the artifact tutorial starting model data/1sar.pdb (chains A/B); not the later RCSB download"
        verdict: informational
        interpretation: "Small A/B interface (437.2 Å² total two-sided; 218.6 Å² per side) in the artifact starting model — 1SAR's crystallographic dimer, a demonstration not a biological assembly. The RCSB deposited file separately measures 442.1 Å² total two-sided."
      - structure_id: 1brs
        value_numeric: 1569.1
        unit: "Å²"
        tool: biotite SASA
        source: "scripts/bench_t16_bsa_vs_pisa.py (chains A/D; PISA 778.5 Å² per side = 1557.0 total, Δ +0.8 %)"
        verdict: normal
        interpretation: "Barnase-barstar, the canonical transient interface; the two oracles agree to within 12 Å²."
      - structure_id: 1dfj
        value_numeric: 2622.6
        unit: "Å²"
        tool: biotite SASA
        source: "scripts/bench_t16_bsa_vs_pisa.py (chains E/I; PISA 1284.7 Å² per side = 2569.5 total, Δ +2.1 %)"
        verdict: normal
        interpretation: "RNase A-RNase inhibitor, a very large obligate interface; the 3 % relative term binds here, not the 30 Å² floor."
      - structure_id: 1vfb
        value_numeric: 697.6
        unit: "Å²"
        tool: biotite SASA
        source: "scripts/bench_t16_bsa_vs_pisa.py (chains A/C; PISA 336.2 Å² per side = 672.4 total, Δ +3.7 %)"
        verdict: borderline
        interpretation: "Worst relative disagreement in the benchmark, on one of its smallest interfaces (336 Å² per side) — but only 25.2 Å² absolute. Small interfaces are where relative agreement is worst and the measurement means least; the 30 Å² floor is what covers this case."

  - id: T13_wilson_b
    name: Wilson B-factor
    category: data_quality
    catalog_task_refs:
      - T13
      - T06
    unit: "Å²"
    is_gradeable: true
    definition: >-
      Overall isotropic B-factor from the Wilson plot: the slope of ln⟨I⟩ vs
      sin²θ/λ² in the high-resolution range, describing the average atomic
      displacement / data fall-off.
    definition_refs:
      - ref: Wilson1949
        full: "Wilson AJC. The probability distribution of X-ray intensities. Acta Cryst. 1949; 2:318-321."
    computations:
      - tool: phenix.xtriage
        family: cctbx
        installed: true
        recipe: "phenix.xtriage data.mtz  # ML anisotropy-aware Wilson B (Popov & Bourenkov 2004; Zwart 2005)"
        recipe_language: bash
        recipe_notes: "ML estimate, less sensitive to resolution truncation than a straight-line plot."
      - tool: ctruncate
        family: non_cctbx
        installed: true
        recipe: "ctruncate -hklin data.mtz -colin '/*/*/[I,SIGI]'  # classic straight-line Wilson plot"
        recipe_language: bash
        recipe_notes: "Bin-choice sensitive (RSCALE control is discouraged)."
    value_ranges:
      normal:
        text: "typically ~10-60 Å²; roughly tracks resolution (higher B at lower resolution)"
      anomalous:
        min_value: 100.0
        text: "> ~100 Å² suggests very weak / low-resolution or radiation-damaged data"
      resolution_dependence: "Wilson B correlates with resolution; comparison is only meaningful at matched resolution and method."
    cross_tool_agreement:
      tolerance: "|Δ| ≤ 25 % of the mean, or 2.5 Å², whichever is larger"
      tools: "xtriage (ML) vs ctruncate (classic)"
      precondition: "same reflection file and same intensity columns; VOID when xtriage reports anisotropy spread ΔB_cart ≥ 25 Å²; prefer like-method comparison or the deposition's Table 1 when a precise value is needed"
      provenance:
        - benchmark
      citation: "ref/research/tolerance_benchmark_wilson_b.md — 24 datasets, median |Δ| 13.7 %, p90 27 % (scripts/bench_t13_wilson_b.py, issue #19)"
      provisional: false
    example_measurements:
      - structure_id: 9plb
        value_numeric: 5.33
        unit: "Å²"
        tool: phenix.xtriage
        source: "scripts/bench_t13_wilson_b.py (d_min 0.88 Å; ctruncate 3.98 Å², Δ +1.35 Å² = +28.9 %)"
        verdict: normal
        interpretation: "Sub-Å data: the whole Wilson B is 5.3 Å², so the retired ±5 Å² band would have permitted a ~100 % error. The 2.5 Å² floor is what covers this regime."
      - structure_id: 9rwi
        value_numeric: 130.62
        unit: "Å²"
        tool: phenix.xtriage
        source: "scripts/bench_t13_wilson_b.py (d_min 3.45 Å; ctruncate 109.19 Å², Δ +21.44 Å² = +17.9 %)"
        verdict: anomalous
        interpretation: "Largest absolute disagreement in the benchmark, and > 100 Å² — weak low-resolution data. Within the 25 % band despite a 21 Å² gap; a fixed ±5 Å² would have flagged it spuriously."
      - structure_id: 28sx
        value_numeric: 28.64
        unit: "Å²"
        tool: phenix.xtriage
        source: "scripts/bench_t13_wilson_b.py (d_min 2.59 Å, ΔB_cart 47.8 Å²; ctruncate 38.84 Å², Δ −10.20 Å² = −30.2 %)"
        verdict: informational
        interpretation: "Strongly anisotropic — the void condition applies. xtriage's ML estimate models the anisotropy, ctruncate's isotropic plot averages over it, so the two are not answering the same question and the comparison is skipped rather than failed."
    notes: "Benchmarked 2026-07: absolute disagreement scales with B itself (r = 0.81), so the tolerance is relative with an absolute floor, not a fixed Å² band. Fit ranges were not matched between programs, so the measured spread is an upper bound on pure estimator divergence."

  - id: T17_nmr_ensemble_precision_rmsd
    name: NMR ensemble precision (ordered-core mean Cα RMSF)
    category: ensemble
    catalog_task_refs:
      - T17
    unit: "Å"
    is_gradeable: true
    definition: >-
      Mean per-residue Cα root-mean-square fluctuation about the ensemble mean,
      after superposing every model onto a reference model — computed over the
      ordered core (residues with RMSF ≤ 2 Å), which is the tool-comparable figure.
      The whole-chain mean is dominated by flexible termini and is reported alongside.
    definition_refs:
      - ref: Vuister2014
        full: "Vuister GW et al. Tools for the validation of protein NMR structures. J. Biomol. NMR 2014."
    computations:
      - tool: biotite ensemble
        family: non_cctbx
        installed: true
        recipe: "python: superimpose(ca[0], ca); rmsf(average, superposed); mean over residues ≤ 2 Å  # scripts/t17_nmr_ensemble.py"
        recipe_language: python
        recipe_notes: "Ordered-core selection (RMSF ≤ 2 Å) makes the value comparable across tools; whole-chain mean is selection-dominated."
    value_ranges:
      normal:
        max_value: 1.0
        text: "sub-Ångström ordered-core precision for a well-determined ensemble"
      anomalous:
        min_value: 2.0
        text: "ordered-core > 2 Å indicates a poorly-determined ensemble"
      resolution_dependence: "Selection alone can move whole-chain ensemble RMSD ~2×; always report the ordered-core figure."
    cross_tool_agreement:
      tolerance: "|Δ| ≤ 0.05 Å on a matched ordered-core selection"
      tools: "biotite ensemble vs another RMSF tool"
      precondition: "matched ordered-core definition (OLDERADO / PSVS FindCore)"
      provenance:
        - template
      citation: "ref/thresholds_and_standards.md"
      provisional: false
    example_measurements:
      - structure_id: 1d3z
        value_numeric: 0.316
        unit: "Å"
        tool: biotite ensemble
        source: "scripts/t17_nmr_ensemble.py run"
        verdict: normal
        interpretation: "Ordered core 74/76 residues; whole-chain mean 0.428 Å inflated by 2 flexible C-terminal residues (max 5.9 Å)."

  - id: T06_r_factor_offset
    name: Independent-code-path R offset
    category: data_quality
    catalog_task_refs:
      - T06
    unit: dimensionless
    is_gradeable: true
    definition: >-
      Difference between the crystallographic R-work reported by PHENIX and the same
      quantity re-derived from an independent structure-factor calculation,
      R = Σ||F_obs| − |F_calc|| / Σ|F_obs| over the work set. Bounds how far an
      independent re-derivation may land from PHENIX before the difference means
      something about the model rather than about the two implementations.
    definition_refs:
      - ref: Brunger1992
        full: "Brünger AT. Free R value: a novel statistical quantity for assessing the accuracy of crystal structures. Nature 1992; 355:472-475."
    computations:
      - tool: phenix.model_vs_data
        family: cctbx
        installed: true
        recipe: "phenix.model_vs_data model.pdb data.mtz  # r_work"
        recipe_language: bash
        recipe_notes: "Refits k_iso / k_aniso / k_mask PER RESOLUTION BIN, so its R is systematically the lower of the two."
      - tool: gemmi sfcalc
        family: non_cctbx
        installed: true
        recipe: "gemmi sfcalc --dmin=<d_min> --radii-set=cctbx --scale-to=data.mtz:FP:SIGFP --to-mtz=calc.mtz model.pdb"
        recipe_language: bash
        recipe_notes: "Same flat-mask bulk-solvent + anisotropic scaling model as PHENIX — NOT a simplified code path — but one GLOBAL scale rather than per-bin. Sum R outside the program. --radii-set=cctbx is required: gemmi's default vdw mask adds a further median +0.0043 (max +0.014)."
    value_ranges:
      normal:
        text: "R_work ~0.13-0.26 for the deposited entries benchmarked; the offset itself is ~0.007"
      anomalous:
        text: "a NEGATIVE offset (gemmi below PHENIX) is off-distribution — gemmi read high in 15/15 — and indicates a configuration problem, most often a free-flag convention error"
    cross_tool_agreement:
      tolerance: "|Δ R| ≤ 0.02"
      tools: "gemmi sfcalc vs phenix.model_vs_data"
      precondition: "same model, same MTZ, same work set, and matched mask radii (--radii-set=cctbx); the free-flag test value must be determined per file (two-valued flags = minority is the test set; CCP4 multi-bin flags = bin 0 is the test set) — inverting it computes R-free and calls it R-work, worth about +0.06"
      provenance:
        - benchmark
      citation: "ref/research/tolerance_benchmark_r_offset.md — 15 entries, 1.20-2.92 Å, median |Δ| 0.0069, p90 0.0116, max 0.0151 (scripts/bench_t06_r_offset.py)"
      provisional: false
    example_measurements:
      - structure_id: 12lo
        value_numeric: 0.0046
        unit: dimensionless
        tool: gemmi sfcalc
        source: "scripts/bench_t06_r_offset.py (PHENIX 0.1740, gemmi 0.1786, 11025 work reflections at 1.37 Å)"
        verdict: normal
        interpretation: "Typical offset; the gemmi work-set size matched PHENIX's Nwork exactly, confirming the free-flag convention was read correctly."
      - structure_id: 11mq
        value_numeric: 0.0151
        unit: dimensionless
        tool: gemmi sfcalc
        source: "scripts/bench_t06_r_offset.py (PHENIX 0.2331, gemmi 0.2482 at 2.38 Å; mask-convention effect +0.0140)"
        verdict: borderline
        interpretation: "Largest offset in the benchmark, and the one with the largest mask-convention sensitivity — nearly all of it disappears under a matched mask. CCP4 multi-bin free flags (bin 0 = test), verified against PHENIX's Nfree of 517."
    notes: "The offset is one-sided by construction: per-bin scaling cannot fit worse than global scaling on the same data, so PHENIX's R is always the lower number. Neither value is 'the true R'."

  - id: T05_bond_length_rmsd
    name: Bond-length RMSD
    category: geometry
    catalog_task_refs:
      - T05
    unit: "Å"
    is_gradeable: true
    definition: >-
      Root-mean-square deviation of modelled bond lengths from their restraint-library
      target values, over the covalent-geometry bond population.
    definition_refs:
      - ref: EnghHuber1991
        full: "Engh RA, Huber R. Accurate bond and angle parameters for X-ray protein structure refinement. Acta Cryst. A 1991; 47:392-400."
      - ref: Moriarty2016
        full: "Moriarty NW, Tronrud DE, Adams PD, Karplus PA. A new default restraint library for the protein backbone in Phenix: a conformation-dependent geometry goes mainstream. Acta Cryst. D 2016; 72(1):176-179."
    computations:
      - tool: phenix.model_statistics
        family: cctbx
        installed: true
        recipe: "phenix.model_statistics model.pdb  # 'covalent geometry : bond' line"
        recipe_language: bash
        recipe_notes: "Scores against the conformation-dependent library (CDL), PHENIX's default since ~2016. Use the covalent-geometry line, not the headline Bond: line, which also includes SS-bond and link restraints."
      - tool: gemmi rmsz
        family: non_cctbx
        installed: true
        recipe: "source ccp4.setup-sh && gemmi rmsz -q model.pdb  # 'Model rmsD: bond' line"
        recipe_language: bash
        recipe_notes: "The subcommand is `rmsz`, NOT `validate` (no such gemmi subcommand). It prints rmsZ (unitless) and rmsD (Å) on separate lines; only rmsD is comparable to a PHENIX RMSD. Scores against the CCP4 monomer library via $CLIBD_MON."
    value_ranges:
      normal:
        max_value: 0.02
        text: "~0.002-0.018 Å across the benchmarked deposited models"
      anomalous:
        text: "a NEGATIVE Δ (gemmi below PHENIX) is off-distribution — gemmi read high in 17/17 against PHENIX/CDL"
    cross_tool_agreement:
      tolerance: "|Δ| ≤ 0.008 Å"
      tools: "phenix.model_statistics (CDL) vs gemmi rmsz (CCP4 monomer library)"
      precondition: "both tools must restrain the same number of bonds (only 6/17 benchmark models did — where counts differ, often ~2× from alternate-conformation handling, the comparison is VOID: report both figures with their counts). With MATCHED libraries use |Δ| ≤ 0.006 Å — barely tighter, because the restraint library accounts for only ~21 % of the disagreement for bond LENGTHS on matched-count models (9 % across all models, deflated by count-mismatched ones; unlike bond angles, where it is a stable ~51 %)"
      provenance:
        - benchmark
      citation: "ref/research/tolerance_benchmark_bond_rmsd.md — 17 models; matched-count subset median |Δ| 0.0040 Å, max 0.0070 Å (scripts/bench_t05_bond_rmsd.py)"
      provisional: false
    example_measurements:
      - structure_id: 30iz
        value_numeric: 0.0038
        unit: "Å"
        tool: phenix.model_statistics
        source: "scripts/bench_t05_bond_rmsd.py (gemmi 0.0080 Å over the same 9513 bonds, Δ +0.0042)"
        verdict: normal
        interpretation: "Matched bond count, and the disagreement still exceeds the retired ±0.003 Å tolerance — the library difference alone accounts for it."
      - structure_id: 30tw
        value_numeric: 0.0143
        unit: "Å"
        tool: phenix.model_statistics
        source: "scripts/bench_t05_bond_rmsd.py (gemmi 0.0810 Å over 9544 bonds vs PHENIX's 4677, Δ +0.0667)"
        verdict: anomalous
        interpretation: "Bond counts differ by ~2×, so the two RMSDs sum over different restraint populations and the Δ is meaningless — the void condition applies."
    notes: "The direction is fixed, not random — gemmi read high in 17/17. The cause is NOT mainly the restraint library: isolating the library inside one implementation (PHENIX CDL vs Engh & Huber) moves bond RMSD by a median of only 0.00085 Å on matched-count models, 21 % of the cross-library gap (9 % across all 17), so the majority is implementation. This corrects an earlier attribution by analogy with bond angles, where the library IS about half the gap (median 0.265°). See ref/research/tolerance_benchmark_restraint_library.md."

  - id: T01_ca_rmsd
    name: Cα RMSD between superposed models
    category: geometry
    catalog_task_refs:
      - T01
    unit: "Å"
    is_gradeable: true
    definition: >-
      Root-mean-square deviation over Cα pairs that a superposition tool has aligned,
      after rigid-body superposition. Defined only relative to the set of residues the
      aligner chose, which is why the aligned-residue count must accompany it.
    definition_refs:
      - ref: Zhang2005
        full: "Zhang Y, Skolnick J. TM-align: a protein structure alignment algorithm based on the TM-score. Nucleic Acids Res. 2005; 33:2302-2309."
    computations:
      - tool: phenix.superpose_models
        family: cctbx
        installed: true
        recipe: "phenix.superpose_models fixed.pdb moving.pdb morph=False trim=False  # 'Final ... RMSD: <r> N: <n> of <m>'"
        recipe_language: bash
        recipe_notes: "morph and trim default to True and DEFORM the moving model to improve the fit; both must be off to compare against a rigid-body aligner."
      - tool: TM-align
        family: non_cctbx
        installed: true
        recipe: "TMalign fixed.pdb moving.pdb -ter 0  # 'Aligned length= <n>, RMSD= <r>'"
        recipe_language: bash
        recipe_notes: "-ter 0 is required for multi-chain files: by default TM-align stops at the first TER and aligns the FIRST CHAIN ONLY, which on 1A2P/1BNI inflates the aligned-count difference from 31 to 185 residues."
    value_ranges:
      normal:
        text: "0.09-1.6 Å across the benchmarked deposited pairs"
      anomalous:
        text: "an RMSD difference over ~0.03 Å between aligners on the SAME aligned-residue count indicates a configuration difference (morphing left on, different atom selection), not a real disagreement"
    cross_tool_agreement:
      tolerance: "|Δ| ≤ 0.03 Å"
      tools: "phenix.superpose_models vs TM-align"
      precondition: "VOID unless both aligners report the same aligned-residue count — a difference of even ONE residue moved the RMSD by 0.15 Å (1MBN/1MBO); when counts differ, report both RMSDs with their counts instead of a Δ. Also requires morph=False trim=False on the PHENIX side and -ter 0 on the TM-align side"
      provenance:
        - benchmark
      citation: "ref/research/tolerance_benchmark_superposition.md — 20 pairs incl. homologs; matched-selection max |Δ| 0.02 Å (13/20 pairs), unmatched up to 0.66 Å (scripts/bench_t01_superposition.py, issue #30)"
      provisional: false
    example_measurements:
      - structure_id: 1lyz
        value_numeric: 0.78
        unit: "Å"
        tool: phenix.superpose_models
        source: "scripts/bench_t01_superposition.py (vs 1LZ1; TM-align 0.76 Å over the same 129 residues, Δ +0.02)"
        verdict: normal
        interpretation: "Hen vs human lysozyme, ~60 % identity — tied for the largest matched-selection disagreement in the benchmark (with 4LYZ/1LZ1), and still well inside 0.03 Å. The three largest matched disagreements are all homolog pairs, so the floor rises with divergence — but only to 0.02 Å."
      - structure_id: 1mbn
        value_numeric: 0.46
        unit: "Å"
        tool: phenix.superpose_models
        source: "scripts/bench_t01_superposition.py (vs 1MBO; TM-align 0.61 Å over 153 residues vs PHENIX's 152, Δ -0.15)"
        verdict: anomalous
        interpretation: "A one-residue selection difference produced a 0.15 Å RMSD gap — 5× the tolerance. This is the case that makes the same-count condition a gate rather than advice."
    notes: "Selection dominates this measurement. On matched selections the two aligners agree to 0.02 Å; off them they diverge to 0.50 Å, so the aligned-residue count must always be reported alongside the RMSD."
