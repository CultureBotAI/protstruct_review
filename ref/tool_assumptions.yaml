# Per-tool assumption catalog — protstruct_review v5
#
# One Assumption record per (tool, distinct assumption). Joined into the
# QDS via measurement.oracle_tool_ref → tool.assumptions[]. The QDS
# emitter aggregates these into QualityDataSheet.assumptions_report so
# a downstream consumer sees the full inferential basis for every
# number, without having to read each tool's docs.
#
# Schema: schemas/protstruct_review.yaml — class Assumption.
# Companion prose: .claude/skills/protstruct-eval.md, "Tool assumptions"
# section.
#
# Convention: id = ASSUM_<tool-slug>_<assumption-slug>. Every row carries the
# human date and exact timezone-qualified activation instant so an immutable
# QDS can select only assumptions that existed when it was issued. Add a new
# version id plus `supersedes_assumption_ref` for a substantive revision; do
# not rewrite a row already snapshotted by an issued QDS.

assumptions:

  # ---------- MolProbity / probe / reduce -------------------------------

  - id: ASSUM_molprobity_top8000_reference
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: implicit
    scope: tool
    title: Top8000 reference distribution is high-resolution
    description: >-
      MolProbity's percentile rankings and outlier definitions come from
      Top8000, a corpus of high-resolution (≤ 2.0 Å) deposited
      structures. Applying these to a 3.0 Å model still produces a
      percentile, but the threshold for "outlier" was set against
      tighter geometry than the model can deliver.
    consequences: >-
      Mid-resolution models (2.5–3.5 Å) accumulate "outliers" that are
      not actual modelling errors but resolution-driven coordinate
      uncertainty. The published rate can look worse than the model is.
    mitigation: >-
      Pair every MolProbity number with the model's resolution; cite
      the resolution-bin percentile (wwPDB validation report's column)
      rather than the all-archive percentile when comparing across
      datasets.
    status: unchecked
    tool_ref: MolProbity (gold)
    evidence_refs:
      - Williams2018

  - id: ASSUM_molprobity_h_atom_placement
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: implicit
    scope: tool
    title: H-atom placement governs clashscore
    description: >-
      `reduce -build` chooses Asn/Gln/His flips and adds H atoms with
      default bond-length and rotamer choices. Different builds shift
      clashscore by ~0.5 — confirmed on 1SAR (mmtbx.validation_summary
      reports 3.13, standalone Richardson probe + reduce reports 3.63).
    consequences: >-
      "Matches MolProbity within 1.0" is a guarantee about the metric
      bucket, not the geometry of the H-built model.
    mitigation: >-
      Quote the H-build flags actually used. Do not equate the cctbx
      wrapper's clashscore with the standalone Richardson pipeline's
      without saying so.
    status: mitigated
    tool_ref: MolProbity (gold)
    evidence_refs:
      - EVAL_1sar_cdba2c07_2026-04-24

  - id: ASSUM_molprobity_water_altloc
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: implicit
    scope: tool
    title: probe water + altloc filter (`ogt33`)
    description: >-
      `probe`'s default selection — occupancy > 33% — determines which
      atoms are eligible to clash. Disordered residues at 30% occupancy
      drop out of the calculation entirely.
    consequences: >-
      Clashscore can hide real geometry problems at low-occupancy
      altlocs — exactly the regions a refinement most needs scrutiny.
    mitigation: Re-run probe with `--noaltloc` or relaxed occupancy thresholds.
    status: unchecked
    tool_ref: MolProbity (gold)

  - id: ASSUM_molprobity_rotamer_library_discreteness
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: implicit
    scope: tool
    title: Discrete rotamer library
    description: >-
      A side-chain χ angle one degree outside the favored region scores
      as a rotamer outlier. The "% rotamer outliers" metric is sharp
      by construction.
    consequences: Borderline outliers are indistinguishable from severe ones in the headline percentage.
    mitigation: >-
      Surface the residue ids of all outliers via PerResidueQuality.
      outliers[] with the actual χ deviation as metric_value.
    status: mitigated
    tool_ref: MolProbity (gold)

  # ---------- phenix.refine in-run R-factors -------------------------

  - id: ASSUM_phenix_refine_in_run_r_factors_use_internal_scaling
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: In-run R-factors use a particular bulk-solvent + scaling
    description: >-
      `phenix.refine` reports R-work / R-free using its in-run bulk-
      solvent (Babinet) and overall anisotropic scaling that minimised
      during refinement. These numbers are NOT the same as those
      `phenix.model_vs_data` produces from a fresh re-derivation.
    consequences: >-
      Repeatedly observed 0.01–0.015 R-unit gap on the 1SAR artefact;
      the round-7 R-free-gap straddles the < 0.05 success criterion
      precisely because of this gap (agent 0.050, oracle 0.0552).
    mitigation: >-
      Always re-derive R-factors with `phenix.model_vs_data` against
      the same MTZ; compare. Report the model_vs_data number as the
      QDS value of record.
    status: known_violation
    tool_ref: phenix.refine
    evidence_refs:
      - EVAL_1sar_cdba2c07_2026-04-24

  - id: ASSUM_phenix_refine_rfree_flags_fixed
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: R-free flag set is fixed across rounds
    description: >-
      Cross-validation by R-free assumes the test set is fixed and
      untouched between rounds. Regenerating R-free flags partway
      through silently breaks the cross-validation.
    consequences: An apparent improvement in R-free can be an artefact of test-set rotation.
    mitigation: Compare reflection counts and R-free-flag column labels at every round.
    status: unchecked
    tool_ref: phenix.refine

  # ---------- phenix.model_vs_data -----------------------------------

  - id: ASSUM_phenix_mvd_treats_model_as_fixed
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: Model is fixed; not a refinement
    description: >-
      `phenix.model_vs_data` re-computes R-factors with its own bulk-
      solvent fit but does not move atoms. The R-factors it reports
      are for the input model exactly as deposited.
    consequences: >-
      A model that converged in PHENIX with one scaling will look
      slightly different here. Treat the model_vs_data value as the
      catalog T06 oracle of record.
    mitigation: None needed; this is the intended behaviour.
    status: verified
    tool_ref: phenix.model_vs_data

  # ---------- gemmi sfcalc + custom R calc ---------------------------

  - id: ASSUM_gemmi_sfcalc_simpler_bulk_solvent
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: Flat-bulk solvent, no anisotropic scaling
    description: >-
      `scripts/gemmi_rfactor.py` uses a flat-bulk solvent + bin-wise
      isotropic rescaling, with the scales fit on WORK reflections only
      and applied unchanged to the free set (#316 — the pre-#316 all-
      reflection fit leaked the test set into R-free; measured effect
      on real pairs was <= 1e-5, so the bracket below is unchanged).
      PHENIX uses anisotropic scaling on top of a Babinet-style
      bulk-solvent fit.
    consequences: >-
      Expect 0.005–0.015 higher R-work from gemmi than from PHENIX on
      the same data — that is the price of an independent code path.
      Do NOT report the gemmi number as the agent's claim being wrong;
      report the bracket between the two.
    mitigation: >-
      Cite both numbers in the QDS notes. Use the larger Δ as the
      conservative bound.
    status: mitigated
    tool_ref: gemmi sfcalc

  - id: ASSUM_gemmi_sfcalc_linear_resolution_shells
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: implicit
    scope: tool
    title: Linearly-binned resolution shells
    description: >-
      The custom R-calc bins reflections by 1/d² in equal-count bins;
      PHENIX uses adaptive shells.
    consequences: Per-shell R numbers are not directly comparable across the two tools.
    mitigation: Use overall R-work / R-free for cross-tool comparison, not per-shell.
    status: mitigated
    tool_ref: gemmi sfcalc

  # ---------- TM-align ---------------------------------------------------

  - id: ASSUM_tmalign_tm_score_normaliser
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: implicit
    scope: tool
    title: TM-score is normalised by the FIRST input length
    description: >-
      `TMalign A.pdb B.pdb` normalises TM-score by the length of A.
      Swapping arguments swaps the normaliser and produces a slightly
      different score.
    consequences: >-
      Reporting "TM-score = 0.987" without identifying which input was
      first leaves a 0.5–2 % ambiguity.
    mitigation: >-
      Always state which structure was the reference (the normaliser);
      record both TM-scores when chains have different lengths.
    status: mitigated
    tool_ref: TM-align

  - id: ASSUM_tmalign_optimal_alignment_drops_residues
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: Sequence-independent — optimal Cα subset
    description: >-
      TM-align finds the optimal Cα subset by dynamic programming and
      drops residues from the score that don't fit the alignment.
      The `Aligned length` field tells you how many were used.
    consequences: >-
      For near-identical structures TM-align produces a more
      generous alignment than LSQ-based superposition. RMSD reported
      next to a TM-align alignment is over a different atom set than
      RMSD reported next to a phenix.superpose_models alignment.
    mitigation: >-
      Quote `aligned_length` in PairwiseComparison.residues_aligned.
      Quote both LSQ and TM-align RMSD when reporting both.
    status: mitigated
    tool_ref: TM-align

  # ---------- Servalcat -------------------------------------------------

  - id: ASSUM_servalcat_sigmaa_per_shell_only
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: per-shell sigma-A R, not work/free split by default
    description: >-
      `servalcat sigmaa` reports a per-shell composite R and per-bin
      sigma-A weights, not a separately-cross-validated R-work / R-free.
      The "overall R" we surface is a reflection-count-weighted mean
      over the shells.
    consequences: >-
      Treating the Servalcat number as a direct R-free substitute is
      incorrect — it is a different quantity.
    mitigation: >-
      In the QDS, label this as "overall R per-shell weighted" (already
      done via T03_overall_r_per_shell_weighted) and keep R-free
      reporting on phenix.model_vs_data and gemmi.
    status: mitigated
    tool_ref: Servalcat

  - id: ASSUM_servalcat_refine_xtal_actually_refines
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: refine_xtal_norefmac re-refines the model
    description: >-
      `servalcat refine_xtal_norefmac` runs a full refinement; the
      resulting R-factor is for a NEW model, not a re-measurement of
      the input.
    consequences: >-
      Comparing this R-factor to the agent's R-factor is comparing
      two different models. It is a useful "what does an independent
      refiner do with this data" check, not a re-measurement.
    mitigation: "Cite both — input model R via model_vs_data, re-refined R via servalcat."
    status: mitigated
    tool_ref: Servalcat

  # ---------- phenix.holton_geometry_validation -----------------------

  - id: ASSUM_holton_rmsz_not_rmsd
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: Reports RMSZ against PHENIX restraint targets
    description: >-
      Holton geometry validation reports σ-units against PHENIX's
      internal restraint library. RMSZ is not interchangeable with
      raw RMSD — a tight restraint library can flag small absolute
      RMSDs as high-Z outliers.
    consequences: >-
      "Bond RMSD 0.008 Å" and "bond RMSZ 1.4 σ" are both fine; they
      are not the same number.
    mitigation: Schema v3+ carries both bond_rmsd_a and bond_rmsz on GeometrySummary.
    status: mitigated
    tool_ref: phenix.holton_geometry_validation

  # ---------- phenix.find_peaks_holes ----------------------------------

  - id: ASSUM_find_peaks_holes_cutoff_and_merging
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: σ cutoff, merging radius, atom exclusion all change peak counts
    description: >-
      Default 4.0 σ cutoff; default peak-merging radius collapses
      multi-atom features; near-modelled-atom peaks are excluded by
      default. The 1SAR agent's report listed 9 peaks; the oracle
      run at 4 σ found 23 positive + 8 negative peaks.
    consequences: >-
      Different parameter choices = different counts. "All peaks > 4
      σ are explained" is meaningless without naming the cutoff /
      merging radius / exclusion settings used to produce the list.
    mitigation: >-
      Always quote the cutoff and merging settings. Re-run the oracle
      with the same settings before adopting the agent's peak list.
    status: known_violation
    tool_ref: phenix.find_peaks_holes
    evidence_refs:
      - EVAL_1sar_cdba2c07_2026-04-24

  # ---------- CCP4 / REFMAC5 / ProSMART -----------------------------

  - id: ASSUM_refmac_restraint_library
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: REFMAC5 uses the CCP4 monomer library
    description: >-
      REFMAC5 reports geometry RMSZ against the CCP4 restraint
      dictionary, which is an independent code path from PHENIX's
      restraint library (mon_lib).
    consequences: >-
      RMSZ from REFMAC and RMSZ from phenix.holton_geometry_validation
      can disagree on the same atoms because the σ targets differ —
      typically by 0.1-0.3 σ, occasionally more for unusual residues.
    mitigation: >-
      State which library was used. Cross-tool RMSZ agreement within
      ~0.5 σ counts as confirmed; larger disagreement flags either a
      modelling issue or a restraint-library mismatch.
    status: mitigated
    tool_ref: REFMAC5

  - id: ASSUM_refmac_solvent_modelling
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: REFMAC5 uses Babinet-style bulk solvent
    description: >-
      REFMAC5's bulk-solvent model differs from PHENIX's. R-factors
      from a REFMAC re-refinement are not directly comparable to
      PHENIX in-run values; expect differences in the 0.005-0.015
      range on the same data.
    consequences: >-
      A REFMAC re-refinement of the agent's model giving 0.158 R-free
      vs phenix.refine 0.149 is not necessarily a "regression" — it's
      a different scaling.
    mitigation: >-
      When using REFMAC as a second-opinion refiner, compare on the
      same scale (REFMAC vs REFMAC, PHENIX vs PHENIX) for cross-round
      Δ-claims; cross-tool comparison is for "are we in the same
      bracket".
    status: mitigated
    tool_ref: REFMAC5

  - id: ASSUM_prosmart_reference_dependent
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: ProSMART analysis is reference-dependent
    description: >-
      ProSMART computes per-residue scores AGAINST a reference
      structure (typically the deposited model or a high-resolution
      comparator). Choosing a different reference changes every
      score. There is no "absolute" ProSMART number for a structure.
    consequences: >-
      A ProSMART Rama-Z of 1.2 vs reference X is not the same number
      as 1.2 vs reference Y. Reports must always quote the reference.
    mitigation: >-
      Pin the reference per evaluation. For agentic refinement vs
      starting model, use the agent's input model as the reference.
      For absolute geometry analysis, use Top8000 (when available
      via ProSMART's data files) or compare to a high-resolution
      family member.
    status: mitigated
    tool_ref: ProSMART

  - id: ASSUM_prosmart_no_top8000_default
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: implicit
    scope: tool
    title: ProSMART needs an explicit reference; no Top8000 default
    description: >-
      Unlike MolProbity (which has Top8000 baked in), ProSMART's
      Rama-Z analysis requires the user to supply a reference. The
      tool ships with template-based options but no single default.
    consequences: >-
      Running ProSMART without specifying a reference gives a
      meaningless score; misconfigured runs can pass silently.
    mitigation: Always specify the reference structure on the command line.
    status: unchecked
    tool_ref: ProSMART

  # ---------- CheckMyMetal (web service) -----------------------------

  - id: ASSUM_checkmymetal_geometry_based
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: Heuristic geometry classification — not anomalous Fourier
    description: >-
      CheckMyMetal classifies modelled metal-ion identity by comparing
      observed coordination geometry (number of contacts, bond lengths,
      angles, B-factor) against canonical expectations per element.
      Returns a verdict: "modelled element OK" / "alternative element X
      fits better" / "uninterpretable". Fast, free, web-only, no
      install — uses no anomalous data.
    consequences: >-
      A geometry-based check can be fooled when two elements have
      similar coordination geometry (Ca²⁺ vs Mg²⁺ at moderate
      resolution; Na⁺ vs K⁺). Strongest when the geometry is clearly
      wrong for the modelled element.
    mitigation: >-
      Treat as one of several lines of evidence. Downgrade verdict to
      "consistent with X — alternatives possible at this resolution"
      when CheckMyMetal returns ambiguous, especially when no
      anomalous data exist.
    status: unchecked
    tool_ref: CheckMyMetal
    notes: >-
      Web service: <https://checkmymetal.research.uchicago.edu/>.
      Submission is a coordinates+MTZ file pair; result is HTML/JSON.
      Useful when 1sar.mtz-style datasets (no anomalous columns)
      leave element identity otherwise uncheckable.

  # ---------- CCP4 edstats -------------------------------------------

  - id: ASSUM_edstats_needs_2fofc_dfofc_in_mtz
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: edstats requires both 2mFo-DFc AND mFo-DFc in the input MTZ
    description: >-
      `edstats` reads weighted map coefficients (FWT/PHWT for
      2mFo-DFc, DELFWT/PHDELWT for mFo-DFc) from the input MTZ.
      Refining with REFMAC NCYC=0 produces both columns; `phenix.refine`
      with `output.map_coefficients` does the same.
    consequences: >-
      Running edstats on a plain F-obs MTZ will fail with cryptic
      "ERROR(S) in input" without naming the missing column.
    mitigation: >-
      Pre-stage by running REFMAC NCYC=0 on the model+data first;
      use that output MTZ as edstats input. Already in the pipeline
      for 1SAR.
    status: unchecked
    tool_ref: edstats
    notes: >-
      The 1SAR refmac NCYC=0 run wrote refmac_out.mtz with FWT/PHWT/
      DELFWT/PHDELWT — the right input shape. Specific keyword-input
      syntax is the remaining wiring task.

  # ---------- gemmi blobs --------------------------------------------

  - id: ASSUM_gemmi_blobs_diff_flag_quirks
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: implicit
    scope: tool
    title: gemmi blobs --diff flag handling quirks in 0.7.5
    description: >-
      `gemmi blobs --diff -f DELFWT -p PHDELWT MTZ PDB` emits the help
      text instead of running, on macOS arm64 build 0.7.5.
      `gemmi blobs --sigma=N MTZ PDB` (without --diff) runs the
      2mFo-DFc analysis fine.
    consequences: >-
      Cannot directly use gemmi blobs as a non-cctbx confirmation of
      `phenix.find_peaks_holes` until the flag handling is sorted.
    mitigation: >-
      Workaround — emit a CCP4 .map file from REFMAC's output MTZ
      (`gemmi map2sf` or REFMAC fft), then run `gemmi blobs MAP_FILE
      PDB` which uses the map directly without flag confusion.
    status: unchecked
    tool_ref: gemmi blobs

  # ---------- OpenStructure (OST) ---------------------------------------

  - id: ASSUM_ost_lddt_inclusion_radius
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: lDDT inclusion radius (default 15 Å)
    description: >-
      OST's `lddt` CLI defaults to a 15 Å distance inclusion radius.
      Reducing the radius rewards local fidelity; increasing it
      rewards extended geometry. Two lDDT scores produced with
      different radii are not directly comparable.
    consequences: >-
      A 0.97 lDDT at 15 Å is not the same as a 0.97 lDDT at 10 Å.
      Cross-tool comparisons must use the same radius.
    mitigation: >-
      Always quote the radius in PairwiseComparison.notes when reporting
      lDDT. Default 15 Å for the project; document any deviation.
    status: mitigated
    tool_ref: OpenStructure
    evidence_refs:
      - Mariani2013

  - id: ASSUM_ost_lddt_thresholds
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: lDDT cutoff thresholds (0.5, 1, 2, 4 Å)
    description: >-
      lDDT counts a distance as "preserved" if it falls within any of
      four cutoffs (0.5 / 1 / 2 / 4 Å). The score is the unweighted
      mean of the four pass-fractions.
    consequences: >-
      A model can score 0.97 at 4 Å tolerance but <0.5 at the strict
      0.5 Å cutoff. The headline lDDT averages over all four; sites
      with sub-Å precision needs need the per-cutoff breakdown.
    mitigation: >-
      OST emits per-cutoff fractions if requested; surface them when
      the structure claims sub-Å accuracy.
    status: unchecked
    tool_ref: OpenStructure
    evidence_refs:
      - Mariani2013

  - id: ASSUM_ost_lddt_cα_only_mode
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: -c flag computes Cα-only lDDT
    description: >-
      Running `lddt -c` restricts the calculation to Cα atoms (faster,
      backbone-only). Without -c the full all-atom lDDT is computed.
      The -c variant is what AlphaFold's pLDDT predicts.
    consequences: >-
      lDDT-Cα is more permissive than all-atom lDDT (it ignores
      side-chain placement quality entirely).
    mitigation: >-
      State which mode was used. For the project: -c is acceptable
      when the structure is at moderate resolution (≥ 2.5 Å) where
      side-chain placement is itself uncertain.
    status: mitigated
    tool_ref: OpenStructure
    evidence_refs:
      - EVAL_1sar_cdba2c07_2026-04-24

  - id: ASSUM_ost_no_built_in_rama_contour
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: implicit
    scope: tool
    title: No built-in Top8000 Ramachandran contour
    description: >-
      OST exposes φ/ψ extraction via residue.GetPhiTorsion() /
      GetPsiTorsion() but does not ship Top8000 contour data for
      Ramachandran outlier classification. Outlier classification via
      OST requires either external contour data files or a custom
      coarse classifier (which mis-fires on the boundary).
    consequences: >-
      OST is not a drop-in replacement for MolProbity's Rama outlier
      analysis. It IS a drop-in replacement for lDDT, structural
      comparison, and Cα displacement analysis.
    mitigation: >-
      Do not use OST for headline Rama outlier % numbers. Use it as a
      φ/ψ extractor where needed; defer outlier classification to
      MolProbity or a future OST plugin that ships contour data.
    status: known_violation
    tool_ref: OpenStructure

  # ---------- wwPDB validation report --------------------------------

  - id: ASSUM_wwpdb_percentile_source
    as_of_date: '2026-04-30'
    effective_at: '2026-04-30T00:00:00+00:00'
    kind: explicit
    scope: tool
    title: Percentile rank — whole archive vs resolution-binned
    description: >-
      The wwPDB validation report computes percentile ranks both
      against the entire archive AND against a resolution-binned
      subset. They are different numbers.
    consequences: >-
      A clashscore of 8 might be 70th percentile vs all PDB but 30th
      percentile at 1.5 Å — same model, different interpretation.
    mitigation: Surface both percentile numbers when both are reported.
    status: mitigated
    tool_ref: phenix.find_peaks_holes  # placeholder — applies broadly
