  # ----- CCP4 / REFMAC5 / ProSMART (closes cctbx-only gap on
  # ----- MolProbity composite and adds T03 refinement second-opinion).
  # ----- ProSMART's non-cctbx contribution is a Ramachandran-Z score, so it is
  # ----- recommended for T05_rama_z_score (below), NOT for the discrete
  # ----- Ramachandran/rotamer outlier percentages (which it does not classify —
  # ----- MolProbity is the oracle for those).

  - id: REC_T05_bond_length_rmsz_top_performing
    metric_definition_ref: T05_bond-length_rmsz
    tool_ref: REFMAC5
    role: top_performing
    rank: 1
    justification: >-
      REFMAC5 reports geometry RMSZ in its log against the CCP4
      restraint library — fully independent code base from PHENIX's
      restraint dictionary. The two should agree within ~0.2 σ on
      a well-refined model; > 0.5 σ disagreement indicates the
      restraint libraries differ on which atoms are involved.
    as_of_date: '2026-04-30'

  - id: REC_T05_bond_angle_rmsz_top_performing
    metric_definition_ref: T05_bond-angle_rmsz
    tool_ref: REFMAC5
