# catalog-state: tasks=T01–T17; count=17; drivers=17
id: https://w3id.org/protstruct-review/schema
name: protstruct_review
title: Protein Structure Review — oracles, measurements, evaluations, quality data sheets
description: >-
  LinkML schema for the protstruct_review harness. Models the cross-tool oracle
  trust framework used to evaluate agentically refined or generated protein
  structures: a static catalog of routine structural-biology tasks (T01..T17),
  the tools that perform them, the metrics those tools report, the per-artifact
  evaluation runs that record each tool's reading, and the per-structure
  Quality Data Sheet that snapshots the cross-tool findings as a citable record.
license: CC-BY-4.0
prefixes:
  protstruct: https://w3id.org/protstruct-review/schema/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: protstruct
default_range: string

imports:
  - linkml:types

# ----------------------------------------------------------------------------
# Enums
# ----------------------------------------------------------------------------
enums:

  CatalogTaskId:
    description: Stable identifier for a row in the task catalog.
    permissible_values:
      T01: { description: Structure superposition + RMSD }
      T02: { description: Per-residue structural comparison }
      T03: { description: Reciprocal-space refinement (X-ray) }
      T04: { description: Real-space refinement (map-based) }
      T05: { description: Geometry validation }
      T06: { description: Model-vs-data statistics }
      T07: { description: Predicted-model processing }
      T08: { description: Docking predicted/homology model into a map }
      T09: { description: Molecular replacement }
      T10: { description: Ligand fitting }
      T11: { description: Loop / missing-region fitting }
      T12: { description: Map quality assessment (cryo-EM) }
      T13: { description: X-ray data quality assessment }
      T14: { description: Hydrogen placement / protonation }
      T15: { description: Structural/domain classification }
      T16: { description: Interface and assembly quality }
      T17: { description: NMR ensemble/restraint validation }

  ToolFamily:
    description: >-
      Source code lineage of a tool. The trust model treats `non_cctbx` as
      genuinely independent from PHENIX; `cctbx` includes any tool that
      shares the cctbx/iotbx/mmtbx libraries (PHENIX, mmtbx.* CLI tools).
    permissible_values:
      cctbx:
      non_cctbx:

  Stage:
    description: Which stage of an artifact a measurement applies to.
    permissible_values:
      start: { description: Pre-refinement / starting model }
      intermediate: { description: Mid-refinement (round_N) }
      final: { description: Post-refinement / converged model }
      all:
        description: Applies to the whole dataset (e.g. completeness across all reflections).

  PassStatus:
    description: >-
      Interpretation/status of a measurement: a criterion-bearing outcome,
      criterion inapplicability, or an informational observation.
    permissible_values:
      pass: { description: Meets the criterion }
      fail_criterion: { description: Fails a declared criterion without asserting disagreement with an agent claim }
      fail_by_oracle: { description: Independent oracle disagrees with agent claim and criterion fails }
      pass_with_caveat: { description: Criterion passes but a related claim is wrong }
      pass_criterion_fail_headline: { description: Criterion passes but headline number is inaccurate }
      fail_by_oracle_within_cctbx: { description: Two cctbx tools disagree with agent claim — needs a non-cctbx confirmation to harden }
      informational: { description: Reported without a declared criterion }
      criterion_inapplicable:
        description: >-
          A declared criterion cannot grade this row because at least one of its
          evidence-backed required preconditions is void or unknown.

  CriterionPreconditionStatus:
    description: >-
      Whether a load-bearing precondition for applying a pass criterion was
      demonstrated on this measurement.
    permissible_values:
      satisfied:
        description: The precondition was checked and holds for this row.
      void:
        description: The precondition fails, so the criterion cannot grade this row.
      unknown:
        description: Available evidence cannot establish the precondition.

  RefinementMethod:
    description: Experimental / computational method category for a structure.
    permissible_values:
      xray:
      cryo_em:
      predicted_model:
      nmr:

  QdsCoverageScope:
    description: Whether a QDS is a cumulative sheet or an explicitly bounded partial update.
    permissible_values:
      cumulative:
        description: Combines all evaluation runs named in derived_from_evaluation_run_refs.
      partial:
        description: Covers only the tasks or measurements declared in scope_notes.

  StructureIdKind:
    description: Which database scheme the structure id follows.
    permissible_values:
      pdb:
      emdb:
      alphafold:

  RecommendationRole:
    description: >-
      Role a tool fills for a given metric. `top_considered` reflects
      community / literature consensus on the best canonical tool;
      `top_performing` reflects empirical results within this harness
      (often the same tool, sometimes not). `alternative` is an
      acceptable second-line oracle; `deprecated` is kept only for
      historical reference.
    permissible_values:
      top_considered:
      top_performing:
      alternative:
      deprecated:

  PlddtDistributionShape:
    description: >-
      Coarse classification of the per-residue pLDDT distribution shape.
      Mean pLDDT alone is insufficient — distribution tells you whether
      a model is uniformly confident or hides disordered regions.
    permissible_values:
      bimodal_sharp:
        description: Confident core + disordered tails.
      broad:
        description: Uncertain throughout (broad spread centred on mid-range).
      narrow_high:
        description: Uniformly confident.
      narrow_low:
        description: Uniformly uncertain (suspicious).

  ReferenceKind:
    description: What kind of reference the candidate is being compared against.
    permissible_values:
      deposited:
        description: A PDB/EMDB deposited entry treated as the gold standard.
      alphafold:
        description: An AlphaFold/RoseTTAFold prediction used as reference.
      starting_model:
        description: The model the agent was given to refine.
      ground_truth:
        description: A benchmark "truth" (e.g., ultra-high-res reference).
      consensus:
        description: A multi-tool consensus or PDB-REDO style re-refinement.

  DeltaBaseline:
    description: Which baseline a Δ-metric is measured against.
    permissible_values:
      starting_model:
        description: Δ measured against the input / starting model.
      reference_truth:
        description: Δ measured against an independent gold standard.
      same_data_reference:
        description: Δ measured against another model refined against the same data.

  ResidueOutlierKind:
    description: >-
      The validation category that flagged a residue. A single residue
      can have multiple outlier rows (one per kind).
    permissible_values:
      ramachandran:
        description: Backbone φ,ψ outside the 99.95th percentile region (MolProbity Top8000).
      rotamer:
        description: Side-chain χ angles outside the 98th percentile favored region.
      c_beta:
        description: Cβ deviation > 0.25 Å from ideal.
      clash:
        description: Steric overlap ≥ 0.4 Å with another atom.
      cablam:
        description: CaBLAM secondary-structure / backbone validation outlier.
      cis_omega:
        description: Non-Pro cis-peptide bond.
      bad_geometry:
        description: Bond / angle / planarity outlier > 4σ.
      density_misfit:
        description: High RSRZ / poor real-space density agreement.

  FlaggedRegionKind:
    description: Why a contiguous stretch of residues was flagged.
    permissible_values:
      disordered:
      poor_density:
      clash_dense:
      loop_misfit:
      interface:
      missing:
        description: Residues unmodelled in the deposited structure.

  Severity:
    description: >-
      Coarse severity bucket used by ResidueOutlier and FlaggedRegion.
      Detailed numeric values live on the associated MeasurementValue.
    permissible_values:
      low:
      moderate:
      severe:

  AssumptionKind:
    description: >-
      Whether an assumption is documented in the tool's docs / source
      (explicit) or arises from a default behaviour, threshold, or
      reference dataset that is not loudly advertised (implicit).
    permissible_values:
      explicit:
      implicit:

  AssumptionScope:
    description: >-
      Where the assumption operates: at the tool level (it shapes every
      number the tool produces); at a single measurement (it shaped this
      specific value); at the report level (the agent's narrative
      framing); at aggregation (combining many measurements into one
      verdict); at interpretation (deriving structural meaning from a
      number).
    permissible_values:
      tool:
      measurement:
      report:
      aggregation:
      interpretation:

  AssumptionStatus:
    description: >-
      Whether the assumption has been actively checked. `verified` =
      cross-tool confirmation showed the assumption holds for this case.
      `mitigated` = a workaround or independent check is in place.
      `unchecked` = the assumption is documented but no verification
      has been run. `known_violation` = the assumption is documented
      to be wrong for this case (and the affected number should not be
      taken at face value).
    permissible_values:
      verified:
      mitigated:
      unchecked:
      known_violation:

  ContactKind:
    description: >-
      Kind of atom-atom contact recorded by a CoordinationContact row.
    permissible_values:
      inner_sphere:
        description: Direct (first-shell) coordination contact for a metal ion.
      outer_sphere:
        description: Second-shell contact (water-bridged or longer).
      hydrogen_bond:
      hydrophobic:
      pi_stack:
      salt_bridge:
      van_der_waals:

  SiteKind:
    description: Type of functional / structural site of interest.
    permissible_values:
      active_site:
      binding_site:
      interface:
        description: Protein-protein or protein-nucleic acid interface.
      catalytic_residue_set:
      metal_coordination:
      allosteric_site:

  MeasurementScope:
    description: >-
      The granularity at which a metric is measured. Used both on
      MetricDefinition (the canonical scope of a metric) and on
      MeasurementValue (the actual scope of a specific measurement —
      can override the canonical scope when the same metric is
      reported at a different level, e.g. clashscore restricted to a
      site's residues is `site`-scoped).

      For `residue` and `atom` scope, store every value in the
      per-residue/per-atom slot and surface the summary statistics
      (mean, std_dev, min, max, count) on the corresponding scalar
      slot. The summary fields on TypedMeasurementValue exist for
      this purpose.
    permissible_values:
      complex:
        description: Whole asymmetric unit / biological assembly.
      chain:
        description: One polypeptide / nucleic-acid chain.
      domain:
        description: A named structural domain.
      site:
        description: A named functional site (active site, interface, ...).
      residue:
      atom:
      dataset:
        description: Diffraction data / cryo-EM map (not the model).
      ligand:
      interface:
        description: A named chain-chain or molecule-molecule interface.
      ensemble:
        description: An NMR or prediction ensemble.
      assembly:
        description: Biological assembly or multimeric complex.
      cohort:
        description: >-
          A preregistered collection of structures aggregated into one
          measurement. Use scope_selector to name the exact cohort; do not use
          this scope for a result computed on one structure.

# ----------------------------------------------------------------------------
# Slots — defined once, reused across classes
# ----------------------------------------------------------------------------
slots:

  id:
    identifier: true
    range: string

  description:
    range: string

  notes:
    description: Free-text annotation (deltas, reconciliation comments, caveats).
    range: string

  # MeasurementResult mixin slots — the typed measurement value
  value_numeric:
    description: Numeric value. Exactly one of {value_numeric, value_text, is_not_applicable=true} must be set.
    range: float
  value_text:
    description: >-
      Non-numeric textual value (e.g. ranges like "49.97 → 2.50",
      counts with annotation like "1 (Asn A 39)", percentages, or any
      cell that is not a clean number).
    range: string
  unit:
    description: Unit string (Å, °, %, σ, count). Optional.
    range: string
  is_not_applicable:
    description: True when the cell is "n/a" or otherwise has no measurement.
    range: boolean

# ----------------------------------------------------------------------------
# Classes
# ----------------------------------------------------------------------------
classes:

  Container:
    description: >-
      Tree root. A single YAML document can carry any subset of the catalog
      and per-run records. Nothing is required at this level — pass the
      sub-collections you have.
    tree_root: true
    attributes:
      catalog_tasks:
        range: CatalogTask
        multivalued: true
        inlined_as_list: true
      tools:
        range: Tool
        multivalued: true
        inlined_as_list: true
      metric_definitions:
        range: MetricDefinition
        multivalued: true
        inlined_as_list: true
      structures:
        range: Structure
        multivalued: true
        inlined_as_list: true
      experimental_data:
        range: ExperimentalData
        multivalued: true
        inlined_as_list: true
      agent_artifacts:
        range: AgentArtifact
        multivalued: true
        inlined_as_list: true
      evaluation_runs:
        range: EvaluationRun
        multivalued: true
        inlined_as_list: true
      quality_data_sheets:
        range: QualityDataSheet
        multivalued: true
        inlined_as_list: true
      qds_replay_pins:
        range: QdsReplayPin
        multivalued: true
        inlined_as_list: true
        description: >-
          Source-owned content pins for immutable QDS artifacts. Validation
          replays a retained emitter contract against source-owned snapshots and
          compares the result with a stable canonical byte projection, without
          reading the current emitter, catalog, or registries.
      qds_emission_contexts:
        range: QdsEmissionContext
        multivalued: true
        inlined_as_list: true
        description: >-
          Source-owned recipes for contract-3 partial-QDS identity, scope, and
          headline prose. These records prevent stale run-level summaries from
          being concatenated into a current partial sheet and are content-pinned
          alongside the replay boundary.
      tool_recommendations:
        range: ToolRecommendation
        multivalued: true
        inlined_as_list: true
      pairwise_comparisons:
        range: PairwiseComparison
        multivalued: true
        inlined_as_list: true
      residues:
        range: ResidueRef
        multivalued: true
        inlined_as_list: true
      secondary_structure_assignments:
        range: SecondaryStructureAssignment
        multivalued: true
        inlined_as_list: true
      domain_assignments:
        range: DomainAssignment
        multivalued: true
        inlined_as_list: true
      sites:
        range: Site
        multivalued: true
        inlined_as_list: true
      interface_qualities:
        range: InterfaceQuality
        multivalued: true
        inlined_as_list: true
      nmr_ensemble_qualities:
        range: NmrEnsembleQuality
        multivalued: true
        inlined_as_list: true
      prediction_ensemble_qualities:
        range: PredictionEnsembleQuality
        multivalued: true
        inlined_as_list: true
      ligands:
        range: Ligand
        multivalued: true
        inlined_as_list: true
      assumptions:
        range: Assumption
        multivalued: true
        inlined_as_list: true
        description: >-
          Container-level Assumption catalog. Used as a lookup target
          when a Tool's assumptions[] block needs to reference a
          shared assumption rather than inline it.

  # ------------------------------------------------------------------ mixins

  Finding:
    mixin: true
    description: >-
      Shared shape between per-row measurements and headline collapses —
      both ultimately tie a (catalog_task, metric, oracle_tool) tuple to a
      number plus optional notes.
    attributes:
      metric_definition_ref:
        range: MetricDefinition
        required: true
      oracle_tool_ref:
        range: Tool
        required: true
      oracle_family:
        range: ToolFamily
        required: true
      notes:

  SourceRowLineage:
    mixin: true
    description: Exact EvaluationRun row copied into a nonlegacy QDS.
    attributes:
      source_evaluation_run_ref:
        range: EvaluationRun
        description: EvaluationRun that owns source_row_ref.
      source_row_ref:
        range: string
        description: Id of the structured source row copied into the QDS.

  # -------------------------------------------------------------- catalog

  CatalogTask:
    description: One row in the T01..T17 task catalog.
    attributes:
      id:
        identifier: true
        range: CatalogTaskId
        required: true
      task_name:
        required: true
      phenix_tool_refs:
        description: PHENIX tools that primarily implement this task.
        range: Tool
        multivalued: true
      phenix_doc_paths:
        description: Upstream PHENIX documentation routes, resolvable online or in the optional ignored local cache created by ref/download_phenix_docs.sh.
        range: string
        multivalued: true
      oracle_tool_refs:
        description: Independent (typically non-cctbx) oracles the harness uses to grade this task.
        range: Tool
        multivalued: true
      metric_definition_refs:
        description: Metrics this task is expected to produce.
        range: MetricDefinition
        multivalued: true
      inputs_description:
        description: Human prose describing typical inputs (file types, optional flags).
      gold_standard:
        description: Source of truth (deposition, paper, cross-tool consensus).
      example_dataset:
        description: A concrete dataset id (PDB/EMDB/MTZ) so a run is reproducible.

  Tool:
    description: A program executable — PHENIX entry point or external oracle.
    attributes:
      id:
        identifier: true
        required: true
        description: Canonical tool name (e.g. phenix.superpose_models, TMalign, gemmi, probe, reduce, servalcat).
      version:
      install_path:
      family:
        range: ToolFamily
        required: true
      catalog_tasks_served:
        range: CatalogTaskId
        multivalued: true
      assumptions:
        range: Assumption
        multivalued: true
        inlined_as_list: true
        description: >-
          Implicit and explicit assumptions baked into this tool's
          default behaviour: reference distribution, scaling model,
          hyper-parameter defaults, etc. Surfaced into the QDS via
          measurement.oracle_tool_ref → tool.assumptions.

  MetricDefinition:
    description: A named numeric deliverable that one or more tools can produce.
    attributes:
      id:
        identifier: true
        required: true
      name:
        required: true
      unit:
      description:
      applicable_task_refs:
        range: CatalogTaskId
        multivalued: true
      scope:
        range: MeasurementScope
        description: >-
          Canonical granularity for this metric. `complex` for
          whole-structure metrics like global R-free; `residue` for
          per-residue lDDT or RSRZ; `dataset` for crystallographic
          completeness and CC½; `chain` for per-chain lDDT means;
          `site` for site-restricted metrics; `ligand` for ligand
          quality. A specific MeasurementValue may override this.

  # ------------------------------------------------------------- structures

  Structure:
    description: A protein structure target (model only — see ExperimentalData for the data side).
    attributes:
      id:
        identifier: true
        required: true
        description: PDB id (e.g. 1sar), EMDB id (EMDB-11668), or AlphaFold accession (af-p00698-f1).
      id_kind:
        range: StructureIdKind
      method:
        range: RefinementMethod
      resolution_a:
        range: float
        description: Best resolution in Ångström, where applicable.
      space_group:
      description:

  ExperimentalData:
    description: Reflection data, half-maps, or similar — the data side of an experiment.
    attributes:
      id:
        identifier: true
        required: true
      kind:
        range: string
        description: One of mtz, half_maps, map.
      attached_to_structure_ref:
        range: Structure
      file_paths:
        range: string
        multivalued: true

  AgentArtifact:
    description: A bundle of files an agent produced for one structure.
    attributes:
      id:
        identifier: true
        required: true
        description: Full UUID of the agent run, or any other stable id.
      short_id:
        description: First 8 hex chars of the UUID (matches eval-naming convention).
      structure_ref:
        range: Structure
      agent_provider:
        description: e.g. coscientists.
      agent_system:
        description: e.g. openscientist.
      output_files:
        range: string
        multivalued: true

  Refinement:
    description: >-
      One round of model improvement. Carries the per-round metrics
      (R-work/R-free/gap/clashscore/Rama outliers/waters/mean B) that
      a multi-round refinement campaign produces. The QDS does not
      surface every round directly; it surfaces the trajectory and
      the final-round numbers via the geometry / refinement summaries.
    attributes:
      id:
        identifier: true
        required: true
      round_number:
        range: integer
        required: true
      stage_label:
        description: >-
          Optional human label for this round ("start", "round_2",
          "round_3_clean", "final") — useful when round_number is not
          contiguous.
      model_file:
      mtz_file:
      evaluation_run_ref:
        range: EvaluationRun
      r_work:
        range: TypedMeasurementValue
        inlined: true
      r_free:
        range: TypedMeasurementValue
        inlined: true
      r_free_gap:
        range: TypedMeasurementValue
        inlined: true
      clashscore:
        range: TypedMeasurementValue
        inlined: true
      ramachandran_outliers_pct:
        range: TypedMeasurementValue
        inlined: true
      ramachandran_favored_pct:
        range: TypedMeasurementValue
        inlined: true
      rotamer_outliers_pct:
        range: TypedMeasurementValue
        inlined: true
      molprobity_score:
        range: TypedMeasurementValue
        inlined: true
      waters_count:
        range: TypedMeasurementValue
        inlined: true
      mean_b_factor:
        range: TypedMeasurementValue
        inlined: true
      total_atoms:
        range: TypedMeasurementValue
        inlined: true
      key_change:
        description: One-line summary of what changed in this round (e.g. "+ Ca²⁺", "NQH flips").

  MeasurementProvenance:
    description: Audit trail for a measurement (optional at v0).
    attributes:
      id:
        identifier: true
        required: true
      command:
        description: Exact CLI invocation (excluding interactive arguments).
      tool_version:
      input_sha256:
        range: string
        multivalued: true
        description: SHA-256 of each input file, in invocation order.
      run_at:
        range: datetime

  CriterionPreconditionCheck:
    description: >-
      One evidence-backed check of a threshold-registry precondition. Binding
      definitions name required ids. A verdict row must satisfy each one;
      criterion_inapplicable instead retains all checks and marks at least one
      required check void or unknown.
    attributes:
      id:
        identifier: true
        required: true
      status:
        range: CriterionPreconditionStatus
        required: true
      evidence_refs:
        range: string
        multivalued: true
        required: true
      notes:

  # ----------------------------------------------------------- measurements

  MeasurementValue:
    description: One oracle's reading of one metric at one stage on one artifact.
    mixins:
      - Finding
    attributes:
      id:
        identifier: true
        required: true
      catalog_task_ref:
        range: CatalogTaskId
        required: true
      stage:
        range: Stage
        required: true
      scope:
        range: MeasurementScope
        description: >-
          Granularity of this specific measurement. Optional override
          of the canonical `scope` on the referenced MetricDefinition.
          When set, the `agent_claim` / `oracle_measure` may be a
          summary (mean+SD over a residue/chain/site array) — see
          TypedMeasurementValue.mean / std_dev / count. `cohort` means
          that the value aggregates an explicitly named preregistered
          collection of structures rather than measuring one structure.
      scope_selector:
        description: >-
          When `scope` is `chain`, `site`, `residue`, `atom`, or
          `ligand`, this is a free-text selector identifying what was
          measured (e.g. "chain A residues 30-45", "active site 1",
          "Asn A 39"). Site / residue selectors should also have a
          structured ResidueRef / Site reference where appropriate. For `site`
          and `ligand` scope this value is the exact declared Site or Ligand id;
          put comparison qualifiers and human-readable detail in `notes`. For
          `cohort` scope it is required and names the exact preregistered cohort.
      subject_ref:
        range: string
        description: >-
          Stable identifier for the concrete model, dataset, assembly, or cohort
          measured.
          This is distinct from scope_selector: the subject identifies the artefact,
          while the selector identifies a chain, interface mapping, site, or other
          subset within it. QDS emission uses an exact subject match ahead of legacy
          rows where this field is absent and excludes explicit non-matches.
      reference_subject_ref:
        range: string
        description: >-
          Stable identifier for the native/reference artefact used by a comparative
          measurement. Required by the T16 wrapper whenever DockQ is reported.
      metric_definition_ref:
      oracle_tool_ref:
      oracle_family:
        range: ToolFamily
      agent_claim:
        range: TypedMeasurementValue
        description: Value reported by the agent.
      oracle_measure:
        range: TypedMeasurementValue
        description: Value the independent oracle returned.
      delta:
        range: TypedMeasurementValue
        description: >-
          Optional pre-computed difference. Unless delta_from_measurement_ref is
          present, this is oracle − agent or post − pre. When
          delta_from_measurement_ref is present, this is this row's oracle_measure
          minus the referenced MeasurementValue's oracle_measure.
      delta_from_measurement_ref:
        range: MeasurementValue
        description: >-
          Same-EvaluationRun comparison row used for an oracle-versus-oracle
          delta. The two rows must share task, metric, stage, subject, reference
          subject, scope, and selector; delta equals this row's oracle_measure
          minus the referenced row's oracle_measure.
      derived_from_measurement_refs:
        range: MeasurementValue
        multivalued: true
        description: >-
          Same-EvaluationRun source measurements used to compute a composite
          measurement in the same subject, reference-subject, stage, scope, and
          selector context. These typed lineage refs identify every contributing
          row; they do not replace retained raw evidence.
      pass_criterion:
        description: >-
          Complete normalized display snapshot of the authoritative table cell
          selected by pass_criterion_ref. Numeric threshold authority remains in
          ref/thresholds_and_standards.md. Retain this snapshot both for a verdict
          and when criterion_inapplicable documents why the declared rule could
          not grade the row.
      pass_criterion_ref:
        range: string
        description: >-
          PassCriterionBinding id in ref/structural_criteria.yaml. For a verdict
          row the binding's metric and structured applicability must match the
          measurement. The binding points to the canonical threshold registry;
          it does not duplicate threshold values into the catalog.
      criterion_preconditions:
        range: CriterionPreconditionCheck
        multivalued: true
        inlined_as_list: true
        description: >-
          Structured applicability checks required by pass_criterion_ref. A
          verdict is valid only when every precondition required by the binding
          is present exactly once, marked satisfied, and backed by non-circular
          retained evidence. criterion_inapplicable instead requires at least one
          required check to be evidence-backed void or unknown.
      pass_status:
        range: PassStatus
      notes:
      provenance_ref:
        range: MeasurementProvenance
      bundle_ref:
        range: string
        description: >-
          Stable invocation/bundle id shared by coupled measurements that must
          be selected and interpreted together.
      evidence_refs:
        range: string
        multivalued: true
        description: >-
          Retained raw outputs or EvaluationRun ids supporting this measurement.
      assumptions:
        range: Assumption
        multivalued: true
        inlined_as_list: true
        description: >-
          Assumptions specific to this measurement (parameter choices
          that differ from tool defaults, interpretive flags, etc.).
          Tool-level assumptions are NOT duplicated here; the QDS
          report aggregates both via the oracle_tool_ref join.

  TypedMeasurementValue:
    description: >-
      A typed carrier for one measurement value. Exactly one of
      {value_numeric, value_text, is_not_applicable=true} should be set —
      enforced semantically by the loader, not by a LinkML rule (LinkML
      `rules:` for cross-slot constraints are not honoured by all
      validators in 1.9; see scripts/tsv_to_records.py for the canonical
      cell parser that always produces a valid combination). On source
      MeasurementValue.agent_claim/oracle_measure/delta, QDS lineage and verdict
      attributes from this reusable class are forbidden; those remain on the
      parent source row.
    attributes:
      value_numeric:
        range: float
        description: Numeric value when the cell is a clean number.
      value_text:
        range: string
        description: >-
          Non-numeric textual value (ranges like "49.97 → 2.50",
          counts with annotation like "1 (Asn A 39)", percentages,
          or any cell that is not a clean number).
      unit:
        range: string
        description: Unit string (Å, °, %, σ, count). Optional.
      is_not_applicable:
        range: boolean
        description: True when the source cell is "n/a" or otherwise has no measurement.
      percentile:
        range: float
        description: >-
          Optional rank against a reference distribution (e.g., wwPDB
          archive percentile for clashscore at this resolution; CASP
          ranking for TM-score). Range 0-100. Cite the source dataset
          in `notes` on the parent measurement.
      mean:
        range: float
        description: >-
          Mean across an array of values. Populated when the
          measurement summarises a per-residue / per-atom / per-chain
          distribution. The full array of underlying values lives in
          a sibling list slot (e.g. PerResidueQuality.lddt_per_residue).
      std_dev:
        range: float
        description: Standard deviation paired with `mean`.
      min_value:
        range: float
        description: Minimum across the array (paired with `mean`).
      max_value:
        range: float
        description: Maximum across the array (paired with `mean`).
      count:
        range: integer
        description: >-
          Number of observations underlying this value (for example, the eligible
          denominator for a count or rate, or the values summarised by
          `mean`/`std_dev`). Required when `mean` is set.
      source_measurement_ref:
        range: string
        description: MeasurementValue id from which this QDS scalar was selected.
      source_evaluation_run_ref:
        range: string
        description: EvaluationRun id containing source_measurement_ref.
      metric_definition_ref:
        range: MetricDefinition
        description: Canonical metric carried through when a QDS wraps a measurement.
      oracle_tool_ref:
        range: Tool
        description: Tool that produced the selected QDS scalar.
      oracle_family:
        range: ToolFamily
        description: Independent-family classification of oracle_tool_ref.
      pass_status:
        range: PassStatus
        description: Interpretation assigned by the source measurement.
      pass_criterion:
        description: >-
          Display snapshot of the source criterion, when any. Resolve
          source_measurement_ref to obtain its PassCriterionBinding and
          the source row's full verdict context.
      subject_ref:
        range: string
        description: Concrete measured subject carried through from the source row.
      reference_subject_ref:
        range: string
        description: Native/reference subject carried through from the source row.
      stage:
        range: Stage
        description: Measurement stage carried through from the source row.
      scope:
        range: MeasurementScope
        description: Measurement scope carried through from the source row.
      scope_selector:
        description: Subset or comparison selector carried through from the source row.
      evidence_refs:
        range: string
        multivalued: true
        description: Retained raw outputs or EvaluationRun ids carried from the source row.
      bundle_ref:
        range: string
        description: Coupled source-measurement bundle id carried through verbatim.
      notes:
        description: Source caveats and interpretation carried through verbatim.

  HeadlineFinding:
    description: >-
      A collapsed top-level finding for one EvaluationRun — typically one row
      per major metric, picking the strongest oracle (most independent) and
      pointing back at the supporting per-row MeasurementValues.
    mixins:
      - Finding
    attributes:
      id:
        identifier: true
        required: true
      catalog_task_refs:
        range: CatalogTaskId
        multivalued: true
        required: true
        description: One or more catalog tasks this finding spans (e.g. T03 + T06 for R-factor).
      metric_definition_ref:
      oracle_tool_ref:
      oracle_family:
        range: ToolFamily
      agent_claim:
        range: TypedMeasurementValue
      oracle_measure:
        range: TypedMeasurementValue
      verdict_label:
        description: >-
          Free-text label such as "confirms", "off_by_0.015", "fails_<_0.05_criterion".
          Not an enum at v0 — the label space is still settling.
      notes:
      supporting_measurement_refs:
        range: MeasurementValue
        multivalued: true

  # -------------------------------------------------------- evaluation run

  EvaluationRun:
    description: One full evaluation pass over one AgentArtifact.
    attributes:
      id:
        identifier: true
        required: true
        description: >-
          Unconstrained string. The eval_naming.md filename convention
          (EVAL_<structure>_<artifact-short-id>_<YYYY-MM-DD>) lives on
          eval_filename_stem, not here.
      eval_filename_stem:
        description: Filename stem matching ref/eval_naming.md.
      structure_ref:
        range: Structure
        required: true
      artifact_ref:
        range: AgentArtifact
      run_date:
        range: date
        required: true
      catalog_tasks_applied:
        range: CatalogTaskId
        multivalued: true
        required: true
      measurements:
        range: MeasurementValue
        multivalued: true
        inlined_as_list: true
      cross_tool_waivers:
        range: CrossToolWaiver
        multivalued: true
        inlined_as_list: true
        description: >-
          Claim-scoped exceptions to the no-cctbx-only invariant (#315),
          declared here so the admission travels with the evidence it excuses.
          A task-only legacy waiver is unambiguous only when exactly one claim
          for that task is gated.
      headline_findings:
        range: HeadlineFinding
        multivalued: true
        inlined_as_list: true
      residue_outliers:
        range: ResidueOutlier
        multivalued: true
        inlined_as_list: true
        description: >-
          Per-residue outlier rows for this eval. The QDS emitter
          aggregates these into PerResidueQuality.outliers[]. When
          this list is non-empty, the QDS MUST surface a
          PerResidueQuality block.
      density_peaks:
        range: DensityPeak
        multivalued: true
        inlined_as_list: true
      flagged_regions:
        range: FlaggedRegion
        multivalued: true
        inlined_as_list: true
      per_residue_values:
        range: PerResidueValue
        multivalued: true
        inlined_as_list: true
        description: >-
          Per-residue scalars (lDDT, displacement, RSRZ, ...). The
          metric_definition_ref attached to the underlying value
          determines which PerResidueQuality slot they feed.
      secondary_structure_assignments:
        range: SecondaryStructureAssignment
        multivalued: true
        inlined_as_list: true
        description: >-
          DSSP/STRIDE-style secondary-structure assignment rows. When
          an eval reports scope=domain/classification content, these
          rows make the assignment explicit instead of burying it in
          prose.
      domain_assignments:
        range: DomainAssignment
        multivalued: true
        inlined_as_list: true
        description: >-
          Domain and fold-classification rows from CATH/SCOPe/ECOD or
          equivalent tools. Domain-scoped measurements should point at
          one of these via scope_selector.
      sites:
        range: Site
        multivalued: true
        inlined_as_list: true
        description: >-
          Functional sites declared on this eval's structure. Site-
          scoped measurements (scope=site) reference these via
          scope_selector. When the eval has scope=site measurements
          but no Site declared here, the emitter fails-hard.
      ligands:
        range: Ligand
        multivalued: true
        inlined_as_list: true
        description: >-
          Ligands referenced by sites. Same fail-hard contract as
          sites: scope=ligand measurement implies a Ligand row.
      interface_qualities:
        range: InterfaceQuality
        multivalued: true
        inlined_as_list: true
        description: >-
          Interface/assembly rows. Interface-scoped measurements should
          identify one of these rows via scope_selector.
      nmr_ensemble_qualities:
        range: NmrEnsembleQuality
        multivalued: true
        inlined_as_list: true
        description: >-
          NMR ensemble/restraint validation rows. Ensemble-scoped NMR
          measurements should identify one of these rows via
          scope_selector.
      prediction_ensemble_qualities:
        range: PredictionEnsembleQuality
        multivalued: true
        inlined_as_list: true
        description: >-
          Prediction ensemble convergence rows for AlphaFold/ColabFold/
          RoseTTAFold-style replicate ensembles. Ensemble-scoped
          predicted-model measurements should identify one of these rows
          via scope_selector.
      pairwise_comparisons:
        range: PairwiseComparison
        multivalued: true
        inlined_as_list: true
        description: >-
          Pair comparisons against reference structures (deposited /
          starting / AlphaFold / truth). The QDS surfaces these
          unchanged via QualityDataSheet.pairwise_comparisons.
      refinements:
        range: Refinement
        multivalued: true
        inlined_as_list: true
        description: >-
          Per-round refinement trajectory. One Refinement record per
          round (start / round_1 / round_2 / ... / final). Carries the
          per-round R-factors, geometry, water count, mean B etc. so
          the agent's per-round table can be independently re-measured
          and stored in canonical form.
      criteria_met_count:
        range: integer
      criteria_total:
        range: integer
      assumptions:
        range: Assumption
        multivalued: true
        inlined_as_list: true
        description: >-
          Run-level assumptions — typically the agentic-framework's
          reporting / interpretation / aggregation conventions
          (e.g. "R-factors read from refine in-run log, not
          re-derived"). The QDS surfaces these alongside tool and
          measurement assumptions in assumptions_report[].
      superseded_assumption_refs:
        range: string
        multivalued: true
        description: >-
          Assumption ids from earlier input EvaluationRuns that this run explicitly
          withdraws. The QDS emitter omits those ids from a cumulative assumptions_report;
          the superseding run's own evidence and headline must explain why.
      headline_verdict:
        description: One-paragraph human summary of the eval outcome.

  # ---------------------------------------------------- quality data sheet

  QdsEmissionContext:
    description: >-
      Source-owned, QDS-specific presentation and scope recipe. It binds one
      immutable sheet to the exact ordered EvaluationRuns, structure, subject,
      issue time, coverage boundary, identity description, and headline used by
      emitter contract 3. It does not alter or supersede source measurements.
    attributes:
      id:
        identifier: true
        required: true
      qds_ref:
        range: QualityDataSheet
        required: true
      owner_evaluation_run_ref:
        range: EvaluationRun
        required: true
        description: >-
          The one EvaluationRun whose canonical source document owns this context.
      structure_ref:
        range: Structure
        required: true
      subject_ref:
        range: string
        required: true
      source_evaluation_run_refs:
        range: EvaluationRun
        multivalued: true
        required: true
      issued_at:
        range: datetime
        required: true
      coverage_scope:
        range: QdsCoverageScope
        required: true
      scope_notes:
        range: string
        required: true
      identity_description:
        range: string
        required: true
      headline_verdict:
        range: string
        required: true

  QdsReplayPin:
    description: >-
      Content-addressed replay boundary stored with the source EvaluationRun.
      The output hash is authoritative for canonical bytes. The remaining
      hashes bind the retained emitter implementation and source-owned Tool,
      recommendation, and assumption snapshots used for deterministic replay;
      live registries and the live catalog are deliberately excluded.
    attributes:
      id:
        identifier: true
        required: true
      qds_ref:
        range: QualityDataSheet
        required: true
      source_evaluation_run_refs:
        range: EvaluationRun
        multivalued: true
        required: true
      qds_emission_context_ref:
        range: QdsEmissionContext
        description: Required for partial emitter-contract-3 replay boundaries.
      emitter_contract_version:
        required: true
      canonical_qds_sha256:
        required: true
        pattern: '^[0-9a-f]{64}$'
      emitter_source_sha256:
        required: true
        pattern: '^[0-9a-f]{64}$'
      source_tools_sha256:
        required: true
        pattern: '^[0-9a-f]{64}$'
      source_tool_recommendations_sha256:
        required: true
        pattern: '^[0-9a-f]{64}$'
      source_tool_assumptions_sha256:
        required: true
        pattern: '^[0-9a-f]{64}$'
      source_qds_emission_context_sha256:
        description: >-
          Canonical digest of the source-owned QdsEmissionContext snapshot.
          Required for partial emitter-contract-3 replay boundaries.
        pattern: '^[0-9a-f]{64}$'

  QualityDataSheet:
    description: >-
      Per-structure citable snapshot of cross-tool findings. Generated from
      one or more EvaluationRun records by scripts/qds_emit.py and treated
      as immutable: when oracles change or new measurements arrive, emit a
      new QDS (different id / issued_at), don't mutate the old one.
    attributes:
      id:
        identifier: true
        required: true
        description: e.g. QDS_1sar_cdba2c07_2026-04-24
      structure_ref:
        range: Structure
        required: true
      subject_ref:
        range: string
        description: Concrete model or artefact summarized by the selected scalar values.
      derived_from_evaluation_run_refs:
        range: EvaluationRun
        multivalued: true
        required: true
      emission_context_ref:
        range: QdsEmissionContext
        description: Source-owned QDS recipe required by partial emitter contract 3.
      coverage_scope:
        range: QdsCoverageScope
        description: Cumulative sheet or explicitly bounded partial update.
      scope_notes:
        description: Human-readable boundary or carry-forward statement for coverage_scope.
      issued_at:
        range: datetime
        required: true
      emitter_contract_version:
        description: >-
          Versioned qds_emit selection/routing contract used to build this
          immutable sheet. Modern committed sheets must declare a supported
          version so later emitter changes cannot silently redefine replay.
      identity_block:
        range: IdentityBlock
        inlined: true
      geometry_summary:
        range: GeometrySummary
        inlined: true
      refinement_summary:
        range: RefinementSummary
        inlined: true
      map_summary:
        range: MapSummary
        inlined: true
      data_quality_summary:
        range: DataQualitySummary
        inlined: true
        description: X-ray data quality (completeness, ⟨I/σ⟩, CC½). Optional; omit for cryo-EM and predicted models.
      predicted_confidence_summary:
        range: PredictedConfidenceSummary
        inlined: true
        description: AlphaFold/RoseTTAFold confidence (pLDDT distribution, PAE). Optional; only for predicted models.
      packing_summary:
        range: PackingSummary
        inlined: true
        description: Optional packing and buried-H-bond diagnostics.
      classification_summary:
        range: ClassificationSummary
        inlined: true
        description: Optional secondary-structure/domain/fold classification snapshot.
      interface_quality_summary:
        range: InterfaceQualitySummary
        inlined: true
        description: Optional interface and assembly-quality snapshot.
      prediction_ensemble_summary:
        range: PredictionEnsembleSummary
        inlined: true
        description: Optional prediction ensemble convergence snapshot.
      nmr_validation_summary:
        range: NmrValidationSummary
        inlined: true
        description: Optional NMR restraint and ensemble validation snapshot.
      pairwise_comparisons:
        range: PairwiseComparison
        multivalued: true
        inlined_as_list: true
        description: One per relevant reference (deposited / starting / AlphaFold / truth). Empty when no reference comparison applies.
      per_residue_quality:
        range: PerResidueQuality
        inlined: true
        description: >-
          Residue-scoped local quality (per-residue lDDT/displacement,
          outlier residues, density-difference peaks, flagged regions).
          Required when the trust model needs evidence that local
          regions — especially active sites and interfaces — are not
          worse than the global average.
      site_qualities:
        range: SiteQuality
        multivalued: true
        inlined_as_list: true
        description: >-
          One per active site / binding site / interface / metal site
          on this structure. Each carries the site-scoped metrics
          (site RMSD to reference, mean per-residue lDDT, ligand
          quality if a ligand is bound). Empty when the structure has
          no functional site of record.
      cross_tool_waivers:
        range: CrossToolWaiver
        multivalued: true
        inlined_as_list: true
        description: >-
          Claim-scoped waivers inherited from the source evals (#315), surfaced
          so a QDS reader sees each admission next to the one coverage row it
          excuses.
      cross_tool_coverage:
        range: CrossToolCoverage
        inlined: true
      tool_recommendations_applied:
        range: ToolRecommendation
        multivalued: true
        inlined_as_list: true
        description: >-
          Snapshot of which recommendations were active at issue time.
          The QDS is immutable; recommendations evolve, so this captures
          the recommendations as-of issued_at.
      assumptions_report:
        range: Assumption
        multivalued: true
        inlined_as_list: true
        description: >-
          Aggregated tool / measurement / framework assumptions that
          shaped this QDS. Built by qds_emit.py from
          tool.assumptions[] (joined via measurement.oracle_tool_ref) +
          measurement.assumptions[] + eval_run.assumptions[]. Anyone
          citing this QDS sees the full inferential basis without
          having to dig into per-tool docs.
      headline_verdict:
        description: One-paragraph pinned summary as of issued_at.

  IdentityBlock:
    description: Identity facts about the structure being evaluated.
    attributes:
      id:
        identifier: true
        required: true
      pdb_id:
      emdb_id:
      alphafold_id:
      method:
        range: RefinementMethod
      resolution_a:
        range: float
      space_group:
      description:

  GeometrySummary:
    description: Headline geometry numbers as of QDS issue date.
    attributes:
      id:
        identifier: true
        required: true
      clashscore:
        range: TypedMeasurementValue
        inlined: true
      ramachandran_outliers_pct:
        range: TypedMeasurementValue
        inlined: true
      ramachandran_favored_pct:
        range: TypedMeasurementValue
        inlined: true
      rotamer_outliers_pct:
        range: TypedMeasurementValue
        inlined: true
      molprobity_score:
        range: TypedMeasurementValue
        inlined: true
      bond_rmsd_a:
        range: TypedMeasurementValue
        inlined: true
      angle_rmsd_deg:
        range: TypedMeasurementValue
        inlined: true
      bond_rmsz:
        range: TypedMeasurementValue
        inlined: true
        description: >-
          Bond-length RMSZ (Z-score against restraint targets). Over-
          refinement diagnostic — a model with small absolute RMSD can
          still be a high-Z outlier relative to its restraints.
          See ref/quality_reporting.md §1.2.
      angle_rmsz:
        range: TypedMeasurementValue
        inlined: true
        description: >-
          Bond-angle RMSZ (Z-score against restraint targets). Same
          over-refinement diagnostic as bond_rmsz.
      cbeta_deviations_count:
        range: TypedMeasurementValue
        inlined: true
        description: Number of Cβ-deviation outliers (> 0.25 Å from ideal).
      ramachandran_z_score:
        range: TypedMeasurementValue
        inlined: true
        description: Ramachandran-Z distribution score against a high-resolution reference.
      packing_z_score:
        range: TypedMeasurementValue
        inlined: true
        description: Packing-quality Z-score against a structural reference distribution.
      unsatisfied_buried_hbond_count:
        range: TypedMeasurementValue
        inlined: true
        description: Count of buried polar groups lacking a satisfying hydrogen bond.

  RefinementSummary:
    description: Headline R-factors as of QDS issue date (X-ray refinement only).
    attributes:
      id:
        identifier: true
        required: true
      r_work:
        range: TypedMeasurementValue
        inlined: true
      r_free:
        range: TypedMeasurementValue
        inlined: true
      r_free_gap:
        range: TypedMeasurementValue
        inlined: true
      r_free_trajectory_stability:
        range: TypedMeasurementValue
        inlined: true
        description: Stability of the R-free trajectory across refinement rounds.
      diffraction_precision_index:
        range: TypedMeasurementValue
        inlined: true
        description: Diffraction precision index estimate of coordinate precision.

  MapSummary:
    description: >-
      Headline map quality numbers as of QDS issue date (cryo-EM only).
      Tracks the metrics ref/quality_reporting.md §1.4 calls out as
      load-bearing: CC family, model-map FSC, EMRinger / Q-score, and
      local-resolution spread. Per the EMDataResource 2019 challenge
      consensus, ≥ 3 metrics from different families should be
      reported (e.g. CC_mask + EMRinger + d_FSC_model).
    attributes:
      id:
        identifier: true
        required: true
      cc_mask:
        range: TypedMeasurementValue
        inlined: true
      cc_box:
        range: TypedMeasurementValue
        inlined: true
        description: >-
          Map-model correlation in the full box. If much lower than
          cc_mask, suspect over-sharpening or artifacts outside the
          molecule.
      cc_volume:
        range: TypedMeasurementValue
        inlined: true
        description: Map-model correlation in the high-density volume envelope.
      emringer_score:
        range: TypedMeasurementValue
        inlined: true
        description: >-
          Side-chain–density agreement metric (Barad et al. 2015).
          Resolution-sensitive; > 1.5 is good at high resolution.
      mean_q_score:
        range: TypedMeasurementValue
        inlined: true
        description: >-
          Mean atom-resolvability Q-score (Pintilie 2020). Per-atom by
          construction; surface the mean here and the per-residue array
          via PerResidueQuality.q_score_per_residue when available.
      d_fsc_model_a:
        range: TypedMeasurementValue
        inlined: true
        description: Resolution at which model-map FSC = 0.5.
      global_fsc_0143_a:
        range: TypedMeasurementValue
        inlined: true
        description: >-
          Global FSC resolution at 0.143 (gold-standard half-map FSC).
          Compare to d_fsc_model_a — if d_fsc_model >> global_fsc the
          model is under-fitting; if << it's noise-fitting.
      local_resolution_mean_a:
        range: TypedMeasurementValue
        inlined: true
      local_resolution_std_a:
        range: TypedMeasurementValue
        inlined: true
        description: Standard deviation of local-resolution distribution.
      directional_resolution_anisotropy:
        range: TypedMeasurementValue
        inlined: true
        description: Directional resolution anisotropy from 3DFSC-style analysis.
      local_model_map_fsc_q:
        range: TypedMeasurementValue
        inlined: true
        description: Local FSC-Q or equivalent per-model-map agreement summary.
      rscc_outlier_fraction:
        range: TypedMeasurementValue
        inlined: true
        description: Fraction of residues with poor real-space correlation.

  CrossToolCoverage:
    description: >-
      Per-metric/context summary of which tool families confirmed each claim.
      The point of the QDS is to make it obvious where the trust model is
      strong (cctbx + non-cctbx agree) vs weak (cctbx only).
    attributes:
      id:
        identifier: true
        required: true
      task_coverage:
        range: TaskCoverage
        multivalued: true
        inlined_as_list: true

  TaskCoverage:
    description: >-
      One claim-level row in CrossToolCoverage. Coverage is keyed by metric and
      comparison context; an unrelated oracle on the same task cannot close it.
    attributes:
      id:
        identifier: true
        required: true
      catalog_task_ref:
        range: CatalogTaskId
        required: true
      metric_definition_ref:
        range: MetricDefinition
        description: Metric whose claim-level oracle coverage is summarized.
      subject_ref:
        range: string
        description: Concrete subject whose coverage is summarized.
      reference_subject_ref:
        range: string
        description: Native/reference subject whose comparison coverage is summarized.
      stage:
        range: Stage
      scope:
        range: MeasurementScope
      scope_selector:
        description: Comparison subset whose coverage is summarized.
      cctbx_oracles:
        range: Tool
        multivalued: true
      non_cctbx_oracles:
        range: Tool
        multivalued: true
      gap_status:
        description: >-
          Free-text (e.g. "closed", "closed at clashscore", "open — needs
          standalone Rama-Z"). Settling into an enum once we see more data.

  CrossToolWaiver:
    description: >-
      A machine-readable, claim-scoped exception to the trust-model invariant
      that no gradeable applied task may rest on cctbx-only evidence
      (#315). Declared on the EvaluationRun and surfaced verbatim in the
      QDS; the emitter fails hard on a cctbx-only or unclassifiable
      coverage row with no unambiguous matching waiver. Legacy task-only
      waivers are accepted only when the task has one gated claim. A waiver
      is a named, dated admission — not a pass.
    attributes:
      id:
        identifier: true
        required: true
      catalog_task_ref:
        range: CatalogTaskId
        required: true
      metric_definition_ref:
        range: MetricDefinition
        description: Metric waived; required when a task has multiple gated claims.
      subject_ref:
        range: string
      reference_subject_ref:
        range: string
      stage:
        range: Stage
      scope:
        range: MeasurementScope
      scope_selector:
        description: Comparison subset waived.
      reason:
        required: true
        description: >-
          Why no non-cctbx oracle ran — name the missing tool or the
          documented no-equivalent gap, not a restatement of the fact.
      as_of_date:
        range: date
        required: true

  # ---------------------------------------------- new summary sub-blocks

  DataQualitySummary:
    description: >-
      X-ray data-quality numbers — bound the model quality from below.
      Live in the QDS for X-ray structures; absent for cryo-EM and
      predicted. Sources: data-processing log, phenix.xtriage,
      CCP4 aimless, gemmi.
    attributes:
      id:
        identifier: true
        required: true
      completeness_overall_pct:
        range: TypedMeasurementValue
        inlined: true
      completeness_outer_shell_pct:
        range: TypedMeasurementValue
        inlined: true
      mean_i_over_sigma_outer:
        range: TypedMeasurementValue
        inlined: true
      cc_half_outer:
        range: TypedMeasurementValue
        inlined: true
      r_merge:
        range: TypedMeasurementValue
        inlined: true
      r_meas:
        range: TypedMeasurementValue
        inlined: true
      wilson_b:
        range: TypedMeasurementValue
        inlined: true

  PredictedConfidenceSummary:
    description: >-
      AlphaFold/RoseTTAFold confidence summary. Mean pLDDT alone is
      insufficient — distribution shape is what tells you whether a
      model is uniformly confident or hides disordered regions.
    attributes:
      id:
        identifier: true
        required: true
      predictor:
        description: e.g. AlphaFold2, AlphaFold3, RoseTTAFold, ESMFold.
      predictor_version:
      mean_plddt:
        range: TypedMeasurementValue
        inlined: true
      plddt_distribution_shape:
        range: PlddtDistributionShape
      pae_max_a:
        range: TypedMeasurementValue
        inlined: true
        description: Maximum PAE in Å across the matrix.
      pae_multimer_block_min_a:
        range: TypedMeasurementValue
        inlined: true
        description: >-
          For multimers — the minimum PAE in the off-diagonal block
          between subunits. Low values indicate confident inter-subunit
          placement; > 15 Å typically unreliable.
      predicted_tm_score:
        range: TypedMeasurementValue
        inlined: true
        description: Predicted TM-score (pTM) for the model.
      interface_predicted_tm_score:
        range: TypedMeasurementValue
        inlined: true
        description: Interface predicted TM-score (ipTM) for multimers.
      prediction_ensemble_convergence:
        range: TypedMeasurementValue
        inlined: true
        description: Convergence score across prediction ensemble replicates.

  PackingSummary:
    description: Packing and buried-H-bond diagnostics that complement generic geometry.
    attributes:
      id:
        identifier: true
        required: true
      packing_z_score:
        range: TypedMeasurementValue
        inlined: true
      unsatisfied_buried_hbond_count:
        range: TypedMeasurementValue
        inlined: true
      b_factor_outlier_z:
        range: TypedMeasurementValue
        inlined: true

  ClassificationSummary:
    description: Secondary-structure, domain, and fold-classification assignments.
    attributes:
      id:
        identifier: true
        required: true
      secondary_structure_agreement:
        description: Fraction of residues on which two independent secondary-structure
          assigners agree (three-state). Currently informational for the oracle pair
          pending exact-denominator recalibration.
        range: TypedMeasurementValue
        inlined: true
      secondary_structure_content:
        description: Fraction of DSSP-scored residues assigned helix or strand (H+E).
        range: TypedMeasurementValue
        inlined: true
      secondary_structure_assignment:
        range: TypedMeasurementValue
        inlined: true
      structural_domain_assignment:
        range: TypedMeasurementValue
        inlined: true
      fold_classification:
        range: TypedMeasurementValue
        inlined: true
      secondary_structure_assignments:
        range: SecondaryStructureAssignment
        multivalued: true
        inlined_as_list: true
      domain_assignments:
        range: DomainAssignment
        multivalued: true
        inlined_as_list: true

  InterfaceQualitySummary:
    description: Interface and biological-assembly quality summary.
    attributes:
      id:
        identifier: true
        required: true
      interface_buried_surface_area:
        range: TypedMeasurementValue
        inlined: true
      interface_dockq_score:
        range: TypedMeasurementValue
        inlined: true
      capri_interface_quality_class:
        range: TypedMeasurementValue
        inlined: true
      interface_qualities:
        range: InterfaceQuality
        multivalued: true
        inlined_as_list: true

  PredictionEnsembleSummary:
    description: Prediction ensemble convergence and replicate quality.
    attributes:
      id:
        identifier: true
        required: true
      prediction_ensemble_convergence:
        range: TypedMeasurementValue
        inlined: true
      prediction_ensemble_qualities:
        range: PredictionEnsembleQuality
        multivalued: true
        inlined_as_list: true

  NmrValidationSummary:
    description: NMR restraint and ensemble validation summary.
    attributes:
      id:
        identifier: true
        required: true
      nmr_restraint_violation_summary:
        range: TypedMeasurementValue
        inlined: true
      nmr_ensemble_precision_rmsd:
        range: TypedMeasurementValue
        inlined: true
      nmr_ensemble_qualities:
        range: NmrEnsembleQuality
        multivalued: true
        inlined_as_list: true

  PairwiseComparison:
    description: >-
      Candidate vs reference structure comparison. Modern default per
      ref/quality_reporting.md is to report TM-score AND lDDT as a
      mandatory pair (CASP15+ consensus, Mariani et al. 2013); CA RMSD
      is reported additionally for legibility but is not the basis of
      the verdict on its own.
    mixins:
      - SourceRowLineage
    attributes:
      id:
        identifier: true
        required: true
      subject_ref:
        range: string
        description: Concrete candidate artefact compared by this row.
      reference_subject_ref:
        range: string
        description: Concrete reference artefact used by this comparison.
      candidate_ref:
        range: Structure
        required: true
      reference_ref:
        range: Structure
        required: true
      reference_kind:
        range: ReferenceKind
        required: true
      alignment_method:
        required: true
        description: >-
          Tool used for the alignment that backs every metric in this
          row (e.g. "TMalign", "phenix.superpose_models", "gemmi align",
          "ChimeraX matchmaker"). State exactly one — different tools
          give subtly different alignments.
      atoms_aligned:
        description: e.g. "Cα", "all-atom", "main-chain".
      residues_aligned:
        range: integer
      tm_score:
        range: TypedMeasurementValue
        inlined: true
      lddt:
        range: TypedMeasurementValue
        inlined: true
      gdt_ts:
        range: TypedMeasurementValue
        inlined: true
      gdt_ha:
        range: TypedMeasurementValue
        inlined: true
      ca_rmsd_a:
        range: TypedMeasurementValue
        inlined: true
      per_residue_max_displacement_a:
        range: TypedMeasurementValue
        inlined: true
      delta_r_free:
        range: TypedMeasurementValue
        inlined: true
        description: ΔR-free (candidate − baseline). Always quote `delta_baseline`.
      delta_cc_mask:
        range: TypedMeasurementValue
        inlined: true
        description: ΔCC_mask for cryo-EM, same baseline rules as delta_r_free.
      delta_baseline:
        range: DeltaBaseline
        description: Required when any delta_* slot is populated.
      verdict:
        description: improved / equivalent / worse / incomparable, with rationale.

  # ----------------------------------------------- tool recommendations

  ToolRecommendation:
    description: >-
      A ranked recommendation tying a Tool to a (MetricDefinition, role)
      pair. `top_considered` reflects literature/community consensus
      ("the canonical tool for this metric"); `top_performing` reflects
      empirical results within this harness ("the tool that has done
      best on this metric in our evaluations"). Often the same tool
      fills both roles; when they differ, both rows exist and a
      downstream consumer can compare. Stable across evaluations until
      the recommendation is consciously updated; bump `as_of_date` when
      that happens, don't mutate in place.
    attributes:
      id:
        identifier: true
        required: true
      metric_definition_ref:
        range: MetricDefinition
        required: true
      tool_ref:
        range: Tool
        required: true
      role:
        range: RecommendationRole
        required: true
      rank:
        range: integer
        description: 1 = primary recommendation, 2+ = alternatives in order.
      justification:
        description: >-
          One-line rationale ("CASP gold standard for fold similarity";
          "matches PHENIX within 0.03 Å on 1SAR eval"). Cite the source
          paper or the EvaluationRun id that supplies the evidence.
      evidence_refs:
        range: string
        multivalued: true
        description: >-
          Citation keys (e.g. "Zhang2004", "Williams2018") and/or
          EvaluationRun ids that support this recommendation.
      as_of_date:
        range: date
      effective_at:
        range: datetime
        description: >-
          Exact timezone-qualified activation instant used for immutable QDS
          time slicing. Required for canonical registry rows.
      supersedes_recommendation_ref:
        range: ToolRecommendation
        description: >-
          Earlier dated recommendation revision retired by this row. Keep the
          predecessor in the registry so older immutable QDS snapshots remain
          reproducible; emission selects the newest active lineage member.
      notes:

  # ---------------------------------------- residue / site / ligand v2

  ResidueRef:
    description: >-
      A pointer to a specific residue in a specific chain. Used by
      ResidueOutlier, PerResidueValue, and Site.member_residue_refs.
      Identifier composes the structure id + chain id + residue number
      so a given residue is identifiable across runs.
    attributes:
      id:
        identifier: true
        required: true
        description: e.g. "1sar:A:33" (structure_ref:chain_id:residue_number).
      structure_ref:
        range: Structure
        required: true
      chain_id:
        required: true
        description: PDB chain identifier (typically a single letter).
      residue_number:
        range: integer
        required: true
      residue_name:
        description: Three-letter code (ASN, TYR, HIS, ...).
      insertion_code:
        description: PDB insertion code where present (rare).

  ResidueOutlier:
    description: >-
      One residue flagged by a validation tool. A residue can have
      multiple ResidueOutlier rows (e.g. both a Ramachandran and a
      rotamer outlier). The bare existence of this row is the
      assertion; the numeric magnitude lives on `metric_value`.
    mixins:
      - SourceRowLineage
    attributes:
      id:
        identifier: true
        required: true
      subject_ref:
        range: string
        description: Concrete model or artefact on which this outlier was measured.
      residue_ref:
        range: ResidueRef
        required: true
      outlier_kind:
        range: ResidueOutlierKind
        required: true
      severity:
        range: Severity
      tool_ref:
        range: Tool
      metric_value:
        range: TypedMeasurementValue
        inlined: true
        description: >-
          Numeric magnitude of the outlier (e.g. clash overlap in Å,
          rotamer χ deviation in degrees, RSRZ z-score). The kind
          determines the unit; cite it on the MeasurementValue.
      details:
        description: Free-text annotation (e.g. "ω = 8.91° non-Pro cis").

  DensityPeak:
    description: >-
      A difference-density (mFo−DFc) peak that is not explained by the
      modelled atoms. Positive peaks = unmodelled mass; negative peaks
      = modelled atoms with no density support. The driving example
      includes peaks > 4σ as a critical eval signal.
    mixins:
      - SourceRowLineage
    attributes:
      id:
        identifier: true
        required: true
      subject_ref:
        range: string
        description: Concrete model or map artefact in which this peak was measured.
      sigma_level:
        range: float
        required: true
        description: Signed peak height in σ (positive blob, negative hole).
      coordinates_xyz:
        range: float
        multivalued: true
        description: Cartesian coordinates [x, y, z] in Å.
      nearest_atom_residue_ref:
        range: ResidueRef
      nearest_atom_distance_a:
        range: float
      interpretation:
        description: >-
          Free-text classification by the agent or harness:
          "unmodelled water", "Ca²⁺ ion", "side-chain alt conf",
          "noise", "unmodelled solvent", etc.
      tool_ref:
        range: Tool
        description: Tool that produced the peak list (e.g. phenix.find_peaks_holes).

  FlaggedRegion:
    description: >-
      A contiguous stretch of residues with an issue (disordered loop,
      poor-density region, dense clash region, ...). Useful when the
      problem is a region rather than a single residue.
    mixins:
      - SourceRowLineage
    attributes:
      id:
        identifier: true
        required: true
      subject_ref:
        range: string
        description: Concrete model or artefact containing this flagged region.
      structure_ref:
        range: Structure
        required: true
      chain_id:
        required: true
      residue_start:
        range: integer
        required: true
      residue_end:
        range: integer
        required: true
      kind:
        range: FlaggedRegionKind
        required: true
      severity:
        range: Severity
      summary:
        description: One-line human description of why the region is flagged.

  PerResidueValue:
    description: >-
      A scalar paired with a residue ref. Used by PerResidueQuality.
      `metric_definition_ref` is required so the QDS emitter can route
      each value to the correct per-residue array (lDDT vs displacement
      vs RSRZ vs Ramachandran-Z) without substring heuristics.
    mixins:
      - SourceRowLineage
    attributes:
      id:
        identifier: true
        required: true
      subject_ref:
        range: string
        description: Concrete model or artefact on which this value was measured.
      residue_ref:
        range: ResidueRef
        required: true
      metric_definition_ref:
        range: MetricDefinition
        required: true
        description: >-
          Catalog metric this value measures. Routing in the QDS emitter
          uses this id (not a name or substring) to pick the per-residue
          slot (lddt_per_residue, displacement_per_residue_a, ...).
      value:
        range: TypedMeasurementValue
        inlined: true
      tool_ref:
        range: Tool

  PerResidueQuality:
    description: >-
      Local-quality block for one structure: per-residue lDDT or
      displacement, outlier residues, density-difference peaks, and
      flagged regions. Lives on QualityDataSheet.per_residue_quality.
    attributes:
      id:
        identifier: true
        required: true
      lddt_per_residue:
        range: PerResidueValue
        multivalued: true
        inlined_as_list: true
      displacement_per_residue_a:
        range: PerResidueValue
        multivalued: true
        inlined_as_list: true
      ramachandran_z_per_residue:
        range: PerResidueValue
        multivalued: true
        inlined_as_list: true
      rsrz_per_residue:
        range: PerResidueValue
        multivalued: true
        inlined_as_list: true
        description: >-
          Real-space R-factor Z-score per residue (wwPDB validation).
          RSRZ > 2 flags poor real-space density agreement for that
          residue.
      rscc_per_residue:
        range: PerResidueValue
        multivalued: true
        inlined_as_list: true
        description: Per-residue real-space correlation coefficient.
      b_factor_z_per_residue:
        range: PerResidueValue
        multivalued: true
        inlined_as_list: true
        description: Per-residue B-factor Z-score against local/model distribution.
      secondary_structure_per_residue:
        range: PerResidueValue
        multivalued: true
        inlined_as_list: true
        description: Per-residue secondary-structure labels encoded as measurement values.
      fsc_q_per_residue:
        range: PerResidueValue
        multivalued: true
        inlined_as_list: true
        description: Per-residue FSC-Q or equivalent local model-map agreement values.
      outliers:
        range: ResidueOutlier
        multivalued: true
        inlined_as_list: true
      density_peaks:
        range: DensityPeak
        multivalued: true
        inlined_as_list: true
        description: Δρ peaks above the configured σ threshold (typically > 4σ).
      flagged_regions:
        range: FlaggedRegion
        multivalued: true
        inlined_as_list: true

  SecondaryStructureAssignment:
    description: DSSP/STRIDE-style assignment for a residue range.
    mixins:
      - SourceRowLineage
    attributes:
      id:
        identifier: true
        required: true
      subject_ref:
        range: string
        description: Concrete model or artefact receiving this assignment.
      structure_ref:
        range: Structure
        required: true
      chain_id:
        required: true
      residue_start:
        range: integer
        required: true
      residue_end:
        range: integer
        required: true
      assignment:
        required: true
        description: Secondary-structure label or code (e.g. helix, sheet, coil, H, E).
      confidence:
        range: TypedMeasurementValue
        inlined: true
      tool_ref:
        range: Tool
      notes:

  DomainAssignment:
    description: Structural domain and fold-classification assignment.
    mixins:
      - SourceRowLineage
    attributes:
      id:
        identifier: true
        required: true
      subject_ref:
        range: string
        description: Concrete model or artefact receiving this domain assignment.
      structure_ref:
        range: Structure
        required: true
      chain_id:
        description: Chain containing the assigned domain.
      residue_start:
        range: integer
      residue_end:
        range: integer
      classification_scheme:
        description: CATH, SCOPe, ECOD, or another named scheme.
      classification_id:
        description: Scheme-specific identifier.
      fold_name:
        description: Human-readable fold/class name.
      domain_label:
        description: Local stable label for this domain assignment.
      confidence:
        range: TypedMeasurementValue
        inlined: true
      tool_ref:
        range: Tool
      notes:

  InterfaceQuality:
    description: Structured quality record for one interface or assembly contact.
    mixins:
      - SourceRowLineage
    attributes:
      id:
        identifier: true
        required: true
      structure_ref:
        range: Structure
        required: true
      subject_ref:
        range: string
        description: Concrete model or assembly on which this interface was measured.
      reference_subject_ref:
        range: string
        description: Concrete native/reference model against which DockQ was measured.
      interface_label:
        description: Stable local label for the interface.
      chain_id_1:
        description: First partner chain or component selector.
      chain_id_2:
        description: Second partner chain or component selector.
      model_to_native_chain_mapping:
        description: Explicit DockQ mapping in MODELCHAINS:NATIVECHAINS form.
      partner_1_selector:
        description: Free-text selector for partner 1 when a chain id is insufficient.
      partner_2_selector:
        description: Free-text selector for partner 2 when a chain id is insufficient.
      buried_surface_area:
        range: TypedMeasurementValue
        inlined: true
      dockq_score:
        range: TypedMeasurementValue
        inlined: true
      capri_quality_class:
        range: TypedMeasurementValue
        inlined: true
      tool_ref:
        range: Tool
      evidence_refs:
        range: string
        multivalued: true
        description: Retained raw outputs supporting the interface scores and mapping.
      notes:

  NmrEnsembleQuality:
    description: Structured NMR ensemble/restraint validation record.
    mixins:
      - SourceRowLineage
    attributes:
      id:
        identifier: true
        required: true
      subject_ref:
        range: string
        description: Concrete NMR ensemble artefact summarized by this row.
      structure_ref:
        range: Structure
        required: true
      ensemble_label:
      model_count:
        range: integer
      restraint_violation_summary:
        range: TypedMeasurementValue
        inlined: true
      ensemble_precision_rmsd:
        range: TypedMeasurementValue
        inlined: true
      tool_ref:
        range: Tool
      notes:

  PredictionEnsembleQuality:
    description: Structured predicted-model ensemble convergence record.
    mixins:
      - SourceRowLineage
    attributes:
      id:
        identifier: true
        required: true
      subject_ref:
        range: string
        description: Concrete prediction-ensemble artefact summarized by this row.
      structure_ref:
        range: Structure
        required: true
      ensemble_label:
      model_count:
        range: integer
      convergence:
        range: TypedMeasurementValue
        inlined: true
      diversity:
        range: TypedMeasurementValue
        inlined: true
      tool_ref:
        range: Tool
      notes:

  Ligand:
    description: >-
      A non-protein component of the structure: small-molecule ligand,
      ion, cofactor, or covalent modification. Identified by chemical
      component dictionary (CCD) code where possible. Coordinates and
      B-factor make every claim about a specific ion / ligand position
      independently verifiable.
    attributes:
      id:
        identifier: true
        required: true
        description: e.g. "1sar:A:Ca33" (structure:chain:CCD+resnum).
      subject_ref:
        range: string
        description: Concrete model or artefact containing this ligand.
      structure_ref:
        range: Structure
        required: true
      pdb_chemical_id:
        description: CCD three-letter code (ATP, FAD, CA for calcium, ...).
      smiles:
      chain_id:
      residue_number:
        range: integer
      partial_occupancy:
        range: boolean
        description: True when the ligand is modelled at occupancy < 1.
      coordinates_xyz:
        range: float
        multivalued: true
        description: >-
          Cartesian coordinates of the ligand centre (or the metal-ion
          atom for ions) in Å. A list of three floats [x, y, z]. Lets
          a downstream consumer cross-check the agent's stated position
          against the deposited PDB coordinates.
      b_factor:
        range: TypedMeasurementValue
        inlined: true
        description: >-
          Atomic B-factor (Å²) of the ligand or its central atom.
          For ions this is the single-atom B; for molecules it is the
          mean over the ligand atoms.
      coordination_contacts:
        range: CoordinationContact
        multivalued: true
        inlined_as_list: true
        description: >-
          Inner-sphere / outer-sphere atom-atom contacts that define
          the coordination geometry for ions and the H-bond network
          for organic ligands. Each row is one atom-atom distance
          measurement.

  LigandQuality:
    description: >-
      Real-space and geometric quality metrics for a bound ligand.
      Catalog T10 (ligand fitting) defines these; the QDS surfaces them
      so a downstream consumer can verify the binding site is not
      misfit. Required when a ligand is present and the structure
      claims biological relevance for it.
    attributes:
      id:
        identifier: true
        required: true
      ligand_ref:
        range: Ligand
        required: true
      rscc:
        range: TypedMeasurementValue
        inlined: true
        description: Real-space correlation coefficient. > 0.85 = good fit.
      rsr:
        range: TypedMeasurementValue
        inlined: true
        description: Real-space R. < 0.20 = good fit at typical resolutions.
      ligand_b_factor_mean:
        range: TypedMeasurementValue
        inlined: true
      ligand_b_factor_vs_surroundings:
        range: TypedMeasurementValue
        inlined: true
        description: >-
          Ratio of ligand mean B to surrounding-protein mean B. > 1.5
          can indicate partial occupancy or weak binding.
      protein_ligand_hbond_count:
        range: TypedMeasurementValue
        inlined: true
      pose_rmsd_to_deposited_a:
        range: TypedMeasurementValue
        inlined: true
        description: RMSD of the ligand pose to a deposited reference complex.
      element_identity:
        range: TypedMeasurementValue
        inlined: true
        description: >-
          Oracle assessment of the modelled chemical element. Candidate-specific
          numeric evidence remains in the source EvaluationRun; this field carries
          the citable ligand-level conclusion.

  Assumption:
    description: >-
      One documented assumption that affects how a measurement, tool,
      or report should be interpreted. Assumptions are first-class
      because they're the inferential basis the QDS rests on — a
      number paired with its assumption set is reproducible; a number
      alone is not. See ref/quality_reporting.md and the skill's
      "Tool assumptions" / "Agentic-framework assumptions" sections
      for the canonical catalog.
    attributes:
      id:
        identifier: true
        required: true
      as_of_date:
        range: date
        description: >-
          Date this registry assumption became active. Required for rows in
          ref/tool_assumptions.yaml so immutable QDS emission can exclude
          assumptions introduced after the sheet was issued; embedded
          measurement/run assumptions are already pinned by their source EVAL.
      effective_at:
        range: datetime
        description: >-
          Exact timezone-qualified activation instant for rows in
          ref/tool_assumptions.yaml. Embedded EVAL assumptions do not need it.
      supersedes_assumption_ref:
        range: Assumption
        description: >-
          Earlier dated registry assumption revision retired by this row. The
          predecessor remains available to QDS snapshots issued before this
          row became active.
      kind:
        range: AssumptionKind
        required: true
      scope:
        range: AssumptionScope
        required: true
      title:
        required: true
        description: One-line label for the assumption (used in QDS table headers).
      description:
        required: true
        description: What the assumption is, in prose.
      consequences:
        description: >-
          What can go wrong if the assumption is violated — the
          mechanism by which the affected number could be misleading.
      mitigation:
        description: >-
          What check, cross-tool comparison, or follow-up oracle would
          catch a violation. Should be runnable.
      status:
        range: AssumptionStatus
      tool_ref:
        range: Tool
        description: When the assumption is tool-level, point at the tool.
      measurement_ref:
        range: MeasurementValue
        description: When the assumption is measurement-level, point at the measurement.
      evidence_refs:
        range: string
        multivalued: true
        description: >-
          Citations or EvaluationRun ids supporting the assumption's
          presence (e.g. cite the paper documenting the tool's default,
          or the eval that observed a violation).
      notes:

  CoordinationContact:
    description: >-
      One atom-atom distance recorded at a coordination / contact site.
      Ions carry these as Ligand.coordination_contacts[]; the list of
      contacts plus their distances is exactly what defines the metal
      coordination geometry.
    attributes:
      id:
        identifier: true
        required: true
      atom1_residue_ref:
        range: ResidueRef
        description: Residue containing the first atom (None for ligand-side).
      atom1_atom_name:
        description: PDB atom name (e.g. "OD2", "CA", "O", "ZN").
      atom2_residue_ref:
        range: ResidueRef
      atom2_atom_name:
      ligand_ref:
        range: Ligand
        description: Set when one side of the contact is the ion / ligand itself.
      distance_a:
        range: TypedMeasurementValue
        inlined: true
        description: Distance in Å.
      kind:
        range: ContactKind
      notes:

  Site:
    description: >-
      A named region of biological / structural interest — active
      site, binding site, protein-protein interface, metal-coordination
      sphere. Defined by an explicit set of member residues so quality
      metrics can be computed per-site rather than per-whole-structure.
    attributes:
      id:
        identifier: true
        required: true
      subject_ref:
        range: string
        description: Concrete model or artefact containing this site.
      structure_ref:
        range: Structure
        required: true
      kind:
        range: SiteKind
        required: true
      member_residue_refs:
        range: ResidueRef
        multivalued: true
        required: true
      ligand_ref:
        range: Ligand
        description: Ligand bound at this site, if any.
      description:

  SiteQuality:
    description: >-
      Site-scoped quality metrics. Lives on QualityDataSheet.site_qualities[].
      The fields are deliberately overlapping with GeometrySummary so the
      consumer can compare the site to the global average — a structure
      with great global geometry but a wrecked active site is still a
      bad model for its intended function.
    attributes:
      id:
        identifier: true
        required: true
      site_ref:
        range: Site
        required: true
      site_rmsd_to_reference_a:
        range: TypedMeasurementValue
        inlined: true
        description: RMSD over member_residue_refs vs the reference structure's same site.
      mean_per_residue_lddt:
        range: TypedMeasurementValue
        inlined: true
      mean_b_factor:
        range: TypedMeasurementValue
        inlined: true
      site_clashscore:
        range: TypedMeasurementValue
        inlined: true
        description: Clashscore restricted to atoms within the site's member residues.
      site_ramachandran_outlier_count:
        range: TypedMeasurementValue
        inlined: true
      site_density_peaks:
        range: DensityPeak
        multivalued: true
        inlined_as_list: true
      ligand_quality:
        range: LigandQuality
        inlined: true
        description: Required when site.ligand_ref is set.
